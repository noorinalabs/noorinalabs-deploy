# lychee link-checker config for noorinalabs-deploy docs (#326).
#
# Purpose: catch BROKEN INTERNAL cross-references between docs. deploy's runbooks
# and ADRs link to each other heavily (e.g. runbooks reference ADRs by relative
# path, the RUNBOOK indexes the runbooks/ tree); a renamed or missing target is a
# real defect. External-URL liveness is intentionally NOT gated here — it depends
# on third-party uptime and would make CI flaky and non-deterministic (a 503 on
# some unrelated site should never block a docs PR). External links are excluded;
# internal/relative links are checked.

# Only check local filesystem + relative links; skip all remote schemes.
scheme = ["file"]

# Treat these as offline-only — never make network requests.
offline = true

# Exclude link targets that are not real broken-link signals.
exclude = [
  # mailto / anchors handled separately; bare example hosts in prose.
  '^https?://',
  '^mailto:',
  # GitHub issue/PR shorthand like `#322` is not a URL.
  '^#\d+$',
  # Cross-repo pointers from RUNBOOK.md into PARENT-repo (noorinalabs-main)
  # artifacts that are NOT present in this child checkout: the org charter
  # split-files live at the parent's .claude/team/charter/, and the org
  # ontology at the parent's ontology/. These are written as repo-relative
  # links but resolve in the parent tree, which is .gitignore'd out of this
  # repo — so they can never resolve here and are not intra-repo breakage.
  # Scoped narrowly so real broken intra-repo cross-references still fail.
  '\.claude/team/charter/.*\.md$',
  'ontology/repos/.*\.yaml$',
]

# Skip generated/vendored trees.
exclude_path = [
  # In-repo project-memory corpus (seeded deploy#479, from main#740 / driver
  # main#732) — uses [[wikilink]] shorthand and bare refs, not lychee-checkable
  # relative links; excluded like the other append-only records.
  ".claude/memory",
  "node_modules",
  ".venv",
]

# A relative link with no matching file is the failure we DO want to surface.
require_https = false
