global:
  resolve_timeout: 5m

# STG alertmanager config (deploy#262 receiver wiring; deploy#263 per-env split).
#
# See alertmanager.prod.yml for the receiver-wiring rationale and the
# api_url_file pattern. The only stg-vs-prod difference is the Slack channel
# target (`#stg-alerts` instead of `#prod-alerts`) — the webhook URL itself is
# the same workspace-level webhook, gated by the `SLACK_WEBHOOK_URL` secret in
# the `staging` GitHub Environment.
#
# Stg alerts are intentionally less aggressive: `repeat_interval` 8h for default
# (vs 4h prod) so noise from stg-specific churn doesn't drown out operator
# attention. Critical stays at 1h to preserve incident-grade signal.

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 8h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook_url
        channel: "#stg-alerts"
        send_resolved: true
        title: '[STG {{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

  - name: critical
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook_url
        channel: "#stg-alerts"
        send_resolved: true
        title: '[STG-CRITICAL {{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
