global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # user-service stack exporters (deploy#64). user-service:8000/metrics is NOT
  # scraped here because user-service has no /metrics endpoint yet — tracked
  # in noorinalabs-user-service#124. user-postgres-exporter IS scraped — it
  # has been running in compose since the user-service stack extraction and
  # was silently un-scraped until #64 surfaced the gap.
  - job_name: "user-postgres-exporter"
    static_configs:
      - targets: ["user-postgres-exporter:9187"]

  # kafka-exporter — pipeline broker metrics (deploy#88). Scrapes the
  # exporter's /metrics on :9308. Series exposed:
  #   - kafka_brokers (count) + kafka_topic_partition_* (gauge, ISR/leader/replicas)
  #   - kafka_topic_partition_current_offset / oldest_offset (producer rate via rate())
  #   - kafka_consumergroup_current_offset / lag / lag_in_seconds (populates only
  #     when consumer-group workers from ingest-platform are running; empty-state
  #     pre-consumers is acceptable — broker/topic gauges are still useful).
  # The `up{job="kafka"}` series fires the KafkaBrokerDown alert in alerts.yml.
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Alloy self-metrics scrape (originally added for promtail in deploy#131; migrated
  # to alloy in deploy#132). The alloy container exposes /metrics on :12345
  # (--server.http.listen-addr in compose). The companion `AlloyLogIngestionStopped`
  # alert in alerts.yml fires when `rate(loki_write_sent_entries_total[5m]) == 0` —
  # the documented backstop preserved across the promtail→alloy migration. Alloy's
  # base image ships wget so a container HTTP healthcheck is also enabled in compose,
  # but the metric-rate alert is kept as defense-in-depth.
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]

  # blackbox-exporter — continuous external probe of the same 6 prod
  # routes covered by the post-deploy smoke battery
  # (scripts/verify_prod_smoke.sh). Each target carries a `route` label
  # so alerts and dashboards can identify the probed endpoint without
  # having to URL-decode the __param_target.
  #
  # The relabel pipeline is the standard blackbox pattern:
  #   1. instance label = the URL itself (visible in alerts)
  #   2. __param_target = URL passed to /probe?target=…
  #   3. __address__   = blackbox-exporter:9115 (the actual scrape target)
  #
  # PROD-ONLY targets: see prometheus.stg.yml for the stg counterpart (deploy#263
  # per-env split — stg blackbox was probing prod hostnames pre-split, masking
  # stg-side signal and polluting prod attribution).
  - job_name: "blackbox"
    metrics_path: /probe
    scrape_interval: 60s
    scrape_timeout: 10s
    # Hostnames updated 2026-05-03 (deploy#255) post-emergency cutover:
    # the legacy `isnad-graph.noorinalabs.com` Cloudflare record was
    # destroyed in the 2026-05-02 emergency reconciliation (#226) and
    # all 5 routes below were resolving to NXDOMAIN, leaving blackbox
    # blind on this surface. Companion to deploy#252 / PR#254 which
    # fixed the same root cause on the post-deploy smoke side. Per
    # caddy/Caddyfile the user-service routes (`/auth/*`, JWKS, the
    # `/api/v1/user-service/health` rewrite) are dual-bound on
    # `isnad.{$BASE_DOMAIN}` AND `users.{$BASE_DOMAIN}`; we keep the
    # blackbox surface aligned with the smoke battery (single host
    # `isnad.noorinalabs.com`) so the two probes share an apex. The
    # eventual de-duplication onto `users.*` is tracked in the
    # transitional comment block in caddy/Caddyfile.
    static_configs:
      - targets: ["https://isnad.noorinalabs.com/health"]
        labels: { route: "isnad-health", module: "http_2xx_json" }
      - targets: ["https://isnad.noorinalabs.com/api/v1/user-service/health"]
        labels: { route: "user-service-health", module: "http_2xx" }
      - targets: ["https://noorinalabs.com/"]
        labels: { route: "landing-root", module: "http_2xx" }
      - targets: ["https://isnad.noorinalabs.com/api/v1/narrators?limit=1"]
        labels: { route: "narrator-401", module: "http_401_json" }
      - targets: ["https://isnad.noorinalabs.com/.well-known/jwks.json"]
        labels: { route: "jwks", module: "http_2xx_json" }
      # Path corrected 2026-05-03 (deploy#255 ChangesRequested) lockstep
      # with deploy#256 / PR#258 (Aisha): user-service exposes
      # `/auth/oauth/{provider}/{login,callback}`, never had a flat
      # `/auth/login`. Response shape is HTTP 200 + JSON body with
      # `.authorization_url` (the SPA reads the JSON and navigates the
      # browser — NOT a 302 redirect) so the module is `http_2xx_json`,
      # not `http_3xx`. The label `auth-login-redirect` is kept as the
      # historical name to avoid churning `alerts.yml`'s
      # BlackboxUnexpectedStatus matcher; the implicit "expect HTTP
      # 200" branch in that alert is correct for this route post-fix.
      - targets: ["https://isnad.noorinalabs.com/auth/oauth/google/login"]
        labels: { route: "auth-login-redirect", module: "http_2xx_json" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
