# Pre-commit hooks for noorinalabs-deploy
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Docs:     https://pre-commit.com/
#
# This MIRRORS the repo's CI quality gates so a local commit/push fails fast
# instead of surfacing a lint/format/type error only after a PR is opened
# (Phase-3 end-state criterion #6 / noorinalabs-main#327). The pre-commit <-> CI
# sync-drift gate (.claude/lib/pre_commit_ci_sync.py, wired as a CI job) verifies
# this mirror stays in lockstep — if a future edit drops a kind CI enforces, that
# gate fails the build.
#
# CI gates this mirrors (deploy is IaC/shell/YAML-heavy, so the load-bearing ones
# are terraform-fmt, actionlint, and gitleaks):
#   * terraform fmt + validate ........ terraform.yml
#   * actionlint (workflow lint) ...... lint-workflows.yml + docs.yml
#   * ruff lint + format, mypy ........ hooks-lint.yml (over .claude/hooks/)
#   * gitleaks (secret detection) ..... stricter-local (no CI gate yet; kept)
#
# Stage split (fail-fast, cheapest first):
#   pre-commit (every commit) — terraform fmt/validate, gitleaks, actionlint,
#     ruff-format, ruff-lint, env-example completeness.
#   pre-push   (every push)   — mypy over .claude/hooks/ (heavier; matches the
#     hooks-lint.yml typecheck job, which skips when no hooks are present).
#
# Note on ruff/mypy: this repo is a dispatcher-style child with NO .claude/hooks/
# *.py today, so hooks-lint.yml's ruff/mypy jobs SKIP (nullglob guard) and the
# matching hooks here are scoped to that dir and no-op until hooks land. They are
# present for CI parity (the sync gate classifies hooks-lint.yml as enforcing
# those kinds) so the floor is already in place. Tools are pinned to match CI.

repos:
  # --- Terraform format + validate (mirrors terraform.yml) ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_fmt
        name: terraform-fmt

      - id: terraform_validate
        name: terraform-validate

  # --- Secret detection (stricter-local: kept from the prior config) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: gitleaks

  # --- Workflow lint (mirrors lint-workflows.yml + docs.yml actionlint job) ---
  # Pinned to v1.7.12 — the same version lint-workflows.yml downloads + SHA-
  # verifies, kept in lockstep with the org rollout.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint

  # --- Spellcheck (mirrors the `Spellcheck (cspell)` job in docs.yml) ---
  # The sync-drift gate now classifies the `cspell` kind (noorinalabs-main#684),
  # so a CI-enforced spell gate not mirrored here turns the gate red — same
  # contract as actionlint above. New infra/domain vocabulary then fails
  # `pre-commit run` locally instead of only surfacing as a CI red after push.
  # Pinned to v8.4.0 of cspell-cli to match the exact cspell the
  # `streetsidesoftware/cspell-action@…v8.4.0` CI step bundles — same engine +
  # dictionaries on both sides. `language: node`, so pre-commit provisions its
  # own node/cspell env (no system cspell required).
  #
  # `files` is the regex equivalent of the CI action's authored-prose glob set
  # (docs/, RUNBOOK, CLAUDE.md, the team charter — identical to docs.yml's
  # `files:` and .cspell.json's `files`); `--config .cspell.json` reuses the same
  # dictionaries + ignore rules CI loads, so a word that passes locally passes in
  # CI and vice-versa.
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.4.0
    hooks:
      - id: cspell
        name: cspell
        args: ["--no-must-find-files", "--no-progress", "--no-summary", "--config", ".cspell.json"]
        files: ^(docs/.*\.md|RUNBOOK\.md|CLAUDE\.md|\.claude/team/charter\.md)$

  # --- Python lint/format (mirrors hooks-lint.yml + compose-validate.yml) ---
  # Pinned to ruff 0.15.11 (the org-canonical pin — matches ig/da/us/ingest/main).
  # Scoped to the repo's Python:
  #   * .claude/hooks/ ............ mirrors hooks-lint.yml (no-op today; no hooks)
  #   * scripts/ + .github/workflows/scripts/ + integration-tests/scripts/ ..
  #     mirrors compose-validate.yml's python-lint job (noorinalabs-main#326 +
  #     deploy#500) so local pre-commit catches the same ruff drift CI does
  #     (#327 fail-fast parity). integration-tests/scripts/ holds the GHCR
  #     tag-invariant CLI helpers (deploy#496/#500), formerly ungated.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
        name: ruff-format
        files: ^(\.claude/hooks/|scripts/|integration-tests/scripts/|\.github/workflows/scripts/).*\.py$
      - id: ruff
        name: ruff-lint
        args: [--fix]
        files: ^(\.claude/hooks/|scripts/|integration-tests/scripts/|\.github/workflows/scripts/).*\.py$

  # --- Local hooks ---
  - repo: local
    hooks:
      # The structural-ontology staleness gate was retired with deploy#571 (child
      # rollout of main#939). The structural index is now a gitignored build product
      # (.gitignore → ontology/structural/), regenerated on demand with
      # `python3 scripts/structural_ontology.py emit`, so there is nothing committed
      # to staleness-check. The matching `structural-ontology` CI workflow was deleted;
      # the sync-drift gate stays green because the `structural-ontology` kind is now
      # absent from BOTH sides.
      # Dockerfile Base Image Pinning gate (mirrors dockerfile-base-pin.yml).
      # Enforces tech-decisions.md § Base Image Pinning (noorinalabs-main#735,
      # #744): every FROM digest-pinned (image:tag@sha256:<digest>) AND carrying
      # the matching distro upgrade, with the section's exemptions (scratch,
      # distroless, stage refs, vendor `# RATIONALE:`). Runs over staged
      # Dockerfiles at commit time; CI runs the same script over ALL Dockerfiles.
      # The sync-drift gate classifies this as the `dockerfile-base-pin` kind, so
      # the CI gate cannot drift ahead of this local mirror. pass_filenames=true:
      # pre-commit hands the matched Dockerfile paths to the script as argv.
      - id: dockerfile-base-pin
        name: dockerfile-base-pin
        entry: python3 .claude/lib/check_dockerfile_base_pin.py
        language: system
        files: (^|/)Dockerfile(\.[^/]+)?$
        stages: [pre-commit]
      # mypy over .claude/hooks (mirrors hooks-lint.yml) + scripts/ and
      # .github/workflows/scripts/ (mirrors compose-validate.yml's python-lint
      # job, noorinalabs-main#326). Heavier, so pre-push. The .claude/hooks/
      # arm no-ops when empty (matches the CI skip-when-no-hooks guard); the
      # scripts arm always runs since those dirs are always present. types-PyYAML
      # is needed for check_tf_apply_locking.py's `import yaml` — install it in
      # your pre-commit env (`pip install types-PyYAML`) so mypy matches CI.
      - id: mypy-python
        name: mypy (pre-push)
        entry: |-
          bash -c 'shopt -s nullglob; targets=(scripts .github/workflows/scripts integration-tests/scripts); hooks=(.claude/hooks/*.py); if [ ${#hooks[@]} -gt 0 ]; then targets+=(.claude/hooks); fi; mypy "${targets[@]}" --ignore-missing-imports --no-error-summary'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # pytest over the sync-gate unit tests (mirrors precommit-ci-sync.yml's
      # sync-gate-tests job). Heavier, so pre-push.
      - id: pytest-sync-gate
        name: pytest (pre-push)
        entry: python3 -m pytest .claude/lib/tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # pytest over the scripts/ unit tests (mirrors compose-validate.yml's
      # scripts-pytest job, deploy#428). Covers the KRaft stray-dir detector
      # scripts/kafka_logdir_preflight.sh. Heavier, so pre-push.
      - id: pytest-scripts
        name: pytest-scripts (pre-push)
        entry: python3 -m pytest scripts/tests -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # pytest over integration-tests/scripts/tests (mirrors compose-validate.yml's
      # integration-scripts-pytest job, deploy#500). Covers the GHCR Contract-v6
      # tag-invariant checker (integration-tests/scripts/check_tag_invariants.py).
      # Stdlib-only urllib-mock tests with their own pytest.ini (rootdir isolation
      # from integration-tests/pytest.ini's asyncio config). Heavier, so pre-push.
      - id: pytest-integration-scripts
        name: pytest-integration-scripts (pre-push)
        entry: python3 -m pytest integration-tests/scripts/tests -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # promtool: validate AND unit-test the Prometheus alert rules. Mirrors the
      # `promtool check (rules + config)` job in compose-validate.yml, whose
      # `promtool` kind the sync-drift gate now classifies (deploy#565) — so this
      # mirror is mandatory, not optional. Until #565 the kind was unclassified,
      # the gate said nothing, and its silence was read as parity.
      #
      # `check rules` alone is NOT sufficient and is why the BackupFailure alert
      # sat un-fireable for months: it proves the YAML parses, not that any rule
      # can go red. `test rules` runs the alerts against synthetic series and
      # asserts both firing and quiet states.
      #
      # Pinned to the same prom/prometheus:v3.4.0 image CI uses and compose
      # deploys, so a local pass means a CI pass. Hard-fails (rather than
      # skipping) when docker is unavailable: a check that silently no-ops is the
      # exact failure class these hooks exist to catch.
      - id: promtool-check-rules
        name: promtool-check-rules (pre-push)
        entry: |-
          bash -c 'command -v docker >/dev/null || { echo "promtool-check-rules: docker not found on PATH; this hook mirrors a required CI gate and will not silently skip"; exit 1; }; docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.4.0 check rules alerts.yml'
        language: system
        pass_filenames: false
        files: ^infra/prometheus/
        stages: [pre-push]

      - id: promtool-test-rules
        name: promtool-test-rules (pre-push)
        entry: |-
          bash -c 'command -v docker >/dev/null || { echo "promtool-test-rules: docker not found on PATH; this hook mirrors a required CI gate and will not silently skip"; exit 1; }; docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/etc/prometheus:ro" -w /etc/prometheus prom/prometheus:v3.4.0 test rules alerts_test.yml'
        language: system
        pass_filenames: false
        files: ^infra/prometheus/
        stages: [pre-push]

      # Env file completeness check (carried over from the prior config).
      # NOTE: entry is a YAML literal block scalar (`|-`) because the inline
      # `echo "WARNING: ..."` contains a colon-space that a plain scalar would
      # mis-parse as a mapping (the docs.yml config-lint YAML gate catches this).
      - id: env-example-check
        name: env-example-check
        entry: |-
          bash -c 'docker compose --env-file compose/.env.example -f compose/docker-compose.prod.yml config >/dev/null 2>&1 || echo "WARNING: .env.example may be incomplete (docker compose config failed)"'
        language: system
        pass_filenames: false
        files: (\.env|docker-compose)
        stages: [pre-commit]
