# secret_rotation_inventory.yaml — machine-readable secret-rotation ground truth (deploy#513)
#
# This is the STRUCTURED counterpart of the human-curated docs/secrets-inventory.md.
# The markdown is the readable narrative (owner, env-separation, per-secret runbook);
# THIS file is the machine-consumable inventory the deterministic rotation engine
# (scripts/secret_rotation.py) reads to compute rotation-due status, build per-class
# refresh plans, and drive self-rescheduling. Keep the two in sync — the test suite
# reconciles the secret-name set against docs/secrets-inventory.md.
#
# NAMES + METADATA ONLY — never a secret VALUE (per deploy#116 scope; gitleaks-clean).
#
# ── Field schema (per secret) ──────────────────────────────────────────────
#   name              GH secret / .env key name (unique)
#   scope             repo | environment            (GH secret scope)
#   secret_class      short human class label
#   owner_role        role that owns rotation
#   env_separated     true  → distinct stg/prod values
#                     false → shared account-wide credential (must be justified)
#   refresh_method    how a NEW value is obtained (§2 of deploy#513):
#                       generate_and_replace  — we mint the value (CSPRNG)
#                       provider_reroll       — re-roll in the upstream provider,
#                                               capture the new value (human console step)
#                       provider_managed      — lifecycle owned by the provider;
#                                               not rotated by us on a cadence
#   cadence           annual | quarterly | semiannual | on_demand | on_deploy
#                     | provider | per_run
#                       (cadence → ttl_days is derived by the engine; on_demand /
#                        on_deploy / provider / per_run have NO calendar TTL and are
#                        never "due" by the clock — only by an on-demand trigger)
#   apply_process     deterministic effecting-change process once a new value exists
#   requires_owner_gate  true → an inflection point needs a human (provider console
#                        re-roll, prod-gate approval, promote sign-off) → the engine
#                        classifies this secret as owner-notify, not fully programmatic
#   last_rotated      ISO date of the last known rotation, or null if unknown
#   runbook           per-secret procedure (docs/runbooks/…), or null
#   rotatable         false → config-not-secret (listed for completeness, never due)
#   notes             free text
#
# On-demand triggers from docs/runbooks/secret-rotation-policy.md (offboarding,
# value-in-logs, provider-compromise, drift alarm) ALWAYS apply on top of the
# cadence below — they are a floor, not encoded here.

# Default lead time: a rotation task fires at (next_due − lead_time_days).
defaults:
  lead_time_days: 1

