# Production Docker Compose — Noorina Labs deployment
# Location: noorinalabs-deploy/compose/docker-compose.prod.yml
# Usage: docker compose -f compose/docker-compose.prod.yml --env-file .env up -d
#
# All application services use pre-built GHCR images (no build contexts).
# Infrastructure services (neo4j, databases, observability) are configured here.

services:
  neo4j:
    build:
      context: ../infra/neo4j
      dockerfile: Dockerfile
    image: noorinalabs-isnad-graph-neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    read_only: true
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
    restart: unless-stopped

  api:
    # GHCR-only — no local-build fallback. The deploy workflow logs into ghcr.io
    # using the auto-provisioned GITHUB_TOKEN (workflow `permissions: packages: read`
    # required, see .github/workflows/deploy-isnad-graph.yml). A manual
    # `docker compose up` on the VPS without prior `docker login ghcr.io` will fail
    # at pull — that's intentional; deploys go through the workflow. See the
    # cutover meta (noorinalabs-main#145) and #103 for the rationale (VPS has no
    # Node toolchain, so the previous local-build path was never viable).
    image: ghcr.io/noorinalabs/noorinalabs-isnad-graph:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    # Security: read_only prevents runtime writes to the container filesystem.
    # The venv and application code are baked into the image at build time.
    # Only /tmp is writable at runtime (via tmpfs) for Python temp files.
    read_only: true
    tmpfs:
      # Python stdlib (tempfile, multiprocessing) and uvicorn need a writable /tmp
      - /tmp:size=256M
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      # NEO4J_USER must be "neo4j" — Neo4j requires the admin account to use this name
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      # DEFERRED (deploy#403): PG_DSN / REDIS_URL stay as interpolated URLs here
      # because isnad-graph-api has no app-side connection-component support yet —
      # tracked in ig#956 (sibling of us#65). Switching to DATABASE_* / REDIS_*
      # components requires that app change to land first; doing it here now would
      # feed the api env vars it does not read. Convert in lockstep when ig#956
      # ships. (Same URL-unsafe-password latent risk as us#65, lower urgency:
      # POSTGRES_PASSWORD / REDIS_PASSWORD are not currently URL-special.)
      - PG_DSN=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - AUTH_GOOGLE_CLIENT_ID=${AUTH_GOOGLE_CLIENT_ID:-}
      - AUTH_GOOGLE_CLIENT_SECRET=${AUTH_GOOGLE_CLIENT_SECRET:-}
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - AUTH_OAUTH_REDIRECT_BASE_URL=https://users.${BASE_DOMAIN}
      - AUTH_OAUTH_POST_LOGIN_URL=https://isnad.${BASE_DOMAIN}/auth/callback
      - AUTH_USER_SERVICE_URL=http://user-service:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
      - frontend
    # Uses the venv baked into the image at build time — NOT `uv run`, which would
    # trigger a full dependency reinstall at startup and fail on a read_only filesystem.
    # This is the single source of truth for the uvicorn command (Dockerfile has no CMD).
    command: /app/.venv/bin/uvicorn src.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped

  frontend:
    # GHCR-only — no local-build fallback. The deploy workflow logs into ghcr.io
    # using the auto-provisioned GITHUB_TOKEN (workflow `permissions: packages: read`
    # required, see .github/workflows/deploy-isnad-graph.yml). A manual
    # `docker compose up` on the VPS without prior `docker login ghcr.io` will fail
    # at pull — that's intentional; deploys go through the workflow. See the
    # cutover meta (noorinalabs-main#145) and #103 for the rationale: the VPS has
    # no Node/npm toolchain, so the previous `npm pack`-based build path was
    # never viable and the CACHEBUST arg (local-build cache buster) went with it.
    image: ghcr.io/noorinalabs/noorinalabs-isnad-graph-frontend:${IMAGE_TAG:-latest}
    environment:
      # Runtime origin for the user-service API, consumed by the frontend
      # container entrypoint (isnad-graph#932 / ig#934): entrypoint.sh runs
      # `envsubst '${USER_SERVICE_ORIGIN}'` over runtime-config.js.template,
      # so window.RUNTIME_CONFIG.USER_SERVICE_ORIGIN is this value at runtime.
      # useAuth.ts / LoginPage.tsx then build absolute AUTH_BASE / USER_BASE /
      # SESSIONS_BASE against it. This completes deploy#245 phase 2: the
      # frontend targets users.{$BASE_DOMAIN} directly instead of the empty-
      # string same-origin fallback the transitional isnad.* dual-bind relied
      # on (now dropped — see caddy/Caddyfile isnad.{$BASE_DOMAIN} block).
      # Per-env via ${BASE_DOMAIN} (prod: users.noorinalabs.com,
      # stg: users.stg.noorinalabs.com).
      USER_SERVICE_ORIGIN: "https://users.${BASE_DOMAIN}"
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/cache/nginx:size=128M
      - /run:size=16M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
    restart: unless-stopped

  landing:
    # GHCR-only — no local-build fallback. The deploy workflow logs into ghcr.io
    # using the auto-provisioned GITHUB_TOKEN (workflow `permissions: packages: read`
    # required, see .github/workflows/deploy-isnad-graph.yml). A manual
    # `docker compose up` on the VPS without prior `docker login ghcr.io` will fail
    # at pull — that's intentional; deploys go through the workflow.
    image: ghcr.io/noorinalabs/noorinalabs-landing-page:${LANDING_IMAGE_TAG:-latest}
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/cache/nginx:size=128M
      - /run:size=16M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
    restart: unless-stopped

  # --- Reverse Proxy ---

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN:?BASE_DOMAIN must be set — env-templated Caddyfile expects {$BASE_DOMAIN}}"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
      landing:
        condition: service_healthy
      user-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
      - frontend
    restart: unless-stopped

  # --- User Service ---

  # One-shot alembic migration runner (#141). Mirrors the kafka-init pattern:
  # runs to completion, exits 0 on success, stays in "exited" state for the
  # rest of the compose lifecycle. The user-service `depends_on` block waits
  # for `service_completed_successfully` so the API never starts against an
  # unmigrated database.
  #
  # Why this exists alongside the SSH-driven alembic gate (db-migrate.yml):
  #   - db-migrate.yml is the CI/promotion-time gate. It SSHes into the
  #     prod VPS, pulls the candidate image, and runs `alembic upgrade head`
  #     against the LIVE user-postgres before promote.yml retags the image.
  #     That covers the rolling-deploy path.
  #   - This init container covers the `compose up` path on a fresh
  #     `user_pg_data` volume (DR-restore, first stack-up, blue-green VPS
  #     swap with an empty postgres). The SSH gate cannot run by definition
  #     when the stack does not yet exist (chicken-and-egg per
  #     docs/runbooks/break-glass.md § skip_alembic_gate).
  #
  # Failure mode + recovery: if alembic fails, this container exits non-zero,
  # `user-service` stays in `Created` (never `Running`), and `compose up`
  # itself returns non-zero. Operator sees the failure immediately rather
  # than a healthy-looking API serving against unmigrated tables. Logs are
  # captured by the json-file driver below; `docker compose logs
  # user-service-migrate` retrieves them.
  user-service-migrate:
    image: ghcr.io/noorinalabs/noorinalabs-user-service:${USER_SERVICE_IMAGE_TAG:-latest}
    # asyncpg driver — alembic/env.py is async (create_async_engine +
    # asyncio.run). alembic/env.py resolves the URL via
    # Settings.effective_database_url (us#151), so the migrate container needs
    # the SAME component vars as the runtime user-service — otherwise it hits
    # the identical urlparse crash on a URL-unsafe USER_POSTGRES_PASSWORD (us#65,
    # deploy#403). DATABASE_HOST set ⇒ the app builds the URL via
    # sqlalchemy.URL.create (password URL-encoded); DATABASE_DRIVER preserves the
    # asyncpg scheme matching the SSH alembic gate in db-migrate.yml (post-#236).
    #
    # DATABASE_URL is ALSO retained (rollback safety — Aisha, deploy#403 review):
    # rollback.yml only rewrites the image tag against the CURRENT compose, so a
    # rollback to a pre-us#151 image (which reads only DATABASE_URL) must still
    # find it here, or it falls back to the in-image localhost default and bricks.
    # The new image ignores DATABASE_URL whenever DATABASE_HOST is set, so keeping
    # both is strictly safe in both the forward and rollback directions.
    environment:
      - DATABASE_HOST=user-postgres
      - DATABASE_PORT=5432
      - DATABASE_DRIVER=postgresql+asyncpg
      - DATABASE_USER=${USER_POSTGRES_USER:?USER_POSTGRES_USER must be set}
      - DATABASE_PASSWORD=${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD must be set}
      - DATABASE_NAME=${USER_POSTGRES_DB:?USER_POSTGRES_DB must be set}
      - DATABASE_URL=postgresql+asyncpg://${USER_POSTGRES_USER:?USER_POSTGRES_USER must be set}:${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD must be set}@user-postgres:5432/${USER_POSTGRES_DB:?USER_POSTGRES_DB must be set}
    # `alembic upgrade head` matches the SSH gate's invocation. The
    # heads-count belt-and-suspenders check from db-migrate.yml is not
    # repeated here — that check guards CI-time migrations-DAG correctness
    # and would be redundant noise at every `compose up`.
    command: /app/.venv/bin/alembic upgrade head
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - user-backend
    # Container is one-shot; restart on failure would re-run forever if the
    # migration is fundamentally broken. `no` is the correct choice — the
    # non-zero exit cascades to user-service's depends_on block.
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  user-service:
    image: ghcr.io/noorinalabs/noorinalabs-user-service:${USER_SERVICE_IMAGE_TAG:-latest}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=256M
    # DB + Redis passed as discrete component vars (deploy#403, completes us#65).
    # The app builds the connection URLs in-process via
    # Settings.effective_{database,redis}_url (us#151), URL-encoding the password —
    # so a USER_*_PASSWORD secret containing `/ + = @ : #` can no longer corrupt the
    # URL authority and crash urlparse at startup. The component path engages only
    # when DATABASE_HOST / REDIS_HOST are set, so setting the HOST vars here is what
    # activates the fix. Internal compose-network ports: user-postgres listens on
    # 5432, user-redis on 6379 (host-published 5433/6380).
    #
    # DATABASE_URL / REDIS_URL are ALSO retained (rollback safety — Aisha,
    # deploy#403 review): rollback.yml only rewrites the image tag against the
    # CURRENT compose, so a rollback to a pre-us#151 image (which reads only the
    # URLs) must still find them here, or it falls back to the in-image localhost
    # defaults and bricks the container exactly when rollback is needed. The new
    # image ignores the URLs whenever HOST is set, so keeping both is strictly safe
    # in both the forward and rollback directions; the only cost is a few extra env
    # keys (the passlist-drift gate tolerates extras).
    environment:
      - DATABASE_HOST=user-postgres
      - DATABASE_PORT=5432
      - DATABASE_DRIVER=postgresql+asyncpg
      - DATABASE_USER=${USER_POSTGRES_USER:?USER_POSTGRES_USER must be set}
      - DATABASE_PASSWORD=${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD must be set}
      - DATABASE_NAME=${USER_POSTGRES_DB:?USER_POSTGRES_DB must be set}
      - DATABASE_URL=postgresql+asyncpg://${USER_POSTGRES_USER:?USER_POSTGRES_USER must be set}:${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD must be set}@user-postgres:5432/${USER_POSTGRES_DB:?USER_POSTGRES_DB must be set}
      - REDIS_HOST=user-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD must be set}
      - REDIS_URL=redis://:${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD must be set}@user-redis:6379/0
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be set}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be set}
      - CORS_ORIGINS=["https://isnad.${BASE_DOMAIN}","https://${BASE_DOMAIN}"]
      - AUTH_GOOGLE_CLIENT_ID=${AUTH_GOOGLE_CLIENT_ID:-}
      - AUTH_GOOGLE_CLIENT_SECRET=${AUTH_GOOGLE_CLIENT_SECRET:-}
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - AUTH_OAUTH_REDIRECT_BASE_URL=https://users.${BASE_DOMAIN}
      - AUTH_OAUTH_POST_LOGIN_URL=https://isnad.${BASE_DOMAIN}/auth/callback
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      user-postgres:
        condition: service_healthy
      user-redis:
        condition: service_healthy
      user-service-migrate:
        # Migrations MUST complete cleanly before user-service starts. A
        # non-zero migrate exit cascades up: user-service stays in
        # `Created`, `compose up` returns non-zero, operator sees the
        # failure immediately (vs a healthy-looking API on unmigrated
        # tables). See user-service-migrate block above for design notes.
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      # egress is non-internal — gives user-service outbound reach for OAuth
      # provider calls (Google, GitHub, etc.). Caddy reaches user-service for
      # inbound over the shared `backend` network (caddy is on backend+frontend),
      # so user-service does NOT need `frontend` for inbound — it was only ever
      # on `frontend` for egress (deploy#138). backend + user-backend stay
      # internal for DB isolation. Swapped frontend→egress per deploy#140.
      - backend
      - user-backend
      - egress
    command: /app/.venv/bin/uvicorn src.app.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  user-postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: "${USER_POSTGRES_DB:?USER_POSTGRES_DB must be set}"
      POSTGRES_USER: "${USER_POSTGRES_USER:?USER_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD must be set}"
    volumes:
      - user_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_POSTGRES_USER} -d ${USER_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - user-backend
    restart: unless-stopped

  user-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD must be set}"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    volumes:
      - user_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${USER_REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - user-backend
    restart: unless-stopped

  user-postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${USER_POSTGRES_USER:?USER_POSTGRES_USER must be set}:${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD must be set}@user-postgres:5432/${USER_POSTGRES_DB:?USER_POSTGRES_DB must be set}?sslmode=disable"
    expose:
      - "9187"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - user-backend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # --- Observability ---

  prometheus:
    image: prom/prometheus:v3.4.0
    # Per-env config selection (deploy#263). `PROM_CONFIG_FILE` is set by the
    # deploy workflow's .env write step — `prometheus.prod.yml` for prod,
    # `prometheus.stg.yml` for stg. Default to prod for local `docker compose
    # config` validation (compose-validate.yml uses the bare .env.example,
    # which is fine: only one variant is mounted at a time).
    volumes:
      - ../infra/prometheus/${PROM_CONFIG_FILE:-prometheus.prod.yml}:/etc/prometheus/prometheus.yml:ro
      - ../infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # Per-env config selection (deploy#262 + #263). `ALERTMANAGER_CONFIG_FILE`
    # picks `alertmanager.prod.yml` or `alertmanager.stg.yml` (set by deploy
    # workflow .env write); default = prod for compose-validate. The Slack
    # webhook URL is read at runtime from `/etc/alertmanager/slack_webhook_url`
    # (api_url_file directive — supported since alertmanager v0.25). The file
    # is bind-mounted from `../infra/alertmanager/slack_webhook_url.secret`
    # which is written by the deploy workflow from `${{ secrets.SLACK_WEBHOOK_URL }}`.
    # If the secret is unset, the file contains the placeholder string
    # "<unset>" and alerts route to nowhere — alertmanager itself starts
    # cleanly. See docs/runbooks/alertmanager-slack-routing.md.
    volumes:
      - ../infra/alertmanager/${ALERTMANAGER_CONFIG_FILE:-alertmanager.prod.yml}:/etc/alertmanager/alertmanager.yml:ro
      # `SLACK_WEBHOOK_FILE` defaults to the in-tree `.example` placeholder
      # (literal "<unset>") so `docker compose config` works in CI and on
      # fresh clones. The deploy workflow writes the real secret to
      # `slack_webhook_url.secret` (gitignored) and overrides this var.
      - ../infra/alertmanager/${SLACK_WEBHOOK_FILE:-slack_webhook_url.secret.example}:/etc/alertmanager/slack_webhook_url:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      # backend for scrape/UI; egress for outbound to alert receivers. The Slack
      # webhook is already wired (api_url_file → secrets.SLACK_WEBHOOK_URL), so the
      # moment a real webhook URL is set, alertmanager must resolve hooks.slack.com.
      # Adding egress proactively avoids the silent DNS-failure-on-alert mode that
      # bit user-service. PagerDuty/SMTP receivers (per #127) get egress for free.
      # See deploy#140.
      - backend
      - egress
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.6.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      # Sub-path mount behind Caddy on the isnad vhost (caddy/Caddyfile
      # `handle /grafana/*`). Host MUST match the live Caddy binding —
      # the legacy `isnad-graph.noorinalabs.com` record was destroyed in
      # the 2026-05-02 reconciliation (#192/#226) and every other ref
      # migrated to `isnad.{$BASE_DOMAIN}`; this line was the last hold-out
      # (dates from initial commit c7642bf) and made Grafana emit
      # login-redirect / sub-path asset URLs at a dead NXDOMAIN host,
      # breaking reachability + login (deploy#45).
      GF_SERVER_ROOT_URL: https://isnad.${BASE_DOMAIN:?BASE_DOMAIN required}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  loki:
    image: grafana/loki:2.9.10
    volumes:
      - ../infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    # Successor to promtail (deploy#132). Alloy ships a base image with /bin/sh +
    # wget, so the HTTP healthcheck disabled for promtail in #128 is re-enabled
    # here. River config in infra/alloy/config.alloy ports the promtail Docker SD
    # + JSON pipeline 1:1; loki.write is wire-compatible with Loki 2.9.10 (no
    # Loki bump needed). Image is multi-arch pinned by digest — resolved against
    # the OCI image-index at registry.docker.io on 2026-05-18.
    image: grafana/alloy:v1.16.1@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    volumes:
      - ../infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=0.0.0.0:12345"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12345/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Textfile collector input directory (deploy#161). The host path is
      # owned by `deploy:deploy` (mode 0755) and populated by the alembic
      # pre-deploy gate in db-migrate.yml on every run via `if: always()`.
      # Read-only mount so a compromised node-exporter cannot clobber the
      # written .prom files. The host directory is provisioned automatically
      # by Terraform cloud-init (terraform/hetzner/modules/hetzner-vps/
      # cloud-init.yaml.tpl runcmd:) on every fresh VPS — no manual step
      # needed. Mode 0755 set by cloud-init (PR #210, Bereket amendment).
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Enable the textfile collector with the directory mounted above.
      # Files matching `*.prom` are scraped at the interval set by Prometheus
      # for the node-exporter job. Atomic writes (temp + rename) on the
      # producer side prevent half-written reads.
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # blackbox-exporter — continuous external probing of prod public routes
  # (companion to scripts/verify_prod_smoke.sh post-deploy battery, see deploy#183).
  # Two-network topology:
  #   - frontend: real-DNS / real-TLS path to the public Caddy endpoints
  #     (`internal: false`, so the container has egress to the public internet).
  #   - backend:  Prometheus scrapes /probe + /metrics on this internal network.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ../infra/blackbox-exporter/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    expose:
      - "9115"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Pipeline messaging (Kafka KRaft, single-node) ---
  #
  # Single-broker Kafka in KRaft mode (no ZooKeeper). Used by the data
  # ingestion pipeline (noorinalabs-isnad-ingest-platform) to hand off
  # B2-path pointers between stages: raw → dedup → enrich → normalize → graph.
  #
  # Listener topology:
  #   INTERNAL   (kafka:9092)   — plaintext, backend-network only, used by
  #                              in-cluster producers/consumers and Kafka UI.
  #   CONTROLLER (kafka:9093)   — KRaft quorum (single-node election).
  #
  # The broker is NOT exposed to the host or the frontend network. All
  # operator access to the UI goes through a loopback port (8085) on the VPS;
  # remote access is only via SSH tunnel. Topic creation is handled by the
  # one-shot kafka-init service below.
  kafka:
    # Official Apache Kafka image (KRaft-native, no ZooKeeper). Migrated off
    # Bitnami in #100 — the bitnami/* namespace was sunset Aug 2025 and the
    # bitnamilegacy/* stopgap is itself on a sunset trajectory. apache/kafka
    # is the upstream-canonical, Apache-2.0-throughout, smallest standard
    # image; owner-selected 2026-05-31. Differences from the Bitnami image
    # that this block reconciles:
    #   - Env-var convention: KAFKA_CFG_<X> → KAFKA_<X> (no CFG infix; the
    #     apache/kafka entrypoint translates KAFKA_* directly to server
    #     properties via KafkaDockerWrapper).
    #   - Cluster ID: KAFKA_KRAFT_CLUSTER_ID → CLUSTER_ID (consumed by the
    #     entrypoint's first-boot `kafka-storage format`; the image
    #     auto-formats the log dir on first start).
    #   - Data dir: /bitnami/kafka → /var/lib/kafka/data (apache/kafka's
    #     default log.dirs from /etc/kafka/docker; volume remount below).
    #   - User: the bitnami gid=0 workaround (#124, /opt/bitnami config
    #     group-write) no longer applies — apache/kafka runs as its own
    #     appuser (uid 1000) and owns its config/data dirs, so no explicit
    #     `user:` override is needed.
    #   - CLI scripts: /opt/bitnami/kafka/... → /opt/kafka/bin/... (see the
    #     kafka-init mount + healthcheck below, and infra/kafka/init-topics.sh).
    image: apache/kafka:3.9.2
    environment:
      # Core KRaft identity
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Cluster ID must be stable across restarts — supplied via env (see
      # .env.example). apache/kafka reads CLUSTER_ID (not the Bitnami
      # KAFKA_KRAFT_CLUSTER_ID) and formats the log dir with it on first boot.
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set (generate once: docker run --rm apache/kafka:3.9.2 /opt/kafka/bin/kafka-storage.sh random-uuid)}"
      # Persistent log dir — apache/kafka's bundled docker config defaults
      # log.dirs to /var/lib/kafka/data; set it explicitly so the volume
      # mount target below is unambiguous and survives any default change.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Listeners (plaintext, internal-only — backend network is docker-internal)
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Durability / retention defaults (per-topic retention set by kafka-init)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "3"
      # JVM heap — small single-node broker
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka_data:/var/lib/kafka/data
    expose:
      - "9092"
    healthcheck:
      # kafka-broker-api-versions.sh returns non-zero if the broker isn't accepting connections.
      # apache/kafka ships the CLI scripts under /opt/kafka/bin and does NOT
      # guarantee them on PATH (unlike Bitnami), so call by absolute path.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend
    restart: unless-stopped
    # Give the broker time to flush log segments and leave the controller quorum cleanly
    # on `docker compose down`/restart instead of being SIGKILLed after the default 10s.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  kafka-init:
    # One-shot topic creation. Idempotent: uses --if-not-exists. Exits 0 on success.
    # The service stays in "exited" state after the first successful run and is
    # re-executed whenever compose is brought up — cheap and safe.
    # apache/kafka — migrated off Bitnami in #100 (see broker service comment).
    # No gid=0 / config-dir workaround needed here: this service only runs the
    # init script against the already-running broker; it doesn't write into the
    # image's config dir. The CLI scripts the init script calls live under
    # /opt/kafka/bin (handled inside init-topics.sh).
    image: apache/kafka:3.9.2
    # Mount under a neutral path (not /opt/bitnami/...) — apache/kafka has no
    # /opt/bitnami tree. /opt/kafka exists in the image; placing the script
    # alongside (not inside bin/) keeps it clearly ours.
    volumes:
      - ../infra/kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/kafka/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-exporter:
    # Prometheus exporter for Kafka broker + consumer-group metrics (deploy#88).
    # Scrapes the broker over the backend network on kafka:9092 (plaintext, internal
    # listener); exposes a Prometheus /metrics endpoint on :9308. Not exposed to the
    # host or frontend — Prometheus reaches it over the docker `backend` network.
    #
    # Image: danielqsj/kafka-exporter is the de-facto open-source kafka exporter
    # (battle-tested, multi-arch, tracks broker 3.x). v1.9.0 is upstream-latest
    # (2025-02-17). Multi-arch index digest pinned (matches the alloy precedent
    # in this same file — resolved against registry.docker.io via the OCI image-
    # index endpoint on 2026-05-19). Pinning the index digest lets docker pull
    # the right per-arch child blob automatically.
    #
    # depends_on the broker's healthcheck so the exporter only starts once kafka
    # is accepting connections — avoids a noisy 30s of "connection refused"
    # restart-loops at compose-up time.
    #
    # Consumer-group metrics (`kafka_consumergroup_*`) populate only when real
    # consumers are running. Until ingest-platform consumer workers are deployed,
    # the broker/topic/partition gauges still populate (so the dashboard ISR
    # and partition panels are immediately useful) and the consumer-lag panel
    # renders empty-state — acceptable and tracked as a W12 follow-up.
    image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    expose:
      - "9308"
    healthcheck:
      # Base image is quay.io/prometheus/busybox — wget is available as a
      # busybox applet (verified against v1.9.0 Dockerfile, 2026-05-19). The
      # /metrics endpoint responds 200 even with zero consumer groups (empty
      # body still parses), so this gate fires positive as soon as the
      # exporter has dialed the broker and started serving.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 32M
          cpus: "0.05"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-ui:
    # Admin console for Kafka. Bound to loopback on the VPS — operators reach it
    # via SSH tunnel (ssh -L 8085:127.0.0.1:8085 deploy@vps). Basic auth required.
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: "noorinalabs-pipeline"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "${KAFKA_UI_USER:?KAFKA_UI_USER must be set}"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD:?KAFKA_UI_PASSWORD must be set}"
      # Disable dynamic-config edits from the UI — topic retention is owned by kafka-init.
      KAFKA_CLUSTERS_0_READONLY: "${KAFKA_UI_READONLY:-true}"
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  user-backend:
    driver: bridge
    internal: true
  # Outbound-only to the public internet (NOT internal). For services that need
  # to reach external hosts (OAuth providers, Slack/PagerDuty webhooks, SMTP)
  # but have NO public-facing inbound traffic. Keeps `frontend` semantically
  # limited to "public-facing via Caddy" rather than overloading it as the
  # catch-all egress path. See deploy#140 (Option A).
  egress:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  loki_data:
  kafka_data:
  user_pg_data:
  user_redis_data:
