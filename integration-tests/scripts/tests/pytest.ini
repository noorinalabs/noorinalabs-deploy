# Dependency-light unit-test home for the integration-tests/scripts/ CLI helpers
# (deploy#500). A dedicated config here makes THIS directory pytest's rootdir, so
# the run does NOT inherit integration-tests/pytest.ini — that config is for the
# hermetic docker cross-repo suite (asyncio_mode=auto + testpaths=/app/tests,
# needing asyncpg/httpx/redis + pytest-asyncio). The tests here are pure stdlib
# urllib-mock unit tests that install only pytest, so they must not pull in the
# live-stack config (its asyncio_mode key would otherwise emit an Unknown-config
# warning under a plain pytest install).
[pytest]
addopts = -ra
