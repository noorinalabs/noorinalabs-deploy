# Promote image from stg → prod via registry-side retag.
#
# Consumes the image-tag Contract v6 (option C) owned by
# noorinalabs-isnad-graph#815 (canonical comment per program-director ruling:
# https://github.com/noorinalabs/noorinalabs-isnad-graph/issues/815#issuecomment-4301538921).
# v6 shape is identical to v5 (4301487132) / v3 (4301425114); v6 is the
# canonical citation target per Khoury ruling 2026-04-23.
#
# Source tags (written by each service's ghcr-publish.yml, NOT here):
#   sha-<short>, latest, stg-<short>, stg-latest
#
# Tags written by THIS workflow, exclusively:
#   prod-<short>, prod-latest
#
# Mechanism: `docker buildx imagetools create` rewrites the multi-arch
# manifest-list at the registry level. No layer pull, no layer push — the
# target digest is identical to the source digest. Both prod-<short> and
# prod-latest are written in a single invocation.
#
# Promotion sources:
#   1. Default: resolve digest of `stg-latest` for each image.
#   2. Rollback / specific-SHA: `workflow_dispatch` input `source_sha` of the
#      form `sha-<short>` or bare `<short>` — either resolves to the
#      corresponding `sha-<short>` tag on the registry.
#
# Environment gating:
#   - environment: production forces a reviewer-required manual-approval gate
#     per the GH Environments protection rule (owner is the sole reviewer).
#   - Stg deploy is automatic (repository_dispatch fan-in from each service
#     repo) — see deploy-stg.yml.
#
# Per-service tag pinning (Lucas review 2026-04-23): short-SHA resolution
# happens in the `plan` job up-front and is threaded through to both the
# `retag` matrix AND the `trigger-prod-deploy` dispatch. This guarantees
# `deploy-prod.yml` rolls out the exact same prod-<short> that our manual
# approval just gated, not whatever `prod-latest` happens to point at if a
# second promotion has started in parallel.

name: Promote to production (image retag)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: >-
          Short SHA to promote (7 chars, with or without `sha-` prefix).
          Leave empty to promote the digest currently pointed to by
          `stg-latest` for each image.
        required: false
        default: ""
      images:
        description: "Comma-separated image set to promote (default: all)."
        required: false
        default: "api,frontend,user-service,landing"
      skip_stg_verify:
        description: >-
          BREAK-GLASS: skip the stg-verify gate. Only set true when the
          gate is broken and you need an emergency promotion. A warning
          annotation + job-summary entry are emitted on use.
        required: false
        default: false
        type: boolean
      stg_verify_max_age_hours:
        description: >-
          Maximum age (hours) of the stg-verify-result artifact. Older
          artifacts cause the gate to fail with "stg verify is stale".
        required: false
        default: "24"
        type: string
      skip_alembic_gate:
        description: >-
          BREAK-GLASS: skip the alembic pre-retag migration gate. The
          gate requires a running user-postgres + user-service stack on
          prod; on first-deploy / DR-restore the stack does not yet
          exist (chicken-and-egg). Use ONLY when restoring prod from a
          state where the alembic gate cannot run by definition. Mirrors
          the skip_stg_verify break-glass discipline: emits a warning
          annotation + job-summary entry on use. REQUIRES a non-empty
          `break_glass_reason` input — see deploy#251.
        required: false
        default: false
        type: boolean
      break_glass_reason:
        description: >-
          REQUIRED when skip_stg_verify=true OR skip_alembic_gate=true.
          Free-text operator-supplied reason. Logged in job summary,
          appended to the pinned audit-log issue (label
          `break-glass-audit-log`), and surfaced in Slack/email via
          Alertmanager. Empty value with any break-glass input set will
          fail the run at the validate-break-glass-reason job. See
          deploy#251 + docs/runbooks/break-glass.md.
        required: false
        default: ""
        type: string

concurrency:
  # All promotions serialize globally — we never want two promotions racing
  # to write prod-latest.
  group: promote-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # `issues: write` is required by the break-glass-audit composite action
  # to find-or-create + comment on the pinned audit-log issue. Scoped at the
  # workflow level because the audit step runs from inside the `gate-stg-verify`
  # and (TBD downstream of skip_alembic_gate) jobs which both need it on the
  # break-glass branch only. Non-break-glass runs never invoke `gh issue`,
  # so the additional scope is unused for the common path.
  issues: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Break-glass reason validation (deploy#251). When ANY break-glass
  # input is set true, `break_glass_reason` MUST be non-empty. This
  # job runs before any other and short-circuits the entire promotion
  # if the operator forgot to document why they're bypassing a gate.
  #
  # The audit composite action also re-validates non-empty reason at
  # call time as defense-in-depth, but failing here is faster + clearer.
  # ─────────────────────────────────────────────────────────────────
  validate-break-glass-reason:
    name: Validate break-glass reason
    runs-on: ubuntu-latest
    steps:
      - name: Reason is required when any break-glass input is set
        env:
          SKIP_STG_VERIFY: ${{ inputs.skip_stg_verify }}
          SKIP_ALEMBIC_GATE: ${{ inputs.skip_alembic_gate }}
          REASON: ${{ inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          if [ "${SKIP_STG_VERIFY}" = "true" ] || [ "${SKIP_ALEMBIC_GATE}" = "true" ]; then
            # Strip whitespace before checking — operators sometimes type a
            # space hoping to satisfy a "required" check. Fail those too.
            stripped="${REASON//[$' \t\r\n']/}"
            if [ -z "${stripped}" ]; then
              echo "::error::A break-glass input was set true but \`break_glass_reason\` is empty."
              echo "::error::Set \`break_glass_reason\` to a free-text reason describing WHY the bypass is needed."
              echo "::error::Example: 'DR restore — prod stack does not exist, alembic gate cannot run by definition'."
              echo "::error::See docs/runbooks/break-glass.md (deploy#251)."
              exit 1
            fi
            echo "Break-glass inputs:"
            echo "  skip_stg_verify  = ${SKIP_STG_VERIFY}"
            echo "  skip_alembic_gate = ${SKIP_ALEMBIC_GATE}"
            echo "Reason supplied (length=${#REASON})."
          else
            echo "No break-glass inputs set — reason validation N/A."
          fi

  plan:
    name: Plan promotion
    needs: validate-break-glass-reason
    runs-on: ubuntu-latest
    outputs:
      # Each matrix cell of `retag` picks its per-image short from here.
      # Shape: [{"key": "api", "image": "...", "short": "a1b2c3d", "digest": "sha256:..."}, ...]
      images_json: ${{ steps.resolve.outputs.images_json }}
      # Flat per-service shorts for trigger-prod-deploy's input mapping.
      api_short:          ${{ steps.resolve.outputs.api_short }}
      frontend_short:     ${{ steps.resolve.outputs.frontend_short }}
      user_service_short: ${{ steps.resolve.outputs.user_service_short }}
      landing_short:      ${{ steps.resolve.outputs.landing_short }}
      # Per-service stg-latest manifest digests for the v2 gate
      # (deploy#199). Empty string if the service is not in this
      # promotion's image set or if digest resolution failed.
      api_digest:          ${{ steps.resolve.outputs.api_digest }}
      frontend_digest:     ${{ steps.resolve.outputs.frontend_digest }}
      user_service_digest: ${{ steps.resolve.outputs.user_service_digest }}
      landing_digest:      ${{ steps.resolve.outputs.landing_digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Resolve per-image shorts
        id: resolve
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          IMAGES_INPUT: ${{ inputs.images }}
          REGISTRY: ${{ env.REGISTRY }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Normalize + validate source_sha.
          raw="${SOURCE_SHA_INPUT#sha-}"
          if [ -n "$raw" ]; then
            if ! printf '%s' "$raw" | grep -qE '^[0-9a-f]{7}$'; then
              echo "::error::source_sha must be 7 lowercase hex chars (optionally prefixed 'sha-'). Got: $SOURCE_SHA_INPUT"
              exit 1
            fi
            explicit_short="$raw"
          else
            explicit_short=""
          fi

          # Build the image set + resolve each image's short-SHA up front.
          # For the default path (explicit_short empty), walk each image's
          # `stg-latest` → find the `sha-<short>` that matches. Done once
          # here rather than per-retag-matrix-cell so that both `retag` and
          # `trigger-prod-deploy` see the same short without each re-deriving.
          export _EXPLICIT_SHORT="$explicit_short"
          python3 - <<'PY' > /tmp/plan.json
          import json, os, sys
          mapping = {
              "api":          "noorinalabs/noorinalabs-isnad-graph",
              "frontend":     "noorinalabs/noorinalabs-isnad-graph-frontend",
              "user-service": "noorinalabs/noorinalabs-user-service",
              "landing":      "noorinalabs/noorinalabs-landing-page",
          }
          raw = os.environ.get("IMAGES_INPUT", "").strip() or ",".join(mapping)
          requested = [s.strip() for s in raw.split(",") if s.strip()]
          unknown = [s for s in requested if s not in mapping]
          if unknown:
              print(f"::error::Unknown image keys: {unknown}. Valid: {list(mapping)}", file=sys.stderr)
              sys.exit(1)
          explicit = os.environ.get("_EXPLICIT_SHORT", "")
          # Plan is deterministic: if an explicit short is given, every image
          # uses it. Otherwise each image resolves its own via stg-latest walk
          # in the bash block that follows. The `digest` field is filled by
          # the bash block below (auto-resolve path) or by the explicit-short
          # digest-resolve step (manual override path).
          out = [{"key": k, "image": mapping[k], "short": explicit, "digest": ""} for k in requested]
          print(json.dumps(out))
          PY

          # Explicit-short path: resolve each service's digest from its
          # `sha-<short>` tag. The auto-resolve path below already records
          # the digest as part of stg-latest walk; this branch covers the
          # manual `inputs.source_sha` override so the v2 gate (deploy#199)
          # still has a digest to compare against.
          if [ -n "$explicit_short" ]; then
            : > /tmp/explicit_digests.jsonl
            while IFS= read -r entry; do
              key=$(printf '%s' "$entry" | python3 -c "import sys,json;print(json.loads(sys.stdin.read())['key'])")
              image=$(printf '%s' "$entry" | python3 -c "import sys,json;print(json.loads(sys.stdin.read())['image'])")
              full="${REGISTRY}/${image}"
              digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$full:sha-${explicit_short}" 2>/dev/null || echo "")
              if [ -z "$digest" ]; then
                echo "::warning::Could not resolve digest for explicit-short $full:sha-${explicit_short} — gate will fall back to v1 semantics for $key."
              fi
              KEY="$key" IMAGE_NAME="$image" SHORT="$explicit_short" DIGEST="$digest" python3 -c "
          import json, os
          print(json.dumps({
              'key': os.environ['KEY'],
              'image': os.environ['IMAGE_NAME'],
              'short': os.environ['SHORT'],
              'digest': os.environ['DIGEST'],
          }))
          " >> /tmp/explicit_digests.jsonl
            done < <(python3 -c "
          import json
          for e in json.load(open('/tmp/plan.json')):
              print(json.dumps(e))
          ")
            python3 -c "
          import json
          with open('/tmp/explicit_digests.jsonl') as fh:
              rows = [json.loads(line) for line in fh if line.strip()]
          json.dump(rows, open('/tmp/plan.json', 'w'))
          "
          fi

          # If explicit_short is empty, resolve per-image from stg-latest.
          # We do this in bash since we already have buildx + curl available.
          if [ -z "$explicit_short" ]; then
            : > /tmp/resolved_shorts.jsonl
            while IFS= read -r entry; do
              key=$(printf '%s' "$entry" | python3 -c "import sys,json;print(json.loads(sys.stdin.read())['key'])")
              image=$(printf '%s' "$entry" | python3 -c "import sys,json;print(json.loads(sys.stdin.read())['image'])")
              full="${REGISTRY}/${image}"

              # Resolve stg-latest digest via registry-reported digest
              # (authoritative), not sha256-of-raw-bytes.
              stg_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$full:stg-latest")

              # Walk sha-* tags, find match.
              image_path="$image"
              token=$(curl -s -u "${GH_ACTOR}:${GH_TOKEN}" \
                "https://${REGISTRY}/token?scope=repository:${image_path}:pull" \
                | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
              tags=$(curl -sH "Authorization: Bearer $token" \
                "https://${REGISTRY}/v2/${image_path}/tags/list" \
                | python3 -c "import sys,json;print('\n'.join(json.load(sys.stdin).get('tags') or []))")
              short=""
              while IFS= read -r tag; do
                case "$tag" in
                  sha-*)
                    cand=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$full:$tag" 2>/dev/null || true)
                    if [ "$cand" = "$stg_digest" ]; then
                      short="${tag#sha-}"
                      break
                    fi
                    ;;
                esac
              done <<< "$tags"
              if [ -z "$short" ]; then
                echo "::error::Could not resolve sha-<short> matching stg-latest digest for $full"
                exit 1
              fi
              echo "[plan] $key ($image): resolved short=$short (digest=$stg_digest)"
              # Write one JSON object per line for downstream aggregation.
              # Carrying `digest` through enables the v2 gate (deploy#199)
              # to compare against verify-deploy's recorded service_digests.
              KEY="$key" IMAGE_NAME="$image" SHORT="$short" DIGEST="$stg_digest" python3 -c "
          import json, os
          print(json.dumps({
              'key': os.environ['KEY'],
              'image': os.environ['IMAGE_NAME'],
              'short': os.environ['SHORT'],
              'digest': os.environ['DIGEST'],
          }))
          " >> /tmp/resolved_shorts.jsonl
            done < <(python3 -c "
          import json
          for e in json.load(open('/tmp/plan.json')):
              print(json.dumps(e))
          ")
            # Aggregate the per-line JSON back into a single list.
            python3 -c "
          import json
          with open('/tmp/resolved_shorts.jsonl') as fh:
              rows = [json.loads(line) for line in fh if line.strip()]
          json.dump(rows, open('/tmp/plan.json', 'w'))
          "
          fi

          # Emit aggregated matrix JSON + per-service short + per-service
          # digest outputs. Digests are consumed by the v2 stg-verify gate
          # (deploy#199) for per-service equality checks against the
          # verify-deploy artifact's `service_digests` map.
          python3 - <<'PY3'
          import json, os
          data = json.load(open("/tmp/plan.json"))
          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a") as fh:
              fh.write("images_json=" + json.dumps(data) + "\n")
              # Per-service flat shorts (empty string if service not in set).
              by_short = {e["key"]: e["short"] for e in data}
              fh.write(f"api_short={by_short.get('api', '')}\n")
              fh.write(f"frontend_short={by_short.get('frontend', '')}\n")
              fh.write(f"user_service_short={by_short.get('user-service', '')}\n")
              fh.write(f"landing_short={by_short.get('landing', '')}\n")
              # Per-service digests (empty if not in set or resolve failed).
              by_digest = {e["key"]: e.get("digest", "") for e in data}
              fh.write(f"api_digest={by_digest.get('api', '')}\n")
              fh.write(f"frontend_digest={by_digest.get('frontend', '')}\n")
              fh.write(f"user_service_digest={by_digest.get('user-service', '')}\n")
              fh.write(f"landing_digest={by_digest.get('landing', '')}\n")
          print("[plan] matrix:", json.dumps(data, indent=2))
          PY3

  # ─────────────────────────────────────────────────────────────────
  # Stg-verify gate (deploy#179 introduced v1 freshness; deploy#199 adds
  # v2 per-service digest equality).
  #
  # Hard-blocks promotion unless the most recent `verify-deploy.yml`
  # run triggered by "Deploy to staging" concluded success AND the
  # appropriate schema-version check passes:
  #
  #   v2 (current): every service in this promotion's image set has
  #       its plan-resolved stg-latest digest equal to the artifact's
  #       `service_digests[<service>]`. Any divergence (a service moved
  #       its stg-latest pointer between verify-stg capture and this
  #       promote) FAILS the gate with a per-service diff.
  #
  #   v1 (legacy fallback during rollout): fresh-enough artifact
  #       (default: <24h old). Used until every stg deploy has rolled
  #       through a deploy#199-shipping commit. A warning annotation
  #       surfaces the fallback so operators see the upgrade path.
  #
  # Override: `inputs.skip_stg_verify: true` skips the gate. A warning
  # annotation + job-summary entry surface the break-glass use.
  # ─────────────────────────────────────────────────────────────────
  gate-stg-verify:
    name: Gate — stg verify-deploy success
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # `issues: write` required by the break-glass-audit composite action
      # invoked from this job when `inputs.skip_stg_verify` is true. The
      # job-level `permissions:` block fully replaces the workflow-level
      # one at YAML resolution time — so without this line the audit
      # step would 403 from the GitHub Issues API on the exact path
      # the audit instrumentation exists for. (Bereket-261-rev catch.)
      issues: write
    outputs:
      gate_result: ${{ steps.gate.outputs.gate_result }}
    steps:
      - name: Checkout (for local composite action)
        if: ${{ inputs.skip_stg_verify }}
        uses: actions/checkout@v6
      - name: Break-glass audit (skip_stg_verify)
        if: ${{ inputs.skip_stg_verify }}
        uses: ./.github/actions/break-glass-audit
        with:
          input_name: skip_stg_verify
          reason: ${{ inputs.break_glass_reason }}
          bypassed: "stg-verify gate (verify-deploy.yml stg-verify-result artifact freshness check)"
          vps_host: ${{ vars.VPS_HOST }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate recent verify-deploy runs
        if: ${{ !inputs.skip_stg_verify }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Heuristic: the verify-stg job is the only path that emits the
          # `stg-verify-result` artifact, so we scan up to 50 most recent
          # `verify-deploy.yml` runs newest-first and stop at the first
          # one carrying that artifact (gate step picks it up below).
          # We don't pre-filter by upstream workflow name because gh's
          # workflow_runs payload doesn't surface the triggering workflow
          # title at this level reliably; the artifact's existence is the
          # clean signal.
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/workflows/verify-deploy.yml/runs?per_page=50" \
            --jq '.workflow_runs[] | [.id, .event] | @tsv' \
            > /tmp/verify_runs.tsv
          echo "Found $(wc -l < /tmp/verify_runs.tsv) recent verify-deploy runs."

      - name: Validate stg-verify artifact (gate)
        id: gate
        if: ${{ !inputs.skip_stg_verify }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_AGE_HOURS: ${{ inputs.stg_verify_max_age_hours }}
          API_SHORT:          ${{ needs.plan.outputs.api_short }}
          FRONTEND_SHORT:     ${{ needs.plan.outputs.frontend_short }}
          USER_SERVICE_SHORT: ${{ needs.plan.outputs.user_service_short }}
          LANDING_SHORT:      ${{ needs.plan.outputs.landing_short }}
          # Per-service digests for the v2 gate (deploy#199). Empty if the
          # service is not in this promotion's image set or if plan's
          # digest resolution failed (the latter only happens on registry
          # outage — plan fails hard in that case so we shouldn't reach here).
          API_DIGEST:          ${{ needs.plan.outputs.api_digest }}
          FRONTEND_DIGEST:     ${{ needs.plan.outputs.frontend_digest }}
          USER_SERVICE_DIGEST: ${{ needs.plan.outputs.user_service_digest }}
          LANDING_DIGEST:      ${{ needs.plan.outputs.landing_digest }}
        run: |
          set -euo pipefail

          # Validate freshness window input is a positive integer.
          if ! printf '%s' "${MAX_AGE_HOURS}" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::stg_verify_max_age_hours must be a positive integer. Got: ${MAX_AGE_HOURS}"
            exit 1
          fi

          # Walk recent verify-deploy runs newest-first; for each one,
          # try to download the `stg-verify-result` artifact and parse it.
          # Stop at the first artifact that parses cleanly — that is the
          # most recent stg-verify outcome. Then evaluate result + age.
          mkdir -p /tmp/verify_artifacts
          chosen_run_id=""
          chosen_artifact=""
          chosen_schema=""
          while IFS=$'\t' read -r run_id event; do
            # Only workflow_run-triggered verify runs matter (those are
            # auto-fired post-deploy). workflow_dispatch runs may target
            # prod or have no stg artifact at all.
            if [ "$event" != "workflow_run" ]; then
              continue
            fi
            # List artifacts for this run; look for `stg-verify-result`.
            artifacts_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[] | select(.name=="stg-verify-result") | .id' \
              2>/dev/null || true)
            if [ -z "$artifacts_json" ]; then
              continue
            fi
            artifact_id=$(printf '%s\n' "$artifacts_json" | head -n1)
            dl_dir="/tmp/verify_artifacts/${run_id}"
            mkdir -p "$dl_dir"
            # Use gh api to download the zip, then unzip.
            if ! gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPO}/actions/artifacts/${artifact_id}/zip" \
                > "${dl_dir}/artifact.zip" 2>/dev/null; then
              continue
            fi
            if ! unzip -q -o "${dl_dir}/artifact.zip" -d "$dl_dir" 2>/dev/null; then
              continue
            fi
            # Filename is `stg-verify-result-<run_id>.json` per
            # verify-deploy.yml. Use a glob to be tolerant.
            json_file=$(find "$dl_dir" -maxdepth 1 -name 'stg-verify-result-*.json' | head -n1)
            if [ -z "$json_file" ] || [ ! -f "$json_file" ]; then
              continue
            fi
            # Schema dispatch: v1 (legacy, deploy#179) and v2 (per-service
            # digests, deploy#199) are both accepted. Unknown versions
            # hard-fail per the original strict-evolution rule.
            schema_version=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('schema_version',''))" "$json_file" 2>/dev/null || echo "")
            case "$schema_version" in
              1|2)
                chosen_run_id="$run_id"
                chosen_artifact="$json_file"
                chosen_schema="$schema_version"
                break
                ;;
              *)
                echo "::error::stg-verify-result artifact for run ${run_id} has unknown schema_version=${schema_version}; refusing to gate."
                echo "::error::This gate understands schema_version in {1,2}. Update the gate before publishing a newer schema."
                exit 1
                ;;
            esac
          done < /tmp/verify_runs.tsv

          if [ -z "$chosen_run_id" ]; then
            echo "::error::No verify-deploy.yml run with a stg-verify-result artifact was found in the last 50 runs."
            echo "::error::Cannot gate prod-promote without a recent stg-verify outcome. Investigate verify-deploy.yml or run it manually before retrying promotion."
            {
              echo "## stg-verify gate FAILED — no artifact"
              echo ""
              echo "Searched 50 most-recent runs of \`verify-deploy.yml\`; none produced a \`stg-verify-result\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Using stg-verify-result from run ${chosen_run_id} (schema v${chosen_schema})"
          echo "Artifact: ${chosen_artifact}"
          cat "$chosen_artifact"
          echo ""

          # Parse fields common to both schemas.
          result=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('result',''))" "$chosen_artifact")
          commit_sha=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('commit_sha',''))" "$chosen_artifact")
          timestamp=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('timestamp',''))" "$chosen_artifact")

          # Result check applies to both schemas — a failed verify ALWAYS
          # blocks regardless of digest match / freshness.
          if [ "$result" != "success" ]; then
            echo "::error::Latest stg-verify-result is \`${result}\` (not success). Blocking prod-promote."
            echo "gate_result=blocked-failed-verify" >> "$GITHUB_OUTPUT"
            {
              echo "## stg-verify gate FAILED — verify result not success"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Schema | v${chosen_schema} |"
              echo "| Source verify-deploy run | [${chosen_run_id}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${chosen_run_id}) |"
              echo "| Artifact result | \`${result}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Freshness check (universal — both schemas care about age).
          age_seconds=$(python3 - "$timestamp" <<'PY'
          import sys, datetime
          ts = sys.argv[1]
          try:
              when = datetime.datetime.strptime(ts, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
          except ValueError:
              print(-1)
              sys.exit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          print(int((now - when).total_seconds()))
          PY
          )
          if [ "$age_seconds" = "-1" ]; then
            echo "::error::stg-verify-result timestamp could not be parsed: ${timestamp}"
            exit 1
          fi
          max_age_seconds=$(( MAX_AGE_HOURS * 3600 ))
          age_hours=$(python3 -c "print(round(${age_seconds}/3600.0, 2))")

          # ─────────────────────────────────────────────────────────────
          # Schema dispatch: v2 does strict per-service digest equality;
          # v1 falls back to the legacy freshness-window heuristic with
          # a warning annotation pointing at the upgrade path.
          # ─────────────────────────────────────────────────────────────
          if [ "$chosen_schema" = "2" ]; then
            # v2: per-service digest equality. For every service in the
            # current promotion set (non-empty plan-resolved short), the
            # plan-resolved digest MUST equal the artifact's recorded
            # service_digests[<service>]. Any mismatch FAILS the gate
            # with a per-service diff.
            verify_digests=$(python3 -c "
          import json, sys
          d = json.load(open('$chosen_artifact')).get('service_digests', {})
          print(json.dumps(d))
          ")
            diff_lines=""
            mismatch=0
            checked=0
            # Pipe-delimited so digest's embedded `:` doesn't break parsing.
            # Format: key|plan_digest|short.
            for entry in "api|${API_DIGEST}|${API_SHORT}" \
                         "frontend|${FRONTEND_DIGEST}|${FRONTEND_SHORT}" \
                         "user-service|${USER_SERVICE_DIGEST}|${USER_SERVICE_SHORT}" \
                         "landing|${LANDING_DIGEST}|${LANDING_SHORT}"; do
              key="${entry%%|*}"
              rest="${entry#*|}"
              plan_digest="${rest%%|*}"
              short="${rest##*|}"
              # Skip services not in this promotion set.
              if [ -z "$short" ]; then
                continue
              fi
              checked=$((checked + 1))
              verify_digest=$(printf '%s' "$verify_digests" | python3 -c "import json,sys,os;print(json.loads(sys.stdin.read()).get(os.environ['K'], ''))" K="$key" 2>/dev/null || echo "")
              if [ -z "$plan_digest" ]; then
                # Plan failed to resolve a digest for this service (e.g.,
                # explicit-short path + registry outage). Treat as
                # mismatch — operator must investigate before promoting.
                diff_lines="${diff_lines}- **${key}**: plan-digest missing (resolution failed); verify-digest \`${verify_digest:-<empty>}\`. Cannot confirm equality.\n"
                mismatch=$((mismatch + 1))
                continue
              fi
              if [ -z "$verify_digest" ]; then
                # Artifact has no digest for this service. Could happen
                # if verify-deploy is mid-rollout (older verify ran but
                # this service wasn't in the v2 schema's image mapping).
                diff_lines="${diff_lines}- **${key}**: verify-digest missing in artifact; plan-digest \`${plan_digest}\`. Verify mapping coverage.\n"
                mismatch=$((mismatch + 1))
                continue
              fi
              if [ "$plan_digest" != "$verify_digest" ]; then
                diff_lines="${diff_lines}- **${key}**: MISMATCH — plan \`${plan_digest}\` vs verify \`${verify_digest}\`. \`stg-latest\` moved after verify-stg captured it.\n"
                mismatch=$((mismatch + 1))
                continue
              fi
              diff_lines="${diff_lines}- **${key}**: OK — \`${plan_digest}\`\n"
            done

            {
              echo "## stg-verify gate — v2 (per-service digest)"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Schema | v2 |"
              echo "| Source verify-deploy run | [${chosen_run_id}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${chosen_run_id}) |"
              echo "| Artifact result | \`${result}\` |"
              echo "| Artifact commit_sha | \`${commit_sha}\` |"
              echo "| Artifact timestamp | \`${timestamp}\` (age ${age_hours}h) |"
              echo "| Services checked | ${checked} |"
              echo "| Mismatches | ${mismatch} |"
              echo ""
              echo "### Per-service digest comparison"
              printf '%b' "$diff_lines"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$mismatch" -gt 0 ]; then
              echo "::error::v2 gate FAILED: ${mismatch} of ${checked} services have plan/verify digest divergence. A service's stg-latest moved after stg-verify captured it — unverified bits would ship. Block promotion; re-run verify-deploy.yml against current stg state before retrying."
              echo "gate_result=blocked-v2-digest-mismatch" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "stg-verify gate PASSED (v2: all ${checked} services digest-equal)."
            echo "gate_result=passed-v2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────
          # v1 fallback: freshness-window heuristic (deploy#179 legacy).
          # Emits a warning annotation directing operators at the upgrade
          # path — once every stg deploy has rolled past this PR, every
          # artifact will be v2 and this branch is dead.
          # ─────────────────────────────────────────────────────────────
          echo "::warning::v1 artifact found at run ${chosen_run_id}; falling back to freshness-window gating. Ship deploy#199 to all stg deploy paths to upgrade to per-service-digest equality (closes the T1-window risk documented in #199)."
          if [ "$age_seconds" -gt "$max_age_seconds" ]; then
            echo "::error::stg verify is stale: artifact age=${age_hours}h exceeds max ${MAX_AGE_HOURS}h. Re-run verify-deploy.yml against current stg state, or raise stg_verify_max_age_hours if accepting risk."
            echo "gate_result=blocked-stale" >> "$GITHUB_OUTPUT"
            {
              echo "## stg-verify gate FAILED — v1 stale"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Schema | v1 (fallback path — ship #199 stg-side to upgrade) |"
              echo "| Source verify-deploy run | [${chosen_run_id}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${chosen_run_id}) |"
              echo "| Artifact age | ${age_hours}h (max ${MAX_AGE_HOURS}h) |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## stg-verify gate — v1 fallback (freshness window)"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Schema | v1 (fallback path — ship #199 stg-side to upgrade) |"
            echo "| Source verify-deploy run | [${chosen_run_id}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${chosen_run_id}) |"
            echo "| Artifact result | \`${result}\` |"
            echo "| Artifact commit_sha | \`${commit_sha}\` |"
            echo "| Artifact timestamp | \`${timestamp}\` (age ${age_hours}h, max ${MAX_AGE_HOURS}h) |"
            echo ""
            echo "### Plan-resolved per-service shorts (for audit)"
            echo "- api:          \`${API_SHORT:-<not in promotion set>}\`"
            echo "- frontend:     \`${FRONTEND_SHORT:-<not in promotion set>}\`"
            echo "- user-service: \`${USER_SERVICE_SHORT:-<not in promotion set>}\`"
            echo "- landing:      \`${LANDING_SHORT:-<not in promotion set>}\`"
            echo ""
            echo "_v1 semantics: 'latest stg verify succeeded within freshness window'. v2 (deploy#199) replaces this with per-service digest equality; once every stg deploy has rolled past #199, this fallback is unreachable._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "stg-verify gate PASSED (v1 fallback: freshness OK)."
          echo "gate_result=passed-v1-fallback" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # Pre-retag alembic gate (deploy#160).
  #
  # Runs `alembic upgrade head` on prod's user-postgres BEFORE retag
  # writes `prod-<short>` and `prod-latest`. Sequencing rationale
  # (Bereket spec, P3W1 Round 2):
  #
  #   plan → gate-stg-verify → migrate-prod → retag → trigger-prod-deploy
  #
  # `retag` is the irreversible commit-to-prod step. A migration
  # failure AFTER retag would leave prod with a forward-pinned image
  # but a half-migrated DB — recoverable only via manual rollback of
  # both image and schema. Running migrate-prod BEFORE retag keeps
  # failure recovery to "fix the migration, re-promote".
  #
  # Image tag passed: `stg-<short>` resolved by `plan` from the
  # promotion source. The `prod-<short>` tag does NOT yet exist at
  # this stage (retag is what writes it). The `stg-<short>` tag
  # points at the same digest the retag will promote, so alembic
  # runs against the exact image about to be made the prod pointer.
  #
  # Skip semantics: this job is gated on user-service being in the
  # promotion set (plan emits `user_service_short=""` when not). When
  # user-service is excluded the job is skipped and `retag` proceeds
  # via the explicit `if:` below allowing skipped-or-success.
  # ─────────────────────────────────────────────────────────────────
  migrate-prod:
    name: alembic upgrade head (prod, user-service only)
    needs: [plan, gate-stg-verify]
    # Skip if user-service is not in this promotion's image set, OR if the
    # break-glass `skip_alembic_gate` input is set.
    if: ${{ !inputs.skip_alembic_gate && needs.plan.outputs.user_service_short != '' }}
    uses: ./.github/workflows/db-migrate.yml
    with:
      env: prod
      # plan emits the bare 7-char short; alembic runs from the stg-tagged
      # image (prod-<short> doesn't exist until retag below).
      image_tag: stg-${{ needs.plan.outputs.user_service_short }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────
  # Break-glass audit for skip_alembic_gate (deploy#251).
  #
  # When `migrate-prod` is skipped because `skip_alembic_gate=true`, no
  # natural job runs to record the bypass. This job fires only on that
  # branch and emits the full audit set (job summary, warning,
  # audit-issue comment, prom textfile metric) via the composite action.
  #
  # Runs in parallel with `retag` — does NOT gate retag because the
  # bypass decision was already made operationally; this job records
  # the fact for post-hoc audit. If THIS job fails (e.g. SSH down,
  # GH token issue), it's a noisy signal but must not block the
  # emergency promotion that the bypass was for in the first place.
  # `retag` does not depend on this job.
  # ─────────────────────────────────────────────────────────────────
  audit-skip-alembic-gate:
    name: Audit — skip_alembic_gate break-glass
    needs: [plan, gate-stg-verify]
    if: ${{ inputs.skip_alembic_gate }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (for local composite action)
        uses: actions/checkout@v6
      - name: Break-glass audit (skip_alembic_gate)
        uses: ./.github/actions/break-glass-audit
        with:
          input_name: skip_alembic_gate
          reason: ${{ inputs.break_glass_reason }}
          bypassed: "alembic pre-retag migration gate (db-migrate.yml on prod user-postgres)"
          vps_host: ${{ vars.VPS_HOST }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  retag:
    name: Retag ${{ matrix.key }} (stg → prod)
    needs: [plan, gate-stg-verify, migrate-prod]
    # `migrate-prod` is gated on user-service being in the promotion set; for
    # promotions that exclude user-service it is skipped, and retag must still
    # proceed. GH Actions defaults a `needs:` to satisfied only on `success`,
    # so the explicit allow-skipped predicate is required.
    if: ${{ always() && needs.gate-stg-verify.result == 'success' && (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped') }}
    runs-on: ubuntu-latest
    # The production GH Environment carries the manual-approval reviewer rule.
    # This job does NOT touch a VPS — it only rewrites tags at GHCR. The
    # manual gate here enforces "who decides prod goes out?"; the actual
    # rollout to the prod VPS happens in deploy-prod.yml after this completes.
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.images_json) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The retag job writes prod-* tags onto packages owned by OTHER
          # repos (noorinalabs-isnad-graph, noorinalabs-user-service,
          # noorinalabs-landing-page). The default GITHUB_TOKEN scoped to
          # noorinalabs-deploy does NOT have write access to those
          # packages — earlier comment claiming "GitHub resolves
          # org-scoped package permissions from the workflow's repo token"
          # is wrong and was the cause of the 2026-05-02 emergency-restore
          # 403 permission_denied failures. Use the org-scoped
          # GH_PACKAGES_TOKEN (org secret) which has write:packages on all
          # noorinalabs/* container packages.
          password: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Resolve source tag
        id: src
        env:
          # Always source from sha-${SHORT}. The plan job resolved SHORT from
          # whatever drove this run (explicit source_sha input or stg-latest
          # digest at plan time), and sha-<short> is digest-stable per the
          # Contract v6 invariant. Sourcing from a floating tag like
          # stg-latest creates a TOCTOU race between plan, retag, and the
          # digest-parity step — surfaced 2026-05-02 (#234) when a
          # concurrent service-repo ghcr-publish caused the parity check to
          # observe three different digests across that window. sha-<short>
          # closes the race.
          SHORT: ${{ matrix.short }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          source_tag="sha-${SHORT}"
          echo "Using source tag: $IMAGE:$source_tag (matches short=$SHORT)"
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"

      - name: Retag (write prod-<short> + prod-latest atomically)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          SOURCE_TAG: ${{ steps.src.outputs.source_tag }}
          SHORT: ${{ matrix.short }}
        run: |
          set -euo pipefail
          # Single invocation writes BOTH destinations against the same
          # manifest-list. This is a pure registry-side operation — no
          # blobs pulled, no blobs pushed. Multi-arch manifest-list is
          # preserved identically.
          #
          # Failure mode we want: if either tag write fails, the command
          # errors out. `imagetools create` writes each --tag in sequence
          # but same run, so a partial success leaves us with prod-<short>
          # set but prod-latest stale — which is recoverable by rerunning.
          # We do NOT try to roll back prod-<short> on prod-latest failure;
          # a stale prod-latest is a known-safe state (points at previous
          # promotion).
          docker buildx imagetools create \
            --tag "$IMAGE:prod-$SHORT" \
            --tag "$IMAGE:prod-latest" \
            "$IMAGE:$SOURCE_TAG"
          echo "== Written tags =="
          echo "  $IMAGE:prod-$SHORT"
          echo "  $IMAGE:prod-latest"

      - name: Verify digest parity (source == prod-<short> == prod-latest)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          SOURCE_TAG: ${{ steps.src.outputs.source_tag }}
          SHORT: ${{ matrix.short }}
        run: |
          set -euo pipefail
          # Defense in depth: the retag is registry-side so digests MUST
          # match, but verifying catches registry bugs or accidental
          # buildx flag drift.
          #
          # Comparison is shape-aware (#239 fix). When the source is a
          # multi-arch index/list, `imagetools create` preserves it
          # identically and we compare top-level manifest digests directly.
          # When the source is a single-arch v2 manifest (landing-page is
          # currently the only one), `imagetools create` wraps it in a
          # NEW index whose digest is necessarily different from the
          # unwrapped source manifest. In that case we compare the source
          # digest to the destination index's `manifests[0].digest` —
          # which IS the wrapped source manifest, so equality means the
          # retag preserved content even though the surface representation
          # changed.
          src=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$SOURCE_TAG")
          src_media=$(docker buildx imagetools inspect --format '{{.Manifest.MediaType}}' "$IMAGE:$SOURCE_TAG")

          if echo "$src_media" | grep -qE 'index|manifest\.list'; then
            # Multi-arch source — direct top-level comparison.
            ps=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:prod-$SHORT")
            pl=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:prod-latest")
            shape="multi-arch (direct top-level digest comparison)"
          else
            # Single-arch source — compare against the wrapped manifest digest
            # inside the destination index.
            ps=$(docker buildx imagetools inspect --raw "$IMAGE:prod-$SHORT" | jq -r '.manifests[0].digest')
            pl=$(docker buildx imagetools inspect --raw "$IMAGE:prod-latest" | jq -r '.manifests[0].digest')
            shape="single-arch (compare source to destination's manifests[0].digest)"
          fi

          echo "Source MediaType:    $src_media"
          echo "Comparison shape:    $shape"
          echo "source digest:       $src"
          echo "prod-<short> digest: $ps"
          echo "prod-latest digest:  $pl"
          if [ "$src" != "$ps" ] || [ "$src" != "$pl" ]; then
            echo "::error::Digest parity check failed — source/prod-<short>/prod-latest diverged."
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          SHORT: ${{ matrix.short }}
        run: |
          {
            echo "## Promotion: ${{ matrix.key }} — ${{ job.status }}"
            echo ""
            echo "- **Image:** \`$IMAGE\`"
            echo "- **Source:** \`${{ steps.src.outputs.source_tag }}\`"
            echo "- **Written:** \`prod-$SHORT\` + \`prod-latest\`"
            echo "- **Actor:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-prod-deploy:
    name: Trigger prod VPS rollout
    needs: [plan, retag]
    runs-on: ubuntu-latest
    # NOT env-gated — the approval already happened at retag.
    # Firing deploy-prod.yml here is the rollout-execution step.
    #
    # Per-service tag pinning: we dispatch deploy-prod.yml with each
    # service's `prod-<short>` — NOT `prod-latest` — so that a second
    # promotion started in parallel cannot race us. If operator A runs
    # promote.yml for SHA X and operator B starts promote.yml for SHA Y
    # before A's deploy-prod.yml dispatch consumes the image, `prod-latest`
    # would move to Y and A's VPS rollout would deploy Y instead of X
    # (Lucas review 2026-04-23).
    steps:
      - name: Dispatch deploy-prod.yml (per-service pinned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_SHORT:          ${{ needs.plan.outputs.api_short }}
          FRONTEND_SHORT:     ${{ needs.plan.outputs.frontend_short }}
          USER_SERVICE_SHORT: ${{ needs.plan.outputs.user_service_short }}
          LANDING_SHORT:      ${{ needs.plan.outputs.landing_short }}
        run: |
          set -euo pipefail
          # Each tag is `prod-<short>` for its service, OR empty if that
          # service wasn't in this promotion's image set. deploy-prod.yml
          # falls back to `prod-latest` for any empty input, so partial
          # promotions still deploy the remaining services from their
          # last-promoted pointer.
          #
          # api + frontend share one short SHA (both built from the same
          # isnad-graph commit in ghcr-publish.yml). We pass api's short
          # as the canonical `api_frontend_tag`. If the two ever diverge
          # (e.g. independent frontend repo in a future split) this check
          # will fail loudly.
          if [ -n "$API_SHORT" ] && [ -n "$FRONTEND_SHORT" ] && [ "$API_SHORT" != "$FRONTEND_SHORT" ]; then
            echo "::error::api short ($API_SHORT) != frontend short ($FRONTEND_SHORT)."
            echo "::error::api + frontend are expected to share a single short SHA from isnad-graph's ghcr-publish.yml."
            exit 1
          fi
          af_short="${API_SHORT:-$FRONTEND_SHORT}"

          api_frontend_tag="${af_short:+prod-$af_short}"
          user_service_tag="${USER_SERVICE_SHORT:+prod-$USER_SERVICE_SHORT}"
          landing_tag="${LANDING_SHORT:+prod-$LANDING_SHORT}"

          echo "Dispatching deploy-prod.yml with per-service tags:"
          echo "  api+frontend: ${api_frontend_tag:-<unset — will fall back to prod-latest>}"
          echo "  user-service: ${user_service_tag:-<unset — will fall back to prod-latest>}"
          echo "  landing:      ${landing_tag:-<unset — will fall back to prod-latest>}"

          gh workflow run deploy-prod.yml \
            --ref "${{ github.ref }}" \
            -f api_frontend_tag="$api_frontend_tag" \
            -f user_service_tag="$user_service_tag" \
            -f landing_tag="$landing_tag"
