# Deploy to staging (noorinalabs-stg VPS).
#
# Triggers:
#   - repository_dispatch from isnad-graph or user-service — the auto-deploy
#     fan-in point for stg. Those service repos send
#     `deploy-noorinalabs-<service>` events after their ghcr-publish.yml has
#     pushed the four stg tags (sha-<short>, latest, stg-<short>, stg-latest)
#     per Contract v6 (canonical per Khoury ruling).
#     Note: landing-page does NOT participate in this fan-in. Its prod
#     rollout flows through promote.yml registry retag (see promote.yml
#     § landing_short), not push-time dispatch. Listener type for
#     `deploy-noorinalabs-landing-page` was dropped in deploy#285 because
#     no sender ever wired to it.
#   - workflow_dispatch — manual redeploy, e.g. to re-pull stg-latest after
#     a registry hiccup.
#
# Env scope:
#   - `environment: staging` gates secrets and vars to the GH Environment
#     `staging`. No prod secrets are reachable from this workflow.
#   - Target host comes from `vars.VPS_HOST` scoped to the `staging`
#     environment (set by deploy#83 Cloudflare DNS to `noorinalabs-stg`-
#     prefixed subdomains; hostname = `noorinalabs-stg` from deploy#150's
#     TF output `server_name`).
#
# Image tags consumed (per service — deploy#418):
#   - api + frontend share `IMAGE_TAG` in compose (both are isnad-graph
#     images). user-service has its own `USER_SERVICE_IMAGE_TAG`.
#   - Each service's commit stream is independent, so the dispatching service's
#     `sha` tags ONLY that service's image; every other service falls back to
#     `stg-latest` (its last-good stg pointer). This mirrors deploy-prod.yml's
#     per-service `prod-latest` fallback. Applying one dispatch sha to ALL
#     services was the deploy#418 bug: a user-service sha (`stg-<us-sha>`) was
#     used to pull the isnad-graph frontend, which never published that tag →
#     `frontend: not found`, failing every user-service-only merge's deploy.
#   - Manual `workflow_dispatch` with `image_tag` pins api+frontend only;
#     user-service stays on `stg-latest`.

name: Deploy to staging

on:
  repository_dispatch:
    types:
      - deploy-noorinalabs-isnad-graph
      - deploy-noorinalabs-user-service
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag suffix to deploy (default: stg-latest)"
        default: "stg-latest"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Pre-deploy alembic gate (deploy#160). Only fires for the user-service
  # dispatch path so isnad-graph / landing fan-ins don't pay alembic latency
  # or contend on the user-postgres advisory lock. Discrimination: the
  # repository_dispatch `event.action` carries the dispatched repo name (one
  # of the three `deploy-noorinalabs-<service>` types declared in `on:`).
  #
  # workflow_dispatch path is intentionally excluded — the manual operator
  # tag may target any image; running alembic against an arbitrary stg-latest
  # would be confusing. Operators wanting a manual stg migrate run dispatch
  # db-migrate.yml directly with env=stg.
  migrate:
    name: alembic upgrade head (stg, user-service only)
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'deploy-noorinalabs-user-service' }}
    # Reusable workflow accepts an empty string and falls back to `<env>-latest`
    # (db-migrate.yml § Resolve image tag). Passing empty here is safer than
    # synthesising a tag client-side: if the dispatch payload's `sha` is
    # missing or malformed the gate still runs against stg-latest, which is
    # what the user-service push fan-in already pointed at by the time its
    # ghcr-publish.yml fired this repository_dispatch.
    uses: ./.github/workflows/db-migrate.yml
    with:
      env: stg
      image_tag: ""
    secrets: inherit

  deploy:
    # Gate the existing deploy job on the alembic outcome — but ONLY when
    # the migrate job actually ran (success). For non-user-service dispatches
    # and workflow_dispatch the migrate job is skipped via its `if:` and we
    # still want deploy to proceed; GH Actions treats `needs: [migrate]` with
    # a skipped dependency as not-satisfied by default, so we re-allow via the
    # explicit `if:` below.
    needs: [migrate]
    if: ${{ always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tags (per service)
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # af_tag drives compose IMAGE_TAG (api + frontend, both isnad-graph);
          # us_tag drives USER_SERVICE_IMAGE_TAG. Route the dispatch sha ONLY to
          # the service that sent it (deploy#418); all others stay stg-latest.
          af_tag="stg-latest"   # api + frontend (isnad-graph)
          us_tag="stg-latest"   # user-service
          ld_tag="stg-latest"   # landing-page (no fan-in; always last-good stg)
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "${DISPATCH_SHA:-}" ]; then
            # 7-char short SHA per Contract v6 `<short>` definition.
            short="${DISPATCH_SHA:0:7}"
            case "${EVENT_ACTION:-}" in
              deploy-noorinalabs-isnad-graph)  af_tag="stg-$short" ;;
              deploy-noorinalabs-user-service) us_tag="stg-$short" ;;
              *) echo "::warning::Unrecognised dispatch action '${EVENT_ACTION:-}' — deploying stg-latest for all services" ;;
            esac
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_TAG:-}" ]; then
            # Manual operator tag pins api+frontend; user-service stays stg-latest.
            af_tag="$MANUAL_TAG"
          fi
          echo "Resolved tags: api/frontend=$af_tag user-service=$us_tag landing=$ld_tag"
          {
            echo "af_tag=$af_tag"
            echo "us_tag=$us_tag"
            echo "ld_tag=$ld_tag"
          } >> "$GITHUB_OUTPUT"

      # Pre-flight: every resolved per-service tag must exist in GHCR before we
      # touch the VPS. Without this, a missing manifest surfaces only as a raw
      # `docker compose pull` daemon error mid-deploy (deploy#418). Checking on
      # the runner (which holds packages:read) fails fast with a service+tag
      # named message and leaves the running stack untouched. `imagetools
      # inspect` uses the default buildx builder (pre-installed on the runner)
      # and the same registry auth the VPS pull uses.
      - name: Pre-flight — verify image manifests exist in GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AF_TAG: ${{ steps.tag.outputs.af_tag }}
          US_TAG: ${{ steps.tag.outputs.us_tag }}
          LD_TAG: ${{ steps.tag.outputs.ld_tag }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          miss=0
          check() {
            if docker buildx imagetools inspect "$1" >/dev/null 2>&1; then
              echo "OK   $1"
            else
              echo "MISS $1"; miss=1
            fi
          }
          # Cover every service compose pulls on stg (PULL_SERVICES =
          # api frontend landing user-service).
          check "ghcr.io/noorinalabs/noorinalabs-isnad-graph:$AF_TAG"
          check "ghcr.io/noorinalabs/noorinalabs-isnad-graph-frontend:$AF_TAG"
          check "ghcr.io/noorinalabs/noorinalabs-user-service:$US_TAG"
          check "ghcr.io/noorinalabs/noorinalabs-landing-page:$LD_TAG"
          if [ "$miss" -ne 0 ]; then
            echo "::error::One or more resolved image tags are missing in GHCR (see MISS above). Refusing to deploy a partial/incorrect image set (deploy#418)."
            exit 1
          fi

      # .env-write + compose roll via the shared composite action
      # (deploy#190 + #66). Stg and prod call the same composite, so
      # adding a new required secret needs one line in `env:` here +
      # one entry in `env_keys` — no remote-script edit, no risk of
      # stg/prod drift. The composite replaces the legacy `eval` env
      # loop with indirect expansion (`${!var}`), safe for secrets
      # containing quotes, backticks, dollars, or backslashes.
      - name: Deploy to stg VPS
        uses: ./.github/actions/write-deploy-env
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          KAFKA_CLUSTER_ID: ${{ secrets.KAFKA_CLUSTER_ID }}
          KAFKA_UI_PASSWORD: ${{ secrets.KAFKA_UI_PASSWORD }}
          KAFKA_UI_USER: ${{ secrets.KAFKA_UI_USER }}
          PIPELINE_B2_BUCKET: ${{ secrets.PIPELINE_B2_BUCKET }}
          PIPELINE_B2_ENDPOINT: ${{ secrets.PIPELINE_B2_ENDPOINT }}
          PIPELINE_B2_KEY: ${{ secrets.PIPELINE_B2_KEY }}
          PIPELINE_B2_KEY_ID: ${{ secrets.PIPELINE_B2_KEY_ID }}
          PIPELINE_B2_REGION: ${{ secrets.PIPELINE_B2_REGION }}
          BACKUP_B2_KEY_ID: ${{ secrets.BACKUP_B2_KEY_ID }}
          BACKUP_B2_APP_KEY: ${{ secrets.BACKUP_B2_APP_KEY }}
          BACKUP_B2_BUCKET: ${{ secrets.BACKUP_B2_BUCKET }}
          USER_POSTGRES_DB: ${{ secrets.USER_POSTGRES_DB }}
          USER_POSTGRES_PASSWORD: ${{ secrets.USER_POSTGRES_PASSWORD }}
          USER_POSTGRES_USER: ${{ secrets.USER_POSTGRES_USER }}
          USER_REDIS_PASSWORD: ${{ secrets.USER_REDIS_PASSWORD }}
        with:
          ssh_host: ${{ vars.VPS_HOST }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # IMAGE_TAG drives compose's api + frontend (isnad-graph) images.
          image_tag: ${{ steps.tag.outputs.af_tag }}
          # Per-service tag for user-service (compose USER_SERVICE_IMAGE_TAG).
          # Without this the stg path left it on compose's `:-latest` default,
          # losing the per-sha pin on user-service deploys (deploy#418).
          extra_image_tags: |
            USER_SERVICE_IMAGE_TAG=${{ steps.tag.outputs.us_tag }}
            LANDING_IMAGE_TAG=${{ steps.tag.outputs.ld_tag }}
          # Per-env observability config selection (deploy#263 + #262).
          # Stg variants for prometheus + alertmanager (different blackbox
          # targets, different Slack channel routing). SLACK_WEBHOOK_FILE
          # path is relative to /etc/alertmanager mount, populated below.
          extra_env: |
            PROM_CONFIG_FILE=prometheus.stg.yml
            ALERTMANAGER_CONFIG_FILE=alertmanager.stg.yml
            SLACK_WEBHOOK_FILE=slack_webhook_url.secret
            SMTP_PASSWORD_FILE=smtp_password.secret
            HEALTHCHECKS_URL_FILE=healthchecks_url.secret
          base_domain: stg.noorinalabs.com
          env_keys: NEO4J_PASSWORD,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,REDIS_PASSWORD,AUTH_GOOGLE_CLIENT_ID,AUTH_GOOGLE_CLIENT_SECRET,AUTH_GITHUB_CLIENT_ID,AUTH_GITHUB_CLIENT_SECRET,GRAFANA_ADMIN_PASSWORD,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,KAFKA_CLUSTER_ID,KAFKA_UI_PASSWORD,KAFKA_UI_USER,PIPELINE_B2_BUCKET,PIPELINE_B2_ENDPOINT,PIPELINE_B2_KEY,PIPELINE_B2_KEY_ID,PIPELINE_B2_REGION,BACKUP_B2_KEY_ID,BACKUP_B2_APP_KEY,BACKUP_B2_BUCKET,USER_POSTGRES_DB,USER_POSTGRES_PASSWORD,USER_POSTGRES_USER,USER_REDIS_PASSWORD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_actor: ${{ github.repository_owner }}
          # Slack webhook for alertmanager routing (deploy#262). Optional —
          # if unset, the composite writes "<unset>" placeholder and logs a
          # WARNING. Set in the `staging` Environment.
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Email-backup SMTP password (deploy#452) + Healthchecks.io dead-man's
          # switch ping URL (deploy#453). Both optional — if unset, the composite
          # writes the "<unset>" placeholder and logs a WARNING. Set in the
          # `staging` Environment.
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          healthchecks_url: ${{ secrets.HEALTHCHECKS_PING_URL }}

      - name: Verify health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/noorinalabs-deploy

            echo "==> Checking service health via Docker..."
            for i in $(seq 1 24); do
              api_health=$(docker inspect --format='{{.State.Health.Status}}' noorinalabs-api-1 2>/dev/null || echo "not_found")
              echo "Attempt $i/24: API=$api_health"
              if [ "$api_health" = "healthy" ]; then
                echo "API health check passed"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERROR: API health check failed after 120 seconds"
                docker compose -p noorinalabs -f compose/docker-compose.prod.yml logs --tail=50 api
                exit 1
              fi
              sleep 5
            done

            echo "==> Checking all container health..."
            docker compose -p noorinalabs -f compose/docker-compose.prod.yml --env-file .env ps --format '{{.Name}}\t{{.Status}}'
            echo "==> Stg deployment verified"

      # Post-deploy: reassert the owner's `admin` grant (deploy#445, option 2).
      #
      # Runs AFTER the stack is up and user-service is healthy, on EVERY stg
      # deploy (not just user-service dispatches), so the owner's admin role
      # survives redeploys and DB resets. This complements the pre-deploy
      # bootstrap in db-migrate.yml (deploy#426): that gate only fires on the
      # user-service dispatch path (deploy-stg.yml `migrate` job `if:`) and runs
      # against a one-shot image BEFORE compose-up; this step closes the gap by
      # running against the LIVE container after every deploy regardless of which
      # service triggered it.
      #
      # `docker exec` into the running noorinalabs-user-service-1 container so the
      # script resolves DATABASE_URL from the container's own environment (compose
      # already injects DATABASE_URL / DATABASE_* there). No password-bearing URL
      # is passed on argv — the only argv value is the email, which the script
      # docstring explicitly documents as an identifier, not a credential.
      #
      # Safety (why this can never fail the deploy):
      #   * `--require-user` is intentionally NOT passed. Without it the script is
      #     a no-op exit 0 when the bootstrap account does not exist yet — the
      #     account is OAuth-only, so on a fresh env this correctly no-ops until
      #     the owner logs in once; the grant then lands on the NEXT deploy.
      #   * Idempotent — a second run reports `already_admin` and exits 0.
      #   * Best-effort — wrapped in explicit rc handling (not `set -e`); a
      #     non-zero rc is LOGGED loudly but never aborts the deploy. The deploy's
      #     success signal must reflect the rollout + api health only.
      #
      # Email config (not hardcoded): pass --email only when the repo/env var
      # BOOTSTRAP_ADMIN_EMAIL is set; otherwise rely on the script's own default
      # (the owner's bootstrap email). Sourced via GH var, mirroring how
      # db-migrate.yml keeps the email out of the workflow body.
      - name: Reassert admin grant (bootstrap_admin.py)
        uses: appleboy/ssh-action@v1
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: BOOTSTRAP_ADMIN_EMAIL
          script: |
            set -uo pipefail
            cd /opt/noorinalabs-deploy

            CONTAINER="noorinalabs-user-service-1"

            # Wait for user-service to report healthy before exec-ing into it.
            # The container ships a compose healthcheck (GET /health); poll it so
            # the bootstrap runs against a ready app, not a still-starting one.
            echo "==> [stg] waiting for ${CONTAINER} to be healthy..."
            us_health="not_found"
            for i in $(seq 1 24); do
              us_health=$(docker inspect --format='{{.State.Health.Status}}' "${CONTAINER}" 2>/dev/null || echo "not_found")
              echo "Attempt $i/24: user-service=${us_health}"
              if [ "${us_health}" = "healthy" ]; then
                break
              fi
              sleep 5
            done
            if [ "${us_health}" != "healthy" ]; then
              echo "WARNING: [stg] ${CONTAINER} not healthy after 120s (status=${us_health})." >&2
              echo "         Skipping admin bootstrap this deploy; it will reassert on the next one." >&2
              echo "         This does NOT fail the deploy (rollout + api health already verified)." >&2
              exit 0
            fi

            # Build args: --email only when the GH var is set, else script default.
            set --
            if [ -n "${BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
              set -- --email "${BOOTSTRAP_ADMIN_EMAIL}"
            fi

            echo "==> [stg] post-deploy: reassert admin grant (bootstrap_admin.py)"
            set +e
            docker exec -e PYTHONPATH=/app -w /app "${CONTAINER}" \
              /app/.venv/bin/python scripts/bootstrap_admin.py "$@"
            BOOTSTRAP_RC=$?
            set -e
            if [ "${BOOTSTRAP_RC}" -eq 0 ]; then
              echo "==> [stg] admin bootstrap completed (rc=0: granted / already_admin / no-op user-not-found)"
            else
              echo "WARNING: [stg] admin bootstrap exited ${BOOTSTRAP_RC}." >&2
              echo "         This does NOT fail the deploy (rollout + api health already verified)." >&2
              echo "         rc=1 means BootstrapError — most likely the 'admin' role is missing." >&2
              echo "         Investigate per docs/runbooks/user-service-alembic.md#admin-bootstrap." >&2
            fi

      - name: Report status
        if: always()
        run: |
          {
            echo "## Deploy to staging: ${{ job.status }}"
            echo ""
            if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
              echo "- **Source repo:** ${{ github.event.client_payload.repo }}"
              echo "- **Source SHA:** ${{ github.event.client_payload.sha }}"
              echo "- **Event type:** ${{ github.event.action }}"
            fi
            echo "- **api/frontend tag:** ${{ steps.tag.outputs.af_tag }}"
            echo "- **user-service tag:** ${{ steps.tag.outputs.us_tag }}"
            echo "- **landing tag:** ${{ steps.tag.outputs.ld_tag }}"
            echo "- **Actor:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
