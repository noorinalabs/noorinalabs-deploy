# Verify a restorable backup object exists IN B2 (deploy#583)
#
# Every other backup signal we have reads a HOST-LOCAL textfile gauge. The single point of
# trust that an object ever landed in the bucket is `rclone copy; echo $?` — the uploader's
# own opinion of its upload. The whole alerting stack can be green while the bucket is empty.
#
# This job is the only thing that looks IN THE BUCKET, and it deliberately runs on a GitHub
# runner rather than on the VPS:
#
#   * A host that is down cannot report that its own backup is missing.
#   * A Prometheus gauge would have to be SCRAPED from that same host — so a metric could
#     not carry this signal either. That is why the alert here is a FAILING JOB, and why it
#     is a different layer from `BackupNeverSucceeded` / `BackupStale` / `BackupFailed`,
#     which all read `isnad_backup_last_success_timestamp_seconds` off the box.
#
# It needs no SSH and never touches the VPS. It needs only the read-scoped B2 credential.
name: Verify backup artifact (B2)

on:
  schedule:
    # 05:30 UTC — comfortably after the 03:01 nightly backup window, and offset off the
    # hour to avoid the scheduler's peak.
    - cron: "30 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify_b2_backup_artifact.sh"
      - "scripts/tests/test_b2_backup_artifact.py"
      - ".github/workflows/verify-backup-artifact.yml"

permissions:
  contents: read

jobs:
  # On a PR we cannot reach B2 (no env secrets), and we should not want to: what a PR must
  # prove is that the SCANNER still separates the classes. That is exactly the self-test.
  self-test:
    name: Scanner self-test (no B2 access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: The scanner must separate fresh / absent / stale / instrument-error
        run: bash scripts/verify_b2_backup_artifact.sh --self-test

  verify:
    # Not on PRs: the environment secrets do not resolve there, and a job that cannot see
    # the bucket must not report on it.
    if: github.event_name != 'pull_request'
    name: ${{ matrix.env }} — is there a restorable object in B2?
    runs-on: ubuntu-latest
    environment: ${{ matrix.env == 'prod' && 'production' || 'staging' }}
    strategy:
      fail-fast: false # stg being broken must not hide prod being broken
      matrix:
        env: [stg, prod]
    # The `runbook:` pointer, carried the way the Prometheus backup alerts carry theirs
    # (`infra/prometheus/alerts.yml` § backup — every rule there annotates
    # `runbook: docs/runbooks/backup-alerts.md#<anchor>`). Same convention, same file, same
    # anchor scheme — deliberately NOT a new one.
    #
    # It travels WITH the alert, on every failing path and in the summary, because a runbook
    # the operator has to go LOOKING for at 3am is a runbook that does not exist. This job
    # emits ELEVEN distinct (status, reason) outcomes — deploy#588 said ten; the eleventh is
    # `incomplete reason=undersized_dumps`, which shares its reason STRING with an `absent`
    # row and is a different fault — and they map nearly one-to-one onto different fixes.
    #
    # The least guessable is `future_timestamp`: a broken VPS CLOCK, so the READING cannot be
    # trusted. Say exactly that and no more. It is NOT the same as "the backups are fine" —
    # the future guard returns BEFORE the age check, so a poisoned object SUPPRESSES a `stale`
    # verdict underneath it (measured: a bucket with no backup for 40 days reports
    # `future_timestamp`, not `stale`). And fixing NTP does not clear it: `rclone` preserves
    # the source mtime, so the bad clock is frozen into the object at upload and the object
    # must be removed or re-dated. A claim that is true of the INSTRUMENT and false of the
    # BUCKET is the exact hazard this whole script refuses to ship (deploy#588, #594 review).
    env:
      RUNBOOK: docs/runbooks/backup-alerts.md#backupartifactcheck
      RUNBOOK_TORN: docs/runbooks/backup-alerts.md#tornbackup
    steps:
      - uses: actions/checkout@v6

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Verify a restorable backup object exists
        id: verify
        env:
          # Env-scoped secrets. Read-only key; this job never writes to the bucket.
          # rclone native env — the credential never appears on argv, so it cannot surface
          # in a process listing or in the run log (deploy#556).
          RCLONE_CONFIG_ISNAD_TYPE: b2
          RCLONE_CONFIG_ISNAD_ACCOUNT: ${{ secrets.BACKUP_B2_KEY_ID }}
          RCLONE_CONFIG_ISNAD_KEY: ${{ secrets.BACKUP_B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.BACKUP_B2_BUCKET }}
          MAX_AGE_HOURS: "30"
        run: |
          set -uo pipefail
          if [ -z "${RCLONE_CONFIG_ISNAD_ACCOUNT}" ] || [ -z "${B2_BUCKET}" ]; then
            echo "::error::BACKUP_B2_* secrets are not set for ${{ matrix.env }}."
            echo "  This job cannot see the bucket, so it will NOT report on it. An absent"
            echo "  credential is an INSTRUMENT failure, not evidence that backups are fine."
            exit 1
          fi

          # The script self-tests before it reads, and refuses to report a verdict from an
          # uncalibrated scanner. Its exit codes: 0 fresh, 1 alert, 2 instrument error.
          set +e
          OUT="$(B2_ROOT="isnad:${B2_BUCKET}" bash scripts/verify_b2_backup_artifact.sh 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "${OUT}"

          # The one machine-readable line, for the summary.
          LINE="$(printf '%s\n' "${OUT}" | grep -o 'B2_BACKUP_ARTIFACT .*' | head -n1)"
          echo "line=${LINE}" >> "$GITHUB_OUTPUT"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

          # The REASON, not just the status — it is what selects the fix, and it is the thing
          # the operator would otherwise have to reverse-engineer. Carried into the annotation
          # alongside the runbook anchor.
          REASON="$(printf '%s\n' "${LINE}" | sed -n 's/.*[[:space:]]reason=\([^[:space:]]*\).*/\1/p')"
          TORN="$(printf '%s\n' "${LINE}" | sed -n 's/.*[[:space:]]torn=\([0-9]*\).*/\1/p')"
          if [ -z "${TORN}" ]; then TORN=0; fi
          echo "torn=${TORN}" >> "$GITHUB_OUTPUT"

          case "${RC}" in
            0) echo "::notice::${{ matrix.env }}: a fresh restorable backup object exists in B2." ;;
            1) echo "::error::${{ matrix.env }}: NO fresh restorable backup object in B2 (reason=${REASON}). The host-local gauges may be green — they do not look in the bucket. Runbook: ${RUNBOOK}" ;;
            *) echo "::error::${{ matrix.env }}: could not scan B2 (reason=${REASON}) — credentials / network / bucket / VPS clock. This is NOT a claim that backups are missing. Runbook: ${RUNBOOK}" ;;
          esac

          # --- THE ONE FAULT THAT FIRES ON A GREEN RUN. --------------------------------
          # A run that attested `complete=true` and did NOT fully arrive. The scanner exits 0
          # — correctly: an older run IS complete and intact, so a restorable backup exists and
          # `restore.sh latest` will find it. But it has just watched a run CLAIM completeness
          # and lie, and that is a defect in backup.sh's attestation path that will recur
          # tonight.
          #
          # So this is keyed on `torn>0` INDEPENDENT OF THE EXIT CODE, deliberately: every other
          # outcome here is reason->action off a non-zero rc, and this one would otherwise scroll
          # past in the log of a passing job with nobody paged for it (deploy#591 review, Nino
          # Kavtaradze; deploy#588).
          #
          # It does NOT flip the job red. A usable backup genuinely exists, and failing here
          # would be the false alarm this whole check was built to avoid.
          if [ "${TORN}" -gt 0 ]; then
            echo "::warning::${{ matrix.env }}: torn=${TORN} — a run attested complete=true and did NOT fully arrive. A restorable backup still exists (this job is green), but the PRODUCER is at fault and it will recur. Runbook: ${RUNBOOK_TORN}"
          fi

          exit "${RC}"

      # The reason codes ARE the diagnosis — they map nearly one-to-one onto different fixes.
      # Rendering only the status threw that away and left the operator to reverse-engineer,
      # at 3am, both what `reason=missing_stores,isnad-userpg` means and what to do about it.
      # A taxonomy an operator cannot act on is a taxonomy that gets ignored, and an ignored
      # backup signal is how deploy#559 happened. (deploy#588)
      #
      # Every row below was traced to the line in scripts/verify_b2_backup_artifact.sh that
      # emits it. The canonical, fuller version lives in the runbook — this table is the
      # 3am-legible subset, and it carries the link.
      - name: Summary
        if: always()
        env:
          LINE: ${{ steps.verify.outputs.line }}
          RC: ${{ steps.verify.outputs.rc }}
          TORN: ${{ steps.verify.outputs.torn }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "## Backup artifact in B2 — ${{ matrix.env }}: ${{ job.status }}"
            echo ""
            if [ -n "${LINE:-}" ]; then
              echo '```'
              echo "${LINE}"
              echo '```'
            else
              # No result line: the step did not reach a verdict. Say that, rather than
              # render a healthy-looking blank.
              echo "**No verdict was produced.** The scan did not complete, so nothing is known"
              echo "about the bucket's contents. Do NOT read this as \"backups are fine\"."
            fi
            echo ""
            echo "**Runbook: [\`${RUNBOOK}\`](${REPO_URL}/blob/main/${RUNBOOK})**"
            echo ""
            echo "This is the **only** check that looks inside the bucket. Every other backup"
            echo "alert reads a host-local gauge — those report that \`backup.sh\` RAN and that"
            echo "\`rclone\` returned 0. They cannot see an empty bucket."
            echo ""

            # The torn banner goes FIRST, and it goes up even when this job is GREEN — that is
            # the entire point of the field. See the verify step for why it does not fail the job.
            if [ "${TORN:-0}" != "0" ] && [ -n "${TORN:-}" ]; then
              echo "> ### :rotating_light: \`torn=${TORN}\` — a producer fault, on a run that PASSED"
              echo ">"
              echo "> A run attested \`complete=true\` and its dumps did **not** all arrive. The"
              echo "> producer's word and the bucket **disagree** — and only the disagreement is a"
              echo "> fault. (An honest \`complete=false\` partial is \`skipped\`, not \`torn\`;"
              echo "> \`backup.sh\` emits those by design.)"
              echo ">"
              echo "> This job is green because an **older** run is complete and intact, so a"
              echo "> restorable backup does exist. But \`backup.sh\` claimed completeness and lied,"
              echo "> and it will do it again tonight. **Fix the producer, not the bucket.**"
              echo ">"
              echo "> Triage: [\`${RUNBOOK_TORN}\`](${REPO_URL}/blob/main/${RUNBOOK_TORN})"
              echo ""
            fi

            echo "### What the reason code means, and what to do"
            echo ""
            echo "| status | reason | rc | Meaning | Action |"
            echo "|---|---|---|---|---|"
            echo "| \`fresh\` | — | 0 | Newest attested run is complete, all stores arrived, within the age bound. | Nothing — **unless \`torn>0\`** (above). |"
            echo "| \`stale\` | \`too_old\` | 1 | A complete run exists but is older than \`MAX_AGE_HOURS\` (30). | The nightly stopped landing. Check \`isnad-backup.timer\` + \`journalctl -u isnad-backup.service\`. |"
            echo "| \`absent\` | \`no_dumps\` | 1 | Bucket reachable, **no dumps at all**. | **Check \`bucket_objects\` first** — if \`> 0\`, the bucket has contents but not under the scanned prefix (wrong bucket/prefix). If \`0\`, backups have never landed. |"
            echo "| \`absent\` | \`undersized_dumps\` | 1 | Dumps exist but **every** one is under the 1 KiB floor. | \`pg_dump\` is failing **after** creating the file — the dump leg, not the upload. Check the journal + disk. |"
            echo "| \`incomplete\` | \`no_complete_backup\` | 1 | Dumps exist; **not one run attests** \`complete=true\`. | A leg fails every night. \`backup.sh\` marks its partials honestly — find the failing store in the journal. |"
            echo "| \`incomplete\` | \`missing_stores,…\` | 1 | An attested run's dumps did **not** all arrive, **and nothing older qualified**. | The upload was interrupted after the manifest landed. **Nothing is restorable — this is the emergency.** The named stores are what to chase. |"
            echo "| \`incomplete\` | \`undersized_dumps\` | 1 | An attested run carries a dump under the floor — attested **and** corrupt. | **Not the \`absent\` row above**, despite the same reason string: there, nothing is restorable anywhere; here the *attested* run is corrupt. Fix the producer. |"
            echo "| \`incomplete\` | \`manifest_ts_mismatch\` | 1 | The manifest's \`timestamp=\` disagrees with the run id it is filed under (or is absent), so it is refused. | Producer bug in \`backup.sh\`'s manifest write. **Do not hand-edit the manifest** — that binding is what prevents a torn restore. |"
            echo "| \`instrument_error\` | \`unreachable\` | 2 | \`rclone lsf\` failed. **Nothing is known about the backups.** | Not a backup alert. Credentials / network / bucket name. \`rclone\`'s stderr is in the log above. |"
            echo "| \`instrument_error\` | \`manifest_unreadable\` | 2 | The manifest could not be **read** (401, throttle, blip). \"Could not read\" ≠ \"does not attest\". | Re-run; check credentials. The dumps may be perfectly fine. |"
            echo "| \`instrument_error\` | \`future_timestamp\` | 2 | **The VPS clock is wrong, so this READING cannot be trusted.** \`rclone\` preserves the source mtime, so the object's timestamp *is* the VPS clock at dump time. A broken **instrument** — it says nothing either way about your backups. **Do not read it as \"backups are fine\".** | **1.** Fix the clock (\`timedatectl status\`) — stops *new* poisoned objects. **2.** **Remove/re-date the poisoned object** (\`newest=\` names it): the bad mtime is frozen into it at upload, so fixing NTP alone leaves this red for the whole skew window. **3.** **Re-run** — \`future_timestamp\` preempts the age check, so a \`stale\` bucket can be hiding underneath. |"
            echo ""
            echo "\`instrument_error\` (rc=2) is never a claim about your backups — it means the"
            echo "scan could not look. An empty \`rclone\` listing exits 0 and prints nothing, so"
            echo "\"no backups\" and \"I cannot see the bucket\" must never collapse into each other."
          } >> "$GITHUB_STEP_SUMMARY"
