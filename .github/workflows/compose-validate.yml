name: Compose & Infra Validate
on:
  pull_request:
    paths:
      - 'compose/**'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'compose/**'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize .env from .env.example with CI placeholders
        working-directory: compose
        run: |
          cp .env.example .env
          # Required vars (`:?`) that are empty in .env.example need non-empty placeholders
          # so `docker compose config` can resolve them. These values are CI-only and
          # never reach a running container.
          {
            echo "AUTH_GOOGLE_CLIENT_ID=ci-placeholder"
            echo "AUTH_GOOGLE_CLIENT_SECRET=ci-placeholder"
            echo "AUTH_GITHUB_CLIENT_ID=ci-placeholder"
            echo "AUTH_GITHUB_CLIENT_SECRET=ci-placeholder"
            echo "JWT_PRIVATE_KEY=ci-placeholder"
            echo "JWT_PUBLIC_KEY=ci-placeholder"
            # Kafka KRaft cluster id must look like a base64-encoded UUID (22 chars).
            echo "KAFKA_CLUSTER_ID=MkU3OEVCNTcwNTJENDM2Qk"
            # Caddy per-env hostname root (deploy#218). Real value written by
            # deploy-{stg,prod}.yml — `noorinalabs.com` for prod, `stg.noorinalabs.com` for stg.
            echo "BASE_DOMAIN=ci.example"
          } >> .env
      - name: Validate compose config
        working-directory: compose
        run: docker compose -f docker-compose.prod.yml --env-file .env config --quiet

  alertmanager-config:
    name: amtool check-config (Alertmanager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install amtool
        run: |
          set -euo pipefail
          AMTOOL_VERSION="0.28.1"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${AMTOOL_VERSION}/alertmanager-${AMTOOL_VERSION}.linux-amd64.tar.gz" \
            -o /tmp/alertmanager.tar.gz
          # Verify checksum against published SHA256SUMS (deploy#274 integrity discipline).
          EXPECTED_SHA=$(curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${AMTOOL_VERSION}/sha256sums.txt" \
            | grep "alertmanager-${AMTOOL_VERSION}.linux-amd64.tar.gz" | awk '{print $1}')
          echo "${EXPECTED_SHA}  /tmp/alertmanager.tar.gz" | sha256sum -c -
          tar -xzf /tmp/alertmanager.tar.gz -C /tmp
          sudo mv "/tmp/alertmanager-${AMTOOL_VERSION}.linux-amd64/amtool" /usr/local/bin/amtool
          amtool --version
      - name: Check CI placeholder config syntax
        run: amtool check-config infra/alertmanager/alertmanager.yml
      - name: Route-tree dry-run (warning severity)
        run: |
          amtool config routes test \
            --config.file=infra/alertmanager/alertmanager.yml \
            severity=warning
      - name: Route-tree dry-run (critical severity)
        run: |
          amtool config routes test \
            --config.file=infra/alertmanager/alertmanager.yml \
            severity=critical

  shellcheck:
    name: shellcheck infra & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(find infra scripts -type f -name '*.sh' 2>/dev/null)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"
