name: Compose & Infra Validate
on:
  pull_request:
    paths:
      - 'compose/**'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'compose/**'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize .env from .env.example with CI placeholders
        working-directory: compose
        run: |
          cp .env.example .env
          # Required vars (`:?`) that are empty in .env.example need non-empty placeholders
          # so `docker compose config` can resolve them. These values are CI-only and
          # never reach a running container.
          {
            echo "AUTH_GOOGLE_CLIENT_ID=ci-placeholder"
            echo "AUTH_GOOGLE_CLIENT_SECRET=ci-placeholder"
            echo "AUTH_GITHUB_CLIENT_ID=ci-placeholder"
            echo "AUTH_GITHUB_CLIENT_SECRET=ci-placeholder"
            echo "JWT_PRIVATE_KEY=ci-placeholder"
            echo "JWT_PUBLIC_KEY=ci-placeholder"
            # Kafka KRaft cluster id must look like a base64-encoded UUID (22 chars).
            echo "KAFKA_CLUSTER_ID=MkU3OEVCNTcwNTJENDM2Qk"
            # Caddy per-env hostname root (deploy#218). Real value written by
            # deploy-{stg,prod}.yml — `noorinalabs.com` for prod, `stg.noorinalabs.com` for stg.
            echo "BASE_DOMAIN=ci.example"
            # Observability per-env config selection (deploy#262 + #263).
            # The .env.example defaults are sufficient (prod variant +
            # `.example` slack file), but enumerate explicitly so ci-time
            # validation also exercises the override path readers will see
            # in deploy-{stg,prod}.yml at runtime.
            echo "PROM_CONFIG_FILE=prometheus.prod.yml"
            echo "ALERTMANAGER_CONFIG_FILE=alertmanager.prod.yml"
            echo "SLACK_WEBHOOK_FILE=slack_webhook_url.secret.example"
          } >> .env
      - name: Validate compose config
        working-directory: compose
        run: docker compose -f docker-compose.prod.yml --env-file .env config --quiet

  shellcheck:
    # deploy#74: backup/restore are critical DR scripts only exercised in
    # production via the systemd timer; this job is the only PR-time gate
    # against bash regressions before they reach the VPS. shellcheck catches
    # quoting / word-splitting bugs; `bash -n` catches parse-time syntax
    # errors that shellcheck doesn't always reject (e.g. mismatched heredocs
    # in some shellcheck modes). Both are <2s — cheap belt-and-braces.
    name: shellcheck + bash -n (infra & scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Discover shell scripts
        id: discover
        run: |
          mapfile -t files < <(find infra scripts -type f -name '*.sh' 2>/dev/null)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint."
            echo "found=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          # Newline-joined list, GH-Actions multiline-output safe-delimiter form.
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "found=1" >> "$GITHUB_OUTPUT"
      - name: Lint shell scripts (shellcheck)
        if: steps.discover.outputs.found == '1'
        run: |
          mapfile -t files <<< "${{ steps.discover.outputs.files }}"
          shellcheck "${files[@]}"
      - name: Validate shell script syntax (bash -n)
        if: steps.discover.outputs.found == '1'
        run: |
          mapfile -t files <<< "${{ steps.discover.outputs.files }}"
          fail=0
          for f in "${files[@]}"; do
            if bash -n "$f"; then
              echo "OK  $f"
            else
              echo "::error file=$f::bash -n syntax check failed"
              fail=1
            fi
          done
          exit "$fail"

  python-lint:
    # noorinalabs-main#326: deploy's own Python tooling — the standalone
    # scripts under scripts/ and .github/workflows/scripts/ — had NO ruff/mypy
    # gate. hooks-lint.yml only lints .claude/hooks/*.py (none in this
    # dispatcher-style child, so it skips), and the shellcheck job above is
    # *.sh-only. So check_tf_apply_locking.py / env-inventory.py /
    # cold_rebuild_static_checks.py were ungated despite being CI-critical
    # (the TF-apply-lock regression guard and the cold-rebuild shape guards
    # run from these). This job is the missing Python floor, mirroring
    # hooks-lint.yml's ruff/mypy pattern. Pinned to ruff 0.11.6 — the same
    # version the .pre-commit-config.yaml mirror + org rollout ship — so local
    # `pre-commit` and CI run the identical tool (#327 fail-fast parity).
    # integration-tests/ is out of scope here: it is pytest-gated by
    # integration-tests.yml and carries its own dev-deps/config.
    name: ruff + mypy (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Discover Python scripts
        id: discover
        shell: bash
        run: |
          mapfile -t files < <(find scripts .github/workflows/scripts -type f -name '*.py' 2>/dev/null)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python scripts found — nothing to lint."
            echo "found=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          echo "found=1" >> "$GITHUB_OUTPUT"
      - name: Install ruff + mypy (pinned)
        if: steps.discover.outputs.found == '1'
        # ruff 0.11.6 matches .pre-commit-config.yaml's ruff-pre-commit rev and
        # the org rollout pin. types-PyYAML supplies the stubs for
        # check_tf_apply_locking.py's `import yaml` so mypy doesn't trip on
        # import-untyped (which --ignore-missing-imports does NOT suppress).
        run: pip install ruff==0.11.6 mypy types-PyYAML
      - name: Ruff lint (scripts)
        if: steps.discover.outputs.found == '1'
        run: ruff check scripts .github/workflows/scripts
      - name: Ruff format --check (scripts)
        if: steps.discover.outputs.found == '1'
        run: ruff format --check scripts .github/workflows/scripts
      - name: Mypy type check (scripts)
        if: steps.discover.outputs.found == '1'
        run: mypy scripts .github/workflows/scripts --ignore-missing-imports --no-error-summary

  passlist-drift:
    # deploy#97: catch drift between compose's :?-required vars and the
    # deploy-stg/deploy-prod env_keys passlists at PR-review time, before
    # a missing wire blocks a real deploy. Today the drift is detected
    # only at compose-up time (e.g. PR #95 + run 24612922259 surfaced
    # 6 missing vars post-merge).
    #
    # Compose vars known NOT to come from secrets — caller writes them
    # directly inside the .env-write composite (IMAGE_TAG, BASE_DOMAIN)
    # or via extra_image_tags (USER_SERVICE_IMAGE_TAG, LANDING_IMAGE_TAG).
    # PROM_CONFIG_FILE + ALERTMANAGER_CONFIG_FILE + SLACK_WEBHOOK_FILE are
    # also written by the composite (deploy#262 + #263 wired in via the
    # composite per-env). These are listed in WORKFLOW_WRITTEN so the diff
    # doesn't false-positive.
    name: deploy passlist vs compose :?-required drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diff compose required-vars vs workflow env_keys
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          compose = Path("compose/docker-compose.prod.yml").read_text()
          # Match ${NAME:?...} — the compose syntax for "required, fail if unset/empty".
          required = set(re.findall(r"\$\{([A-Z_][A-Z0-9_]*):\?", compose))

          # Vars written by the workflow itself (composite action), not pulled from secrets.
          workflow_written = {
              "IMAGE_TAG", "BASE_DOMAIN",
              "USER_SERVICE_IMAGE_TAG", "LANDING_IMAGE_TAG",
              "PROM_CONFIG_FILE", "ALERTMANAGER_CONFIG_FILE", "SLACK_WEBHOOK_FILE",
          }
          expected_in_passlist = required - workflow_written

          def passlist(workflow_path):
              text = Path(workflow_path).read_text()
              # `env_keys: NAME1,NAME2,...` (write-deploy-env composite shape).
              # We only need the single-line CSV form because that's what the
              # composite caller uses. Anchor on the leading `env_keys:`.
              m = re.search(r"^\s*env_keys:\s*([A-Z0-9_,]+)\s*$", text, re.M)
              if not m:
                  print(f"::error file={workflow_path}::could not find `env_keys:` CSV line")
                  sys.exit(1)
              return {tok.strip() for tok in m.group(1).split(",") if tok.strip()}

          stg = passlist(".github/workflows/deploy-stg.yml")
          prod = passlist(".github/workflows/deploy-prod.yml")

          failed = False
          for env_name, passed in (("stg", stg), ("prod", prod)):
              missing = expected_in_passlist - passed
              if missing:
                  failed = True
                  print(f"::error file=.github/workflows/deploy-{env_name}.yml::"
                        f"deploy-{env_name} env_keys missing required compose vars: {sorted(missing)}")
                  print("  Compose declares the var as required for each. Without these in env_keys,")
                  print(f"  the deploy will fail at `compose up` with 'required variable NAME is missing a value'.")

          # Symmetric direction: vars in passlist that compose doesn't reference at all.
          # Informational only — extras in passlist aren't a deploy-breaker, just stale-wire potential.
          # We do NOT fail on extras (workflow may legitimately ship secrets compose doesn't use yet).
          compose_referenced = set(re.findall(r"\$\{([A-Z_][A-Z0-9_]*)", compose))
          for env_name, passed in (("stg", stg), ("prod", prod)):
              extras = (passed - workflow_written) - compose_referenced
              if extras:
                  print(f"::warning file=.github/workflows/deploy-{env_name}.yml::"
                        f"deploy-{env_name} env_keys references vars compose doesn't use: {sorted(extras)}")

          if failed:
              sys.exit(1)
          print("Passlist drift check: OK")
          print(f"  Compose required vars (filtered): {sorted(expected_in_passlist)}")
          print(f"  Stg passlist size: {len(stg)} | Prod passlist size: {len(prod)}")
          PY

  promtool-check:
    # deploy#212 — PR-time validation of Prometheus alerts.yml + per-env
    # prometheus.{stg,prod}.yml. Previously alert-author PRs relied on
    # author + reviewer running `promtool check` locally; CI gate makes
    # this deterministic and closes the local-promtool-version-drift gap.
    # Pinned to the same v3.4.0 image deployed in compose/docker-compose.prod.yml.
    #
    # `--entrypoint promtool` overrides the image's default ENTRYPOINT
    # (`/bin/prometheus`) — without it, docker treats `promtool ...` as
    # arguments to prometheus and exits with "unexpected promtool".
    # Verified against prometheus v3.4.0 Dockerfile.
    name: promtool check (rules + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate alerts.yml
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.4.0 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate prometheus.prod.yml
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.4.0 \
            check config /etc/prometheus/prometheus.prod.yml
      - name: Validate prometheus.stg.yml
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.4.0 \
            check config /etc/prometheus/prometheus.stg.yml

  amtool-check:
    # deploy#212 sibling — validate per-env alertmanager configs (deploy#262
    # + #263). amtool ships in the prom/alertmanager image and parses the
    # full config schema, catching typos in receivers/routes/inhibit_rules
    # that Alertmanager would otherwise fail to load at runtime.
    #
    # `--entrypoint amtool` overrides the image's default ENTRYPOINT
    # (`/bin/alertmanager`) — same rationale as promtool above.
    name: amtool check-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate alertmanager.prod.yml
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.prod.yml
      - name: Validate alertmanager.stg.yml
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.stg.yml

  scripts-pytest:
    # deploy#428 — unit tests for the standalone helpers under scripts/ that
    # have no other runtime gate. Today the only such test is
    # scripts/tests/test_kafka_logdir_preflight.py, which exercises the
    # KRaft stray-non-topic-directory detector (scripts/kafka_logdir_preflight.sh)
    # used by the write-deploy-env pre-flight. A real kafka_data volume is not
    # available in CI, so the detector's directory-classification logic is
    # tested against fixture dir layouts (clean vs stray-config/data). The .sh
    # itself is already shellcheck + bash -n gated by the shellcheck job above;
    # this job is the behavioral floor. Mirrored in .pre-commit-config.yaml
    # (pytest-scripts pre-push hook) so the sync-drift gate stays green.
    name: pytest (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run scripts unit tests
        run: python3 -m pytest scripts/tests -q
