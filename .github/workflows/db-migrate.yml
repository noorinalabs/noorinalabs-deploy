name: DB Migrate (user-service alembic)

# Reusable workflow. Invoked by the promotion workflow (deploy#84) as a
# pre-deploy gate. Runs `alembic upgrade head` inside a user-service container
# against the target env's user-postgres. Fails fast on migration failure;
# a stg failure must block the prod promotion in the caller's job graph.
#
# Single-head assertion — DERIVE, don't pin (deploy#412, supersedes the
# literal-pin design of deploy#85/#407). Before `alembic upgrade head`, assert
# that `alembic heads` (run inside the very image we are about to deploy)
# reports exactly ONE head, then DERIVE that head's revision from the image
# itself rather than comparing it to a hardcoded revision. The image is the
# single source of truth for "what head should the DB be at", so a normal new
# migration in user-service can no longer wedge the deploy. This kills the
# recurring EXPECTED_MERGE_HEAD drift (deploy#407: `0041` landed in us#54/#520
# without a lockstep bump and hard-stopped every stg deploy until someone
# noticed). The single-head assertion is what actually catches the dangerous
# case — a migration added without a proper `down_revision`, which produces TWO
# heads and which `alembic upgrade head` would mishandle.
#
# EXPECTED_MERGE_HEAD (below) is now an OPTIONAL opt-in tripwire, default "".
# Leave it empty for the drift-proof derive behavior. Set it to a revision id
# only to pin a specific high-stakes promotion; a mismatch then is reported as
# EITHER stale-pin drift (bump/clear the pin) OR a real unexpected-image
# mismatch (investigate tag resolution) — see the assertion block below and
# docs/runbooks/user-service-alembic.md §2.
#
# Post-migrate admin bootstrap (deploy#426): right after `alembic upgrade head`
# the same SSH step reasserts the `admin` role grant on the bootstrap account via
# user-service's idempotent scripts/bootstrap_admin.py (us#159). It is
# best-effort and never fails the gate — see the step body and
# docs/runbooks/user-service-alembic.md#admin-bootstrap.

on:
  workflow_call:
    inputs:
      env:
        description: "Target env — stg or prod"
        required: true
        type: string
      image_tag:
        description: "user-service image tag to run alembic from (defaults to <env>-latest per isnad-graph#815 Contract v6)"
        required: false
        type: string
        default: ""
    outputs:
      migrated:
        description: "true if alembic upgrade head succeeded, false otherwise"
        value: ${{ jobs.migrate.outputs.migrated }}

  workflow_dispatch:
    inputs:
      env:
        description: "Target env — stg or prod"
        required: true
        type: choice
        options: [stg, prod]
      image_tag:
        description: "user-service image tag (leave empty for <env>-latest)"
        required: false
        type: string
        default: ""

concurrency:
  # Serialize migrations per env. Never run two alembic upgrades against the
  # same Postgres concurrently — alembic's version-table lock would serialize
  # them anyway, but failing a second run loudly is cleaner than a 30s wait.
  group: db-migrate-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  migrate:
    name: alembic upgrade head (${{ inputs.env }})
    runs-on: ubuntu-latest
    # Maps to GH Environment protection rules — same pattern as terraform.yml
    # (stg → staging, prod → production). Per-env secrets resolve from the
    # matching Environment; no cross-env leakage.
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    permissions:
      # GHCR pull happens on the VPS via the runtime GITHUB_TOKEN that the
      # promotion workflow already injects; this job only SSHes.
      contents: read
    outputs:
      migrated: ${{ steps.record.outputs.migrated }}
    env:
      # OPTIONAL opt-in head pin. Default "" → derive the expected head from the
      # image (drift-proof; the normal mode). Set to a revision id ONLY to pin a
      # specific promotion; the gate then additionally asserts the image's single
      # head equals it. See the header comment and the assertion block below.
      EXPECTED_MERGE_HEAD: ""
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            # Contract v6 (isnad-graph#815 issuecomment-4301538921, option C,
            # program-director ruling — supersedes v5/earlier): env-scoped
            # floating tag `<env>-latest` always resolves to the current
            # promoted image for that env. Pinned `<env>-<short>` tags are
            # preferred for auditability; fall back here is for dispatch
            # testing only.
            tag="${{ inputs.env }}-latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using user-service image tag: $tag"

      - name: Run alembic pre-deploy gate on ${{ inputs.env }} VPS
        id: run
        # continue-on-error so the runner-side `Record migration result` step
        # below can observe `steps.run.outcome` and emit the `migrated` output
        # the caller (#155 promotion workflow) gates on. Without this, set -e
        # at the job level short-circuits before we can record the signal.
        # The trailing `exit 1` in the record step preserves job failure for
        # the caller's `if: needs.migrate.result == 'success'` gating.
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          ENV_NAME: ${{ inputs.env }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_MERGE_HEAD: ${{ env.EXPECTED_MERGE_HEAD }}
          # DATABASE_URL is assembled on the VPS from the existing user-*
          # compose env-file the deploy user already writes. We do NOT pass
          # USER_POSTGRES_PASSWORD through the GH Actions transport here —
          # the env-file on the VPS is the single source of truth and has
          # already been gated by the environment-protection approval.
          USER_POSTGRES_USER: ${{ secrets.USER_POSTGRES_USER }}
          USER_POSTGRES_DB: ${{ secrets.USER_POSTGRES_DB }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: ENV_NAME,IMAGE_TAG,EXPECTED_MERGE_HEAD,USER_POSTGRES_USER,USER_POSTGRES_DB,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -euo pipefail

            cd /opt/noorinalabs-deploy

            # .env on the VPS holds USER_POSTGRES_PASSWORD / USER_POSTGRES_USER
            # / USER_POSTGRES_DB. It was written most recently by the deploy
            # workflow for this env and has mode 600. Read it with `set -a`
            # so every KEY=VAL becomes exported, matching docker-compose.
            if [ ! -f .env ]; then
              echo "ERROR: /opt/noorinalabs-deploy/.env is missing on ${ENV_NAME} VPS."
              echo "       The deploy workflow has never written env-file here, or it was removed."
              exit 1
            fi
            # The VPS .env carries an IMAGE_TAG for docker-compose's runtime,
            # but it can be stale (a prior deploy's tag, possibly GC'd). The
            # tag this gate must pull is the workflow-resolved one (step `tag`,
            # defaults to <env>-latest). Preserve it across the sourcing so the
            # .env's IMAGE_TAG does not clobber the resolved pull tag (#367).
            WANT_TAG="$IMAGE_TAG"
            set -a
            . ./.env
            set +a
            IMAGE_TAG="$WANT_TAG"

            # Log into GHCR so we can pull the user-service image this gate
            # runs alembic from. The trap logs out at end-of-run so no
            # credentials persist on the VPS (matches deploy-isnad-graph.yml).
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            IMAGE="ghcr.io/noorinalabs/noorinalabs-user-service:${IMAGE_TAG}"
            echo "==> Pulling ${IMAGE}..."
            docker pull "${IMAGE}"

            # DATABASE_URL — asyncpg driver. user-service's alembic/env.py
            # uses create_async_engine + asyncio.run, so the async driver is
            # what alembic actually consumes. The image only ships asyncpg
            # in pyproject.toml (no psycopg), and the runtime
            # docker-compose.prod.yml DATABASE_URL also uses +asyncpg —
            # so this aligns the gate's URL with the rest of the stack.
            # Earlier "psycopg, sync" comment was wrong about env.py; closes
            # #235 (was the cause of `ModuleNotFoundError: psycopg` on
            # 2026-05-02). user-postgres resolves on the user-backend docker
            # network which this one-shot container joins explicitly.
            DATABASE_URL="postgresql+asyncpg://${USER_POSTGRES_USER}:${USER_POSTGRES_PASSWORD}@user-postgres:5432/${USER_POSTGRES_DB}"

            # -------- Belt-and-suspenders head-count assertion (Anya, 2026-04-23) --------
            echo "==> [${ENV_NAME}] alembic heads — heads-count assertion"
            HEADS_OUT="$(
              docker run --rm \
                --network noorinalabs_user-backend \
                -e DATABASE_URL="${DATABASE_URL}" \
                "${IMAGE}" \
                /app/.venv/bin/alembic heads 2>&1
            )"

            # Log raw output on stdout for CI visibility.
            echo "$HEADS_OUT"

            # Count non-empty lines. alembic prints one revision per line in
            # the form "<revid> (head)". Any count != 1 is a REAL DAG divergence
            # (not pin drift) and a hard stop.
            HEADS_COUNT="$(printf '%s\n' "$HEADS_OUT" | grep -cE '\(head\)')"
            if [ "$HEADS_COUNT" -ne 1 ]; then
              echo "ERROR: [${ENV_NAME}] alembic heads reported ${HEADS_COUNT} heads, expected exactly 1."
              echo "       This is a REAL migration-DAG divergence, not pin drift: a migration"
              echo "       landed without a proper down_revision, or the merge migration was"
              echo "       reverted. \`alembic upgrade head\` would fail or silently pick a branch."
              echo "       Fix upstream in user-service before retrying — runbook §1."
              exit 1
            fi

            # DERIVE the single head from the image itself (deploy#412). The image
            # we are about to deploy is the source of truth; we no longer compare
            # against a hardcoded revision, so a normal new migration cannot wedge
            # the deploy. Line shape: "<revid> (head)" — take the first field.
            DERIVED_HEAD="$(printf '%s\n' "$HEADS_OUT" | grep -E '\(head\)' | head -n1 | awk '{print $1}')"
            echo "==> [${ENV_NAME}] derived single head from image: ${DERIVED_HEAD}"

            # OPTIONAL opt-in tripwire. Only fires if a maintainer set a non-empty
            # EXPECTED_MERGE_HEAD. The message names BOTH possible causes so the
            # operator can tell stale-pin drift from a real unexpected-image bug.
            if [ -n "${EXPECTED_MERGE_HEAD}" ] && [ "${DERIVED_HEAD}" != "${EXPECTED_MERGE_HEAD}" ]; then
              echo "ERROR: [${ENV_NAME}] optional EXPECTED_MERGE_HEAD pin is '${EXPECTED_MERGE_HEAD}',"
              echo "       but the image's single head is '${DERIVED_HEAD}'. Exactly one is true:"
              echo "         (a) STALE-PIN DRIFT — a legitimate new migration shipped and the optional"
              echo "             pin was not updated. Fix: clear or bump EXPECTED_MERGE_HEAD in"
              echo "             .github/workflows/db-migrate.yml (default \"\" = derive, no pin)."
              echo "         (b) REAL MISMATCH — an unexpected/older image is being deployed."
              echo "             Investigate image-tag resolution before proceeding."
              echo "       Runbook §2."
              exit 1
            fi

            echo "==> [${ENV_NAME}] single-head assertion passed (head=${DERIVED_HEAD}${EXPECTED_MERGE_HEAD:+, matches pin})"

            # -------- alembic upgrade head (singular) --------
            echo "==> [${ENV_NAME}] alembic upgrade head"
            docker run --rm \
              --network noorinalabs_user-backend \
              -e DATABASE_URL="${DATABASE_URL}" \
              "${IMAGE}" \
              /app/.venv/bin/alembic upgrade head

            echo "==> [${ENV_NAME}] alembic upgrade head succeeded"

            # -------- post-migrate: reassert admin grant (deploy#426) --------
            # Idempotently grant the `admin` role to the bootstrap account using
            # user-service's unattended-safe bootstrap script (us#159 / PR #160).
            # Runs against the just-migrated DB, reusing the SAME one-shot image,
            # DATABASE_URL, and docker network the alembic step above used.
            #
            # Best-effort by design — it NEVER fails the migration gate:
            #   * No-op exit 0 when the bootstrap account does not exist yet. The
            #     account is OAuth-only, so on a brand-new env this correctly
            #     no-ops until the owner logs in once via Google OAuth; the grant
            #     then lands on the NEXT deploy. `set -e` tolerates this (exit 0).
            #   * Idempotent across deploys — a second run reports `already_admin`
            #     and exits 0 (no duplicate grant).
            #   * A BootstrapError (exit 1, e.g. the `admin` role is missing)
            #     is essentially impossible here because `alembic upgrade head`
            #     just succeeded above and migration 0001 seeds that role. If it
            #     somehow fires we LOG it loudly but do NOT abort: the `migrated`
            #     output the promotion workflow gates on must reflect the alembic
            #     result only, never the admin reassertion. Hence `set +e` around
            #     the run and an explicit rc check (not a bare `set -e` abort).
            #
            # Config sourcing (not hardcoded in the pipeline):
            #   * DATABASE_URL — the asyncpg URL assembled above from the VPS
            #     .env USER_POSTGRES_* values. Passed as an ENV var (NOT on argv)
            #     so the password-bearing URL never lands in /proc/<pid>/cmdline
            #     or the one-shot container's PID-1 argv (CWE-214 — Nino, security
            #     review). The script's _resolve_database_url() falls back to the
            #     app settings' effective_database_url, which reads DATABASE_URL
            #     from env; every other Settings field has a default, so the
            #     one-shot container needs no further config. Mirrors the adjacent
            #     alembic invocations, which also pass DATABASE_URL via -e.
            #   * BOOTSTRAP_ADMIN_EMAIL — read from the VPS .env (exported by the
            #     `set -a; . ./.env` sourcing above). Absent → the script's own
            #     default (the owner's bootstrap email). Like USER_POSTGRES_*,
            #     it is intentionally sourced from the VPS env-file, not pushed
            #     through the GH Actions transport.
            echo "==> [${ENV_NAME}] post-migrate: reassert admin grant (bootstrap_admin.py)"
            set +e
            docker run --rm \
              --network noorinalabs_user-backend \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e BOOTSTRAP_ADMIN_EMAIL="${BOOTSTRAP_ADMIN_EMAIL:-}" \
              "${IMAGE}" \
              /app/.venv/bin/python scripts/bootstrap_admin.py
            BOOTSTRAP_RC=$?
            set -e
            if [ "${BOOTSTRAP_RC}" -eq 0 ]; then
              echo "==> [${ENV_NAME}] admin bootstrap completed (rc=0: granted / already_admin / no-op user-not-found)"
            else
              echo "WARNING: [${ENV_NAME}] admin bootstrap exited ${BOOTSTRAP_RC}." >&2
              echo "         This does NOT fail the migration gate (alembic upgrade head already succeeded)." >&2
              echo "         rc=1 means BootstrapError — most likely the 'admin' role is missing despite a" >&2
              echo "         successful migrate. Investigate per docs/runbooks/user-service-alembic.md#admin-bootstrap." >&2
            fi

      - name: Record migration result
        id: record
        # Runner-side step — `$GITHUB_OUTPUT` is only writeable from runner
        # context, never from inside `appleboy/ssh-action` (its `envs:` allow-
        # list does not include GHA-internal vars). Reads `steps.run.outcome`
        # to derive the boolean, then exits non-zero on failure to preserve
        # job-level failure for the caller's `needs.migrate.result` gating.
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            echo "migrated=true"  >> "$GITHUB_OUTPUT"
            echo "Migration succeeded — recorded migrated=true"
          else
            echo "migrated=false" >> "$GITHUB_OUTPUT"
            echo "Migration failed (ssh-action outcome=${{ steps.run.outcome }}) — recorded migrated=false"
            exit 1
          fi

      # Textfile-collector emission (deploy#161). Writes a .prom file on the
      # VPS host that node-exporter scrapes via its textfile collector. Both
      # success AND failure paths emit (`if: always()`); the heads-count
      # assertion failure and the `alembic upgrade head` failure both result
      # in `steps.record.outputs.migrated == 'false'`, which we map to
      # `_success=0`. Prometheus alert `UserServiceAlembicGateFailure` reads
      # the `_success` gauge with a `_timestamp` freshness filter so a
      # promotion-less hour doesn't fire.
      #
      # Atomic write discipline: writes go to a `.prom.$$` temp path in the
      # same directory and `mv` (atomic on the same filesystem) into place.
      # node-exporter's textfile collector reads files lazily; without atomic
      # rename it could read a half-written file and parse-fail.
      #
      # Schema (mode 0644, env label matches `inputs.env`):
      #   user_service_alembic_gate_last_run_success{env="..."} <0|1>
      #   user_service_alembic_gate_last_run_timestamp_seconds{env="..."} <unix-ts>
      - name: Emit textfile-collector metrics on VPS
        if: always()
        uses: appleboy/ssh-action@v1
        env:
          ENV_NAME: ${{ inputs.env }}
          MIGRATED: ${{ steps.record.outputs.migrated }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: ENV_NAME,MIGRATED
          script: |
            set -euo pipefail
            TEXTFILE_DIR="/var/lib/node_exporter/textfile_collector"
            FINAL="${TEXTFILE_DIR}/user_service_alembic_gate.prom"
            TMP="${FINAL}.$$"

            # Bootstrap-permissions check (Bereket #210 manager-direct
            # review, 2026-04-30). The host dir is provisioned by
            # cloud-init for fresh VPSes (terraform/hetzner/modules/
            # hetzner-vps/cloud-init.yaml.tpl) — but if cloud-init didn't
            # fire (DR-restore that bypassed TF, blue-green VPS swap with
            # an older snapshot), Docker's default-create-on-bind behavior
            # creates the dir as root:root 0755. A simple `if [ ! -d ... ]`
            # would see the dir as "present" and fall through to a
            # permission-denied `mv` later — silent metric loss.
            #
            # Check write access explicitly. Fail loud rather than silent
            # fall-through so on-call notices via the failed SSH step
            # rather than silently-stale `_success=1` from yesterday.
            if ! [ -w "${TEXTFILE_DIR}" ]; then
              echo "ERROR: ${TEXTFILE_DIR} is not writable by deploy user." >&2
              echo "       This usually means cloud-init did not fire (fresh VPS" >&2
              echo "       provisioning issue, or DR-restored VPS that bypassed TF)." >&2
              echo "       Investigate via 'cloud-init status --long' on the VPS;" >&2
              echo "       fix per docs/runbooks/user-service-alembic.md#observability" >&2
              echo "       (recovery section)." >&2
              exit 1
            fi

            # Map the runner-side `migrated` boolean to a 0|1 gauge value.
            # Anything other than the literal string "true" → 0 (failure),
            # which covers both the heads-count assertion failure path and
            # the `alembic upgrade head` failure path (record step sets
            # migrated=false in both cases). An empty MIGRATED (e.g., the
            # record step itself crashed) also maps to 0 — fail-loud default.
            if [ "${MIGRATED}" = "true" ]; then
              SUCCESS=1
            else
              SUCCESS=0
            fi
            NOW="$(date -u +%s)"

            {
              echo "# HELP user_service_alembic_gate_last_run_success 1 if the most recent alembic pre-deploy gate run succeeded for the labeled env, else 0."
              echo "# TYPE user_service_alembic_gate_last_run_success gauge"
              echo "user_service_alembic_gate_last_run_success{env=\"${ENV_NAME}\"} ${SUCCESS}"
              echo "# HELP user_service_alembic_gate_last_run_timestamp_seconds Unix timestamp of the most recent alembic pre-deploy gate run for the labeled env."
              echo "# TYPE user_service_alembic_gate_last_run_timestamp_seconds gauge"
              echo "user_service_alembic_gate_last_run_timestamp_seconds{env=\"${ENV_NAME}\"} ${NOW}"
            } > "${TMP}"
            chmod 0644 "${TMP}"
            # Atomic rename — safe against node-exporter read race. Same fs
            # by construction (both paths under TEXTFILE_DIR).
            mv -f "${TMP}" "${FINAL}"
            echo "Wrote ${FINAL}: success=${SUCCESS} timestamp=${NOW} env=${ENV_NAME}"
            cat "${FINAL}"

      - name: Report migration result
        if: always()
        run: |
          {
            echo "## DB Migrate (${{ inputs.env }}): ${{ job.status }}"
            echo ""
            echo "- **Env:** ${{ inputs.env }}"
            echo "- **Image tag:** ${{ steps.tag.outputs.tag }}"
            echo "- **Head mode:** ${{ env.EXPECTED_MERGE_HEAD == '' && 'derived-from-image' || format('pinned={0}', env.EXPECTED_MERGE_HEAD) }}"
            echo "- **Migrated output:** ${{ steps.record.outputs.migrated }}"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "Runbook: [docs/runbooks/user-service-alembic.md](../blob/${{ github.sha }}/docs/runbooks/user-service-alembic.md)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
