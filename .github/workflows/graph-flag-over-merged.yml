name: Graph flag over-merged narrators (live-graph annotate)

# Repeatable, observable, env-gated Neo4j annotate op: set `over_merged=true` +
# `over_merge_note` on the canonical Narrator nodes the producer resolved from the
# curated over-merge seed (da#447/da#448) — the immediate "flag-NOW" leg of the
# honest-leaderboard work (deploy#603 / main#928 / main#958 / da#443).
#
# WHY THIS EXISTS ALONGSIDE THE RELOAD.
# da#447 made `over_merged` (+ `over_merge_note`) durable Narrator properties, and
# deploy-data-load.yml carries them into Neo4j on every reload (the durable
# TRANSPORT leg of deploy#603). But a full reload is ~7.5h. `over_merged=true`
# means a canonical node FUSES multiple distinct narrators, so its betweenness is
# inflated and it must not be read as one transmitter — and we want that flag (and
# its explanatory note, which the ig#1183 choke-point UI surfaces) visible on stg
# NOW. This workflow writes exactly that annotation to the live graph. A later
# reload from a parquet carrying the same properties re-asserts it, byte-identical
# (idempotent, self-reconciling).
#
# NEO4J-ONLY (no loader image). Pure Cypher via cypher-shell in the live neo4j
# container — the same credential pattern graph-ops.yml / graph-prune-narrators.yml
# use (password from the container's own NEO4J_AUTH, never on argv, never over the
# GH transport — CWE-214). Shape mirrors graph-ops.yml's prune-orphans path (SSH as
# `deploy`, refresh the /opt checkout, cypher-shell pre-check -> SET -> post-verify).
#
# INJECTION-SAFE + PARAMETERIZED. The statements are parameterized on `$rows` (a
# `[{id, note}]` list). The `:param` value literals are BUILT by
# scripts/flag_over_merged_narrators.py: ids are whitelisted to `nar:<uuid>` and
# interpolated directly; notes are ESCAPED into single-quoted Cypher literals
# (a `'` becomes `\'`) so they land BYTE-IDENTICAL to the durable reload while a
# quote can never break out of a graph-write statement. That builder is
# ruff/mypy-linted and behaviourally unit-tested (scripts/tests/…); an ssh
# `with: script:` body is neither (deploy#555). cypher-shell 5.x removed `:auto`;
# a non-interactive cypher-shell auto-commits each stdin statement, the implicit tx
# a plain UNWIND/SET needs — so no client-command prefix (deploy#540).
#
# THE FLAG SET is scripts/over_merged_narrator_flags.json — the producer's
# AUTHORITATIVE resolved {id, note} rows (da#448), NOT re-derived from names here
# (canonical ids drift across resolve runs, da#371/#376). The op REFUSES on a real
# run unless EVERY configured id resolves to a live node, and it NAMES any id that
# matched 0 (silent-zero discipline) — a mismatch means the seed is stale against
# the loaded resolve run, reconcile it, do not flag a subset.
#
# stg-gated + PROD HELD. This wave the op runs on stg ONLY. Prod flagging is held
# behind an explicit owner go-ahead AND a verified-green backup (main#928); the
# script hard-refuses env=prod until that hold is lifted. dry_run defaults to TRUE
# — a fat-fingered dispatch reports what it WOULD flag and writes nothing.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target env — stg (prod is HELD this wave; see workflow header)"
        required: true
        type: choice
        options: [stg, prod]
      dry_run:
        description: "Plan/read only — report the would-flag count; write NOTHING"
        required: false
        type: boolean
        default: true

concurrency:
  # Serialize against itself per env. This op writes Narrator properties on the
  # live graph; queue rather than cancel so a mid-write dispatch is never severed.
  # It does NOT exclude the other graph writers (data-load / graph-ops / prune use
  # disjoint groups); the shared graph-write-<env> group is deploy#576. Until then,
  # do not dispatch this while a load/migrate/prune is in flight on the same env.
  group: graph-flag-over-merged-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  flag-over-merged:
    name: flag-over-merged (${{ inputs.env }})
    runs-on: ubuntu-latest
    # A SET over a handful of ids finishes in seconds; the ceiling is well above the
    # SSH command_timeout so the runner never caps the step short, and far under the
    # 6h hard cap. Dry-run is seconds.
    timeout-minutes: 20
    # Maps to GH Environment protection (stg -> staging, prod -> production). prod
    # additionally requires manual approval — but the script ALSO hard-refuses prod
    # this wave (the hold), so prod is double-gated. Same env mapping as graph-ops.yml.
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    permissions:
      # No GHCR pull (Neo4j-only op) — read is all this needs.
      contents: read
    steps:
      - name: Flag over-merged narrators on ${{ inputs.env }} VPS
        id: flag
        uses: appleboy/ssh-action@v1
        env:
          ENV_NAME: ${{ inputs.env }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          # A cypher SET over a handful of nodes is instant; 10m covers the git
          # refresh + compose exec overhead while staying under timeout-minutes so
          # the SSH timeout — not a hard runner kill — is the binding limit.
          command_timeout: 10m
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          capture_stdout: true
          envs: ENV_NAME,DRY_RUN
          script: |
            set -uo pipefail

            # PROD HOLD (deploy#603 / main#928): prod flagging is not authorized this
            # wave — held behind an explicit owner go-ahead AND a verified-green backup.
            # Refuse BEFORE touching anything. Remove this guard only when prod is
            # authorized (the env choice + production-environment approval remain the
            # gate at that point).
            if [ "${ENV_NAME}" = "prod" ]; then
              echo "ERROR: [prod] over-merged flagging is HELD this wave — owner go-ahead + verified backup required (main#928). Refusing." >&2
              exit 1
            fi

            cd /opt/noorinalabs-deploy

            # Refresh the on-box checkout to origin/main BEFORE reading the data file or
            # the builder script, exactly as graph-ops.yml / deploy-data-load.yml do, so
            # both are the current committed versions. Guarded (this script runs
            # `set -uo pipefail`, no -e): an unguarded fetch failure would let the
            # following reset succeed against a STALE remote-tracking ref.
            echo "==> Pulling latest deploy config..."
            git fetch origin main \
              || { echo "ERROR: [${ENV_NAME}] git fetch origin main failed — refusing to run against a stale checkout." >&2; exit 1; }
            git reset --hard origin/main \
              || { echo "ERROR: [${ENV_NAME}] git reset --hard origin/main failed." >&2; exit 1; }

            # The builder is python (robust JSON parse + Cypher escaping of verbatim
            # notes). Fail loud if python3 is absent rather than silently skip.
            command -v python3 >/dev/null 2>&1 \
              || { echo "ERROR: [${ENV_NAME}] python3 not found on the VPS — required to build the flag Cypher." >&2; exit 1; }

            # .env on the VPS (mode 600, written by the deploy workflow) is the single
            # source of truth for NEO4J credentials — compose interpolates the service
            # env from it, so creds never reach this script's argv (CWE-214).
            if [ ! -f .env ]; then
              echo "ERROR: /opt/noorinalabs-deploy/.env is missing on ${ENV_NAME} VPS." >&2
              exit 1
            fi

            COMPOSE="docker compose -p noorinalabs -f compose/docker-compose.prod.yml --env-file .env"

            # run_phase <precheck|flag|postcount>: build the cypher-shell stdin stream
            # for the phase (the :param rows line + the statement) with the tested
            # builder, then feed it to cypher-shell INSIDE the live neo4j container.
            run_phase() {
              _phase="$1"
              _built=""
              _built="$(python3 scripts/flag_over_merged_narrators.py stdin "${_phase}")" \
                || { echo "ERROR: [${ENV_NAME}] builder refused for phase '${_phase}' — check scripts/over_merged_narrator_flags.json." >&2; return 1; }
              # SC2016: the ${NEO4J_AUTH#neo4j/} expands INSIDE the neo4j container's
              # sh -c (reading that container's own NEO4J_AUTH), not on the VPS host.
              # shellcheck disable=SC2016
              printf '%s\n' "${_built}" | ${COMPOSE} exec -T neo4j sh -c \
                'NEO4J_USERNAME=neo4j NEO4J_PASSWORD="${NEO4J_AUTH#neo4j/}" exec cypher-shell --format plain'
            }

            # extract_int <cypher-plain-output>: the sole all-digits line (a count).
            # cypher-shell --format plain renders an integer column value UNQUOTED, so
            # the result row is a bare number; the header and any :param echo are not.
            # `|| true` keeps a no-match from tripping pipefail — the caller HARD-FAILS
            # on an empty result, so a missing reading is a stop, never a silent zero.
            extract_int() {
              printf '%s\n' "$1" | grep -E '^[0-9]+$' | tail -n1 || true
            }

            # --- expected count: how many rows are configured (builder refuses 0) ---
            EXPECTED=""
            EXPECTED="$(python3 scripts/flag_over_merged_narrators.py count)" \
              || { echo "ERROR: [${ENV_NAME}] could not read the configured row count from scripts/over_merged_narrator_flags.json." >&2; exit 1; }
            if [ "${EXPECTED:-0}" -le 0 ]; then
              echo "ERROR: [${ENV_NAME}] no rows configured in scripts/over_merged_narrator_flags.json (fail-safe)." >&2
              exit 1
            fi
            echo "==> [${ENV_NAME}] flag-over-merged — configured rows: ${EXPECTED} | dry_run=${DRY_RUN}"

            # --- pre-check: which configured ids resolve in the live graph. One row
            #     per id ("<id> matched=<n>"), so a miss is NAMED, never summed away. ---
            echo "==> [${ENV_NAME}] pre-check: resolve each configured id against the graph"
            PRE_OUT=""
            PRE_OUT="$(run_phase precheck)" \
              || { echo "ERROR: [${ENV_NAME}] pre-check query failed to execute." >&2; exit 1; }

            # Parse via a temp file (not a pipe — a pipe runs the while-loop in a
            # subshell and loses MATCHED/MISSING; not a heredoc — its closing delimiter
            # cannot sit at column 0 under this YAML block scalar's indentation).
            PRE_TMP="$(mktemp)" \
              || { echo "ERROR: [${ENV_NAME}] could not create a temp file for the pre-check parse." >&2; exit 1; }
            printf '%s\n' "${PRE_OUT}" > "${PRE_TMP}"
            MATCHED=0
            MISSING=""
            while IFS= read -r _line; do
              case "${_line}" in
                '' | idmatch) continue ;;
              esac
              # cypher-shell quotes the string column — strip one leading/trailing quote.
              _line="${_line#\"}"
              _line="${_line%\"}"
              _cnt="${_line##* matched=}"
              _id="${_line% matched=*}"
              if [ "${_cnt}" = "0" ]; then
                MISSING="${MISSING} ${_id}"
              else
                MATCHED=$((MATCHED + 1))
              fi
            done < "${PRE_TMP}"
            rm -f "${PRE_TMP}"

            echo "    configured: ${EXPECTED} | resolved in graph: ${MATCHED}"
            if [ -n "${MISSING}" ]; then
              echo "    ids that matched 0 nodes:${MISSING}"
            fi

            # --- FAIL-SAFE DRY RUN. Tested as != "false" (anything not explicitly
            #     "false" is a plan). ---
            if [ "${DRY_RUN}" != "false" ]; then
              if [ "${DRY_RUN}" != "true" ]; then
                echo "WARNING: [${ENV_NAME}] dry_run='${DRY_RUN}' is not 'true'/'false' — treating as a DRY RUN, writing nothing." >&2
              fi
              echo "==> [${ENV_NAME}] DRY RUN — would SET over_merged=true + over_merge_note on ${MATCHED} node(s); NO write issued."
              if [ "${MATCHED}" -ne "${EXPECTED}" ]; then
                echo "    NOTE: only ${MATCHED} of ${EXPECTED} configured ids resolve — a REAL run would REFUSE (seed stale vs the loaded graph; reconcile scripts/over_merged_narrator_flags.json against the producer's resolve run)."
              fi
              echo "FLAG_RESULT outcome=dry-run configured=${EXPECTED} matched=${MATCHED} flagged=0"
              echo "==> [${ENV_NAME}] dry run complete (exit 0)."
              exit 0
            fi

            # --- real run: refuse unless EVERY configured id resolves. Flagging a
            #     subset would silently annotate a graph the seed no longer describes. ---
            if [ "${MATCHED}" -ne "${EXPECTED}" ]; then
              echo "ERROR: [${ENV_NAME}] refusing to flag — only ${MATCHED} of ${EXPECTED} configured ids resolve in the live graph (missing:${MISSING}). The curated seed does not match the loaded resolve run (canonical-id drift, da#371/#376, or wrong env). Reconcile scripts/over_merged_narrator_flags.json with the producer before flagging." >&2
              exit 1
            fi

            echo "==> [${ENV_NAME}] flag: UNWIND rows -> SET over_merged=true + over_merge_note on ${EXPECTED} node(s)"
            FLAG_OUT=""
            FLAG_OUT="$(run_phase flag)" \
              || { echo "ERROR: [${ENV_NAME}] flag SET failed to execute." >&2; exit 1; }
            FLAGGED="$(extract_int "${FLAG_OUT}")"
            if [ -z "${FLAGGED}" ]; then
              echo "ERROR: [${ENV_NAME}] could not parse the flagged count from the SET output:" >&2
              printf '%s\n' "${FLAG_OUT}" >&2
              exit 1
            fi
            # Read-back assertion (silent-zero discipline): rc=0 is NOT proof the SET
            # touched the expected nodes — the SET's own count(n) must equal EXPECTED.
            if [ "${FLAGGED}" -ne "${EXPECTED}" ]; then
              echo "ERROR: [${ENV_NAME}] SET reported ${FLAGGED} nodes flagged but ${EXPECTED} were expected." >&2
              exit 1
            fi

            # --- post-verify: EXACTLY the configured ids now carry over_merged=true ---
            echo "==> [${ENV_NAME}] verify: configured ids now carry over_merged=true"
            POST_OUT=""
            POST_OUT="$(run_phase postcount)" \
              || { echo "ERROR: [${ENV_NAME}] post-count query failed to execute." >&2; exit 1; }
            POST="$(extract_int "${POST_OUT}")"
            if [ -z "${POST}" ]; then
              echo "ERROR: [${ENV_NAME}] could not parse the post-count from cypher output:" >&2
              printf '%s\n' "${POST_OUT}" >&2
              exit 1
            fi
            if [ "${POST}" -ne "${EXPECTED}" ]; then
              echo "ERROR: [${ENV_NAME}] verification FAILED — ${POST} of ${EXPECTED} configured ids carry over_merged=true after the SET." >&2
              exit 1
            fi
            echo "    ${POST} of ${EXPECTED} configured ids carry over_merged=true."
            echo "FLAG_RESULT outcome=flagged configured=${EXPECTED} matched=${MATCHED} flagged=${FLAGGED}"
            echo "==> [${ENV_NAME}] flag-over-merged complete — post-op verification PASSED."

      - name: Report
        if: always()
        env:
          ENV_NAME: ${{ inputs.env }}
          DRY_RUN: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
          FLAG_STDOUT: ${{ steps.flag.outputs.stdout }}
        run: |
          set -euo pipefail

          # Whole-token extraction from the captured remote stdout (da#419 discipline).
          result_field() {
            printf '%s\n' "${FLAG_STDOUT}" \
              | grep -o 'FLAG_RESULT .*' \
              | head -n1 \
              | tr ' ' '\n' \
              | sed -n "s/^$1=\\([0-9A-Za-z-][0-9A-Za-z-]*\\)$/\\1/p" \
              | head -n1
          }

          R_OUTCOME="$(result_field outcome || true)"
          R_CONFIGURED="$(result_field configured || true)"
          R_MATCHED="$(result_field matched || true)"
          R_FLAGGED="$(result_field flagged || true)"

          {
            echo "## Flag over-merged narrators (${ENV_NAME}): ${JOB_STATUS}"
            echo ""
            echo "- **Env:** ${ENV_NAME}"
            echo "- **Dry run:** ${DRY_RUN}"
            echo ""
            if [ -n "${R_OUTCOME}" ]; then
              echo "| | |"
              echo "|---|---|"
              echo "| Outcome | \`${R_OUTCOME}\` |"
              echo "| Configured rows (keep-set) | ${R_CONFIGURED} |"
              echo "| Resolved in graph | ${R_MATCHED} |"
              if [ "${R_OUTCOME}" = "dry-run" ]; then
                echo "| Would flag | ${R_MATCHED} |"
              else
                echo "| **Flagged** (over_merged=true) | **${R_FLAGGED}** |"
              fi
              echo ""
            else
              echo "**Not reported.** The op did not reach a terminal success path — read the step log"
              echo "to establish the graph's state before re-running."
              echo ""
            fi
            echo "Sets \`over_merged=true\` + verbatim \`over_merge_note\` on the producer's resolved canonical"
            echo "ids (da#448). Durable transport is deploy-data-load.yml; a later reload re-asserts the flag."
            echo "stg-gated: prod flagging is HELD this wave behind owner go-ahead + verified backup (main#928)."
          } >> "$GITHUB_STEP_SUMMARY"
