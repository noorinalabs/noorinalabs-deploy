# Deploy to production (noorinalabs-prod VPS).
#
# Triggers:
#   - workflow_dispatch fired by promote.yml's trigger-prod-deploy job after
#     the retag + approval gate have completed. The manual-approval gate
#     lives on the retag step in promote.yml (environment: production);
#     once retag is approved and succeeds, this workflow rolls out to the
#     prod VPS without a second approval.
#   - workflow_dispatch (manual) — operator-initiated rollout, e.g. to
#     redeploy the current prod-latest after a VPS restart.
#
# Env scope:
#   - `environment: production` so the VPS_HOST var resolves to the prod
#     host (`noorinalabs-prod`) and all secrets used here are the
#     production-scoped set. Stg secrets cannot cross into this workflow.
#
# Image tags consumed (per-service, all must be prod-* shape):
#   - api_frontend_tag: applies to both api + frontend (they share a short
#                       SHA from isnad-graph's ghcr-publish.yml matrix)
#   - user_service_tag: applies to user-service image
#   - landing_tag:      applies to landing image
#   Each input falls back to `prod-latest` if left empty.
#
# Per-service pinning eliminates a TOCTOU window: if promote.yml writes
# prod-<short> for SHA X and auto-dispatches here, and then a second
# promotion for SHA Y starts before this rollout consumes the images,
# `prod-latest` would move to Y and we'd deploy Y instead of X. Pinning
# to prod-<short> closes that window (Lucas review 2026-04-23, #155).
#
# This workflow does NOT retag. Retagging is promote.yml's job, and it is
# the only workflow that writes `prod-*` tags (Contract v6).

name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      api_frontend_tag:
        description: "Prod tag for api + frontend (prod-* shape; empty = prod-latest)."
        required: false
        default: ""
      user_service_tag:
        description: "Prod tag for user-service (prod-* shape; empty = prod-latest)."
        required: false
        default: ""
      landing_tag:
        description: "Prod tag for landing (prod-* shape; empty = prod-latest)."
        required: false
        default: ""
      allow_stg_tags:
        description: >-
          BREAK-GLASS: accept stg-* shape tags directly (skip the prod-*
          shape check). Only use when the promote.yml retag path is
          broken and prod must be restored. Mirrors skip_stg_verify /
          skip_alembic_gate discipline. Surfaced 2026-05-02 emergency
          restore — GHCR cross-repo write blocked at token-scope level.
          REQUIRES a non-empty `break_glass_reason` input — see deploy#251.
        required: false
        default: false
        type: boolean
      break_glass_reason:
        description: >-
          REQUIRED when allow_stg_tags=true. Free-text operator-supplied
          reason. Logged in job summary, appended to the pinned audit-log
          issue (label `break-glass-audit-log`), and surfaced via the
          BreakGlassUsed Alertmanager rule. Empty value with
          allow_stg_tags=true fails the run at validate-break-glass-reason.
          See deploy#251 + docs/runbooks/break-glass.md.
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Break-glass reason validation (deploy#251). When allow_stg_tags=true
  # the operator MUST supply a non-empty break_glass_reason. Runs first
  # to fail-fast before any deploy machinery starts.
  # ─────────────────────────────────────────────────────────────────
  validate-break-glass-reason:
    name: Validate break-glass reason
    runs-on: ubuntu-latest
    steps:
      - name: Reason is required when allow_stg_tags=true
        env:
          ALLOW_STG_TAGS: ${{ inputs.allow_stg_tags }}
          REASON: ${{ inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          if [ "${ALLOW_STG_TAGS}" = "true" ]; then
            stripped="${REASON//[$' \t\r\n']/}"
            if [ -z "${stripped}" ]; then
              echo "::error::allow_stg_tags=true but \`break_glass_reason\` is empty."
              echo "::error::Set \`break_glass_reason\` to a free-text reason describing WHY stg-* tags are being accepted in prod."
              echo "::error::Example: 'DR restore — promote.yml retag path blocked by GHCR cross-repo write 403'."
              echo "::error::See docs/runbooks/break-glass.md (deploy#251)."
              exit 1
            fi
            echo "Break-glass: allow_stg_tags=true, reason supplied (length=${#REASON})."
          else
            echo "allow_stg_tags=false — reason validation N/A."
          fi

  # ─────────────────────────────────────────────────────────────────
  # Break-glass audit (deploy#251). Fires only when allow_stg_tags=true.
  # Records the bypass in the pinned audit-log issue, emits the textfile-
  # collector metric for Prometheus, and writes the job-summary block.
  # Runs in parallel with `deploy` — does NOT gate the deploy itself,
  # since a failed audit must not block an emergency restore. The audit
  # exists to record the fact, not to gate the action.
  # ─────────────────────────────────────────────────────────────────
  audit-allow-stg-tags:
    name: Audit — allow_stg_tags break-glass
    needs: validate-break-glass-reason
    if: ${{ inputs.allow_stg_tags }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (for local composite action)
        uses: actions/checkout@v6
      - name: Break-glass audit (allow_stg_tags)
        uses: ./.github/actions/break-glass-audit
        with:
          input_name: allow_stg_tags
          reason: ${{ inputs.break_glass_reason }}
          bypassed: "deploy-prod prod-* tag-shape check (accepting stg-* digests directly)"
          vps_host: ${{ vars.VPS_HOST }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: validate-break-glass-reason
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve + validate per-service tags
        id: tags
        env:
          API_FRONTEND_TAG: ${{ inputs.api_frontend_tag }}
          USER_SERVICE_TAG: ${{ inputs.user_service_tag }}
          LANDING_TAG: ${{ inputs.landing_tag }}
        run: |
          set -euo pipefail
          # Each input falls back to prod-latest when empty.
          af="${API_FRONTEND_TAG:-prod-latest}"
          us="${USER_SERVICE_TAG:-prod-latest}"
          ld="${LANDING_TAG:-prod-latest}"

          # Validate tag shape on each resolved tag. Default: prod-* only.
          # `allow_stg_tags=true` (break-glass) also accepts stg-* shape.
          allow_stg="${{ inputs.allow_stg_tags }}"
          for pair in "api+frontend:$af" "user-service:$us" "landing:$ld"; do
            svc="${pair%%:*}"
            tag="${pair#*:}"
            case "$tag" in
              prod-*) ;;
              stg-*)
                if [ "$allow_stg" = "true" ]; then
                  echo "::warning::deploy-prod accepting stg-* tag via allow_stg_tags break-glass: $svc=$tag"
                else
                  echo "::error::deploy-prod refuses non-prod-* tags for $svc. Got: $tag"
                  echo "::error::Use promote.yml to produce a prod-<short> tag from a stg digest first, or pass allow_stg_tags=true for emergency restore."
                  exit 1
                fi
                ;;
              *)
                echo "::error::deploy-prod refuses non-prod-* / non-stg-* tags for $svc. Got: $tag"
                exit 1
                ;;
            esac
          done

          echo "Resolved tags:"
          echo "  api+frontend: $af"
          echo "  user-service: $us"
          echo "  landing:      $ld"

          {
            echo "api_frontend_tag=$af"
            echo "user_service_tag=$us"
            echo "landing_tag=$ld"
          } >> "$GITHUB_OUTPUT"

      # .env-write + compose roll via the shared composite action
      # (deploy#190 + #66). Prod passes USER_SERVICE_IMAGE_TAG +
      # LANDING_IMAGE_TAG via extra_image_tags — stg doesn't carry these.
      # Both stg and prod call the same composite, so adding a new
      # required secret needs one line in `env:` here + one entry in
      # `env_keys` — no remote-script edit. The composite replaces the
      # legacy `eval` env loop with indirect expansion (`${!var}`), safe
      # for secrets containing quotes, backticks, dollars, or backslashes.
      - name: Deploy to prod VPS
        uses: ./.github/actions/write-deploy-env
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AUTH_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_GOOGLE_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          KAFKA_CLUSTER_ID: ${{ secrets.KAFKA_CLUSTER_ID }}
          KAFKA_UI_PASSWORD: ${{ secrets.KAFKA_UI_PASSWORD }}
          KAFKA_UI_USER: ${{ secrets.KAFKA_UI_USER }}
          PIPELINE_B2_BUCKET: ${{ secrets.PIPELINE_B2_BUCKET }}
          PIPELINE_B2_ENDPOINT: ${{ secrets.PIPELINE_B2_ENDPOINT }}
          PIPELINE_B2_KEY: ${{ secrets.PIPELINE_B2_KEY }}
          PIPELINE_B2_KEY_ID: ${{ secrets.PIPELINE_B2_KEY_ID }}
          PIPELINE_B2_REGION: ${{ secrets.PIPELINE_B2_REGION }}
          BACKUP_B2_KEY_ID: ${{ secrets.BACKUP_B2_KEY_ID }}
          BACKUP_B2_APP_KEY: ${{ secrets.BACKUP_B2_APP_KEY }}
          BACKUP_B2_BUCKET: ${{ secrets.BACKUP_B2_BUCKET }}
          USER_POSTGRES_DB: ${{ secrets.USER_POSTGRES_DB }}
          USER_POSTGRES_PASSWORD: ${{ secrets.USER_POSTGRES_PASSWORD }}
          USER_POSTGRES_USER: ${{ secrets.USER_POSTGRES_USER }}
          USER_REDIS_PASSWORD: ${{ secrets.USER_REDIS_PASSWORD }}
        with:
          ssh_host: ${{ vars.VPS_HOST }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          # IMAGE_TAG drives compose's api + frontend image tags. The two
          # extra pairs below map to compose/docker-compose.prod.yml's
          # ${USER_SERVICE_IMAGE_TAG:-latest} and ${LANDING_IMAGE_TAG:-latest}.
          image_tag: ${{ steps.tags.outputs.api_frontend_tag }}
          extra_image_tags: |
            USER_SERVICE_IMAGE_TAG=${{ steps.tags.outputs.user_service_tag }}
            LANDING_IMAGE_TAG=${{ steps.tags.outputs.landing_tag }}
          # Per-env observability config selection (deploy#263 + #262).
          # Prod variants for prometheus + alertmanager. SLACK_WEBHOOK_FILE
          # path is relative to /etc/alertmanager mount, populated below.
          extra_env: |
            PROM_CONFIG_FILE=prometheus.prod.yml
            ALERTMANAGER_CONFIG_FILE=alertmanager.prod.yml
            SLACK_WEBHOOK_FILE=slack_webhook_url.secret
            SMTP_PASSWORD_FILE=smtp_password.secret
            HEALTHCHECKS_URL_FILE=healthchecks_url.secret
          base_domain: noorinalabs.com
          # Tiered prod rollout (deploy#429). Only the app+edge tier is health-
          # gated (`up -d --wait`); the Kafka pipeline tier comes up NON-gating so
          # a crash-looping broker can never abort the rollout and leave
          # caddy/frontend in `Created` → total edge outage. gated_services lists
          # the app+edge leaf services (their deps — neo4j/postgres/redis/
          # user-postgres/user-redis/user-service-migrate — are pulled in
          # transitively by the --wait closure). deferred_services is the Kafka
          # subgraph (broker + its only dependents). See write-deploy-env +
          # scripts/compose_tiered_up.sh. stg omits both → legacy single-`up`.
          gated_services: caddy frontend landing api user-service
          deferred_services: kafka kafka-init kafka-ui kafka-exporter
          env_keys: NEO4J_PASSWORD,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,REDIS_PASSWORD,AUTH_GOOGLE_CLIENT_ID,AUTH_GOOGLE_CLIENT_SECRET,AUTH_GITHUB_CLIENT_ID,AUTH_GITHUB_CLIENT_SECRET,GRAFANA_ADMIN_PASSWORD,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,KAFKA_CLUSTER_ID,KAFKA_UI_PASSWORD,KAFKA_UI_USER,PIPELINE_B2_BUCKET,PIPELINE_B2_ENDPOINT,PIPELINE_B2_KEY,PIPELINE_B2_KEY_ID,PIPELINE_B2_REGION,BACKUP_B2_KEY_ID,BACKUP_B2_APP_KEY,BACKUP_B2_BUCKET,USER_POSTGRES_DB,USER_POSTGRES_PASSWORD,USER_POSTGRES_USER,USER_REDIS_PASSWORD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_actor: ${{ github.repository_owner }}
          # Slack webhook for alertmanager routing (deploy#262). Optional —
          # if unset, the composite writes "<unset>" placeholder and logs a
          # WARNING. Set in the `production` Environment.
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Email-backup SMTP password (deploy#452) + Healthchecks.io dead-man's
          # switch ping URL (deploy#453). Both optional — if unset, the composite
          # writes the "<unset>" placeholder and logs a WARNING. Set in the
          # `production` Environment.
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          healthchecks_url: ${{ secrets.HEALTHCHECKS_PING_URL }}

      - name: Verify health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/noorinalabs-deploy
            for i in $(seq 1 24); do
              api_health=$(docker inspect --format='{{.State.Health.Status}}' noorinalabs-api-1 2>/dev/null || echo "not_found")
              echo "Attempt $i/24: API=$api_health"
              if [ "$api_health" = "healthy" ]; then
                echo "API health check passed"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "ERROR: API health check failed after 120 seconds"
                docker compose -f compose/docker-compose.prod.yml logs --tail=50 api
                exit 1
              fi
              sleep 5
            done
            docker compose -p noorinalabs -f compose/docker-compose.prod.yml --env-file .env ps --format '{{.Name}}\t{{.Status}}'
            echo "==> Prod deployment verified"

      # Post-deploy: reassert the owner's `admin` grant (deploy#445, option 2).
      #
      # Runs AFTER the stack is up and user-service is healthy, on EVERY prod
      # deploy, so the owner's admin role survives redeploys and DB resets. This
      # complements the pre-deploy bootstrap in db-migrate.yml (deploy#426), which
      # runs against a one-shot image BEFORE compose-up via promote.yml's prod
      # gate; this step closes the gap by running against the LIVE container after
      # every prod rollout (including manual / break-glass dispatches that don't
      # traverse promote.yml's migrate gate).
      #
      # `docker exec` into the running noorinalabs-user-service-1 container so the
      # script resolves DATABASE_URL from the container's own environment (compose
      # already injects DATABASE_URL / DATABASE_* there). No password-bearing URL
      # is passed on argv — the only argv value is the email, which the script
      # docstring explicitly documents as an identifier, not a credential.
      #
      # Safety (why this can never fail the deploy):
      #   * `--require-user` is intentionally NOT passed. Without it the script is
      #     a no-op exit 0 when the bootstrap account does not exist yet — the
      #     account is OAuth-only, so on a fresh env this correctly no-ops until
      #     the owner logs in once; the grant then lands on the NEXT deploy.
      #   * Idempotent — a second run reports `already_admin` and exits 0.
      #   * Best-effort — wrapped in explicit rc handling (not `set -e`); a
      #     non-zero rc is LOGGED loudly but never aborts the deploy. The deploy's
      #     success signal must reflect the rollout + api health only.
      #
      # Email config (not hardcoded): pass --email only when the repo/env var
      # BOOTSTRAP_ADMIN_EMAIL is set; otherwise rely on the script's own default
      # (the owner's bootstrap email). Sourced via GH var, mirroring how
      # db-migrate.yml keeps the email out of the workflow body.
      - name: Reassert admin grant (bootstrap_admin.py)
        uses: appleboy/ssh-action@v1
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: BOOTSTRAP_ADMIN_EMAIL
          script: |
            set -uo pipefail
            cd /opt/noorinalabs-deploy

            CONTAINER="noorinalabs-user-service-1"

            # Wait for user-service to report healthy before exec-ing into it.
            # The container ships a compose healthcheck (GET /health); poll it so
            # the bootstrap runs against a ready app, not a still-starting one.
            echo "==> [prod] waiting for ${CONTAINER} to be healthy..."
            us_health="not_found"
            for i in $(seq 1 24); do
              us_health=$(docker inspect --format='{{.State.Health.Status}}' "${CONTAINER}" 2>/dev/null || echo "not_found")
              echo "Attempt $i/24: user-service=${us_health}"
              if [ "${us_health}" = "healthy" ]; then
                break
              fi
              sleep 5
            done
            if [ "${us_health}" != "healthy" ]; then
              echo "WARNING: [prod] ${CONTAINER} not healthy after 120s (status=${us_health})." >&2
              echo "         Skipping admin bootstrap this deploy; it will reassert on the next one." >&2
              echo "         This does NOT fail the deploy (rollout + api health already verified)." >&2
              exit 0
            fi

            # Build args: --email only when the GH var is set, else script default.
            set --
            if [ -n "${BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
              set -- --email "${BOOTSTRAP_ADMIN_EMAIL}"
            fi

            echo "==> [prod] post-deploy: reassert admin grant (bootstrap_admin.py)"
            set +e
            docker exec -e PYTHONPATH=/app -w /app "${CONTAINER}" \
              /app/.venv/bin/python scripts/bootstrap_admin.py "$@"
            BOOTSTRAP_RC=$?
            set -e
            if [ "${BOOTSTRAP_RC}" -eq 0 ]; then
              echo "==> [prod] admin bootstrap completed (rc=0: granted / already_admin / no-op user-not-found)"
            else
              echo "WARNING: [prod] admin bootstrap exited ${BOOTSTRAP_RC}." >&2
              echo "         This does NOT fail the deploy (rollout + api health already verified)." >&2
              echo "         rc=1 means BootstrapError — most likely the 'admin' role is missing." >&2
              echo "         Investigate per docs/runbooks/user-service-alembic.md#admin-bootstrap." >&2
            fi

      - name: Report status
        if: always()
        run: |
          {
            echo "## Deploy to production: ${{ job.status }}"
            echo ""
            echo "- **api + frontend tag:** ${{ steps.tags.outputs.api_frontend_tag }}"
            echo "- **user-service tag:**   ${{ steps.tags.outputs.user_service_tag }}"
            echo "- **landing tag:**        ${{ steps.tags.outputs.landing_tag }}"
            echo "- **Actor:** ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
