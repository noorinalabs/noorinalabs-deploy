name: Graph ops (Neo4j migrate / enrich / prune-orphans)

# Repeatable, observable, env-gated Neo4j graph-remediation ops (deploy#532).
#
# Three graph ops need to run against stg/prod Neo4j and MUST be IaC
# (workflow-driven, reproducible, stg-gated) — not box one-offs:
#   1. migrate — `migrate-transmitted-hadith-ids` (da#325): canonicalize the
#      ~2.68M TRANSMITTED_TO.hadith_id edge ids in place so chain
#      reconstruction joins against Hadith.id (fixes the empty-isnad-chain bug).
#   2. enrich  — `enrich` (da#326): GDS narrator centrality (sampled
#      betweenness + pagerank + louvain + degree) surfacing transmission
#      choke points.
#   3. prune-orphans — delete orphaned TRANSMITTED_TO edges whose hadith_id
#      joins no Hadith node (deploy#538): the ~196k fawaz six-books chains that
#      duplicate lk's canonical chains. Neo4j-ONLY (no loader image) — batched
#      DELETE via cypher-shell in the neo4j container, reusing the run_cypher
#      credential helper. MUST run AFTER migrate on an env: before
#      canonicalization every edge id is raw-form and would count as dangling,
#      so pruning first would wipe the graph. Guarded by a raw-id==0 pre-check
#      (refuses to prune an un-canonicalized graph — see the prune-orphans block).
#
# migrate + enrich are driven by the data-acquisition loader image
# (ghcr.io/noorinalabs/noorinalabs-data-acquisition-load) whose ENTRYPOINT is
# `python -m src.cli`, so the op is just the CLI subcommand. prune-orphans needs
# no loader image — it is pure Cypher run via cypher-shell in the neo4j
# container (the same run_cypher helper the verification gates use), so its path
# skips the GHCR login + image pull + rel-index pre-step entirely. There is no
# existing Neo4j graph-op vehicle: db-migrate.yml is user-service
# alembic/Postgres only, and reembed-corpus.yml is embed-specific. This
# workflow is the missing OPERATIONAL trigger.
#
# Shape mirrors reembed-corpus.yml (the canonical one-shot cluster-data op):
# SSH to the VPS as `deploy` (appleboy/ssh-action, secrets.DEPLOY_SSH_PRIVATE_KEY,
# vars.VPS_HOST) and run a one-shot container in the compose network via the
# profile-gated `graph-ops` compose service, with NEO4J credentials sourced from
# the VPS .env (NEVER on argv — CWE-214) and each op's exit code observed.
#
# Why `docker compose run` (not raw `docker run`): the loader container attaches
# to the live project's `backend` network from the `graph-ops` service
# definition and reuses that service's NEO4J_* env, so creds stay in the VPS
# .env and never reach this script's argv or the container's argv. The service
# is profile-gated (`graph-ops`) so an ordinary deploy's `compose up` never
# triggers it.
#
# stg-gated (deploy#532): prod runs ONLY as a promotion of a verified-good stg
# run. Sequencing at run time is migrate (stg then prod) FIRST, then
# prune-orphans (removes the migrate-exposed dangling duplicates), then enrich,
# so centrality computes on the corrected, pruned graph. prune-orphans MUST
# NEVER precede migrate on an env (raw-id==0 guard enforces this).
#
# dry_run defaults to TRUE — a fat-fingered dispatch is a no-op plan, not a
# destructive in-place edge rewrite. A real run is an explicit dry_run=false.

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target env — stg or prod"
        required: true
        type: choice
        options: [stg, prod]
      operation:
        description: "Graph op to run (prune-orphans MUST run after migrate on the env)"
        required: true
        type: choice
        options: [migrate, enrich, prune-orphans]
      image:
        description: >-
          Loader image ref. Leave empty to resolve the env-scoped default
          `ghcr.io/noorinalabs/noorinalabs-data-acquisition-load:<env>-latest`
          (the loader image published by da#329). Pass an explicit ref to pin a
          specific build.
        required: false
        type: string
        default: ""
      dry_run:
        description: "Plan/log only — issue no Cypher, rewrite no edges, compute no centrality"
        required: false
        type: boolean
        default: true

concurrency:
  # Serialize graph ops per env. All three ops are write-heavy against the live
  # graph (migrate rewrites ~2.68M edge ids; prune-orphans batch-DELETEs the
  # ~196k dangling duplicates; enrich runs GDS on the neo4j container); two must
  # never overlap on one env. Queue, don't cancel — a mid-run cancel could leave
  # a partially-migrated or partially-pruned graph.
  group: graph-ops-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  graph-ops:
    name: graph-ops ${{ inputs.operation }} (${{ inputs.env }})
    runs-on: ubuntu-latest
    # migrate rewrites ~2.68M TRANSMITTED_TO edge ids in batches; enrich runs
    # sampled GDS betweenness + pagerank + louvain + degree on the neo4j
    # container. Give the job a ceiling ABOVE the SSH `command_timeout` below so
    # the runner-side never caps the SSH step short of it (mirrors
    # reembed-corpus.yml / deploy#465). Both live UNDER the 6h (360m)
    # GitHub-hosted-runner job hard cap. Dry-run returns in seconds, unaffected.
    timeout-minutes: 130
    # Maps to GH Environment protection (stg -> staging, prod -> production).
    # prod requires manual approval; per-env secrets/host resolve from the
    # matching Environment. Same pattern as reembed-corpus.yml / db-migrate.yml.
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    permissions:
      # GHCR pull of the loader image happens on the VPS via the runtime
      # GITHUB_TOKEN; packages:read lets that token pull.
      contents: read
      packages: read
    steps:
      - name: Resolve loader image ref
        id: resolve
        env:
          ENV_NAME: ${{ inputs.env }}
          IMAGE_INPUT: ${{ inputs.image }}
        run: |
          set -euo pipefail
          img="${IMAGE_INPUT}"
          if [ -z "${img}" ]; then
            # Env-scoped default; mirrors reembed-corpus.yml's <env>-latest fallback.
            img="ghcr.io/noorinalabs/noorinalabs-data-acquisition-load:${ENV_NAME}-latest"
          fi
          # Guard: refuse to run a graph op against prod with a stg-tagged image.
          # The reverse (a prod tag on stg) is benign and allowed.
          if [ "${ENV_NAME}" = "prod" ] && printf '%s' "${img}" | grep -qE ':stg(-|-latest$|$)'; then
            echo "::error::Refusing to run a graph op on prod with a stg-tagged image ('${img}'). Pass an explicit prod image ref via the 'image' input."
            exit 1
          fi
          echo "image=${img}" >> "$GITHUB_OUTPUT"
          echo "Resolved loader image: ${img}"

      - name: Run ${{ inputs.operation }} on ${{ inputs.env }} VPS
        uses: appleboy/ssh-action@v1
        env:
          ENV_NAME: ${{ inputs.env }}
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          # GHCR pull credentials — runtime token + owner actor, same as
          # reembed-corpus.yml. NEO4J credentials are NOT pushed through the GH
          # Actions transport: compose sources them from the VPS .env.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          # appleboy/ssh-action defaults command_timeout to 10m — far short of a
          # 2.68M-edge in-place rewrite or a sampled-GDS enrich. 2h gives margin
          # while staying UNDER the 6h (360m) GitHub-hosted-runner job hard cap,
          # and below `timeout-minutes: 130` above so the SSH timeout — not a
          # hard runner kill — is the binding limit. Dry-run is seconds.
          command_timeout: 2h
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          envs: ENV_NAME,OPERATION,DRY_RUN,IMAGE,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -uo pipefail

            cd /opt/noorinalabs-deploy

            # Refresh the on-box checkout to origin/main BEFORE any compose
            # command, exactly as the sibling deploy-isnad-graph.yml does after
            # its cd. The box's /opt/noorinalabs-deploy holds a git checkout that
            # deploys refresh, but this op-workflow did not — so it ran against a
            # stale pre-#533 compose file that lacked the profile-gated graph-ops
            # service (added deploy#533; migrate index pre-step deploy#535),
            # failing at `compose pull` with "no such service: graph-ops"
            # (deploy#536). Placed above the dry-run early-exit so BOTH the
            # dry-run (compose config) and real (compose pull/run) paths validate
            # against the current compose file. Idempotent; updates the on-disk
            # files only — graph-ops uses `run --rm`, not `up`, so the running
            # stack is untouched.
            echo "==> Pulling latest deploy config..."
            # Guarded (this script runs `set -uo pipefail`, NO -e): an unguarded
            # `git fetch` failure would not abort, and the following
            # `reset --hard origin/main` would succeed against the STALE
            # remote-tracking ref — leaving the box on an old tree, the exact
            # failure mode this PR fixes. Match the script's `|| { echo ERROR; exit 1; }` idiom.
            git fetch origin main \
              || { echo "ERROR: [${ENV_NAME}] git fetch origin main failed — refusing to run against a stale checkout." >&2; exit 1; }
            git reset --hard origin/main \
              || { echo "ERROR: [${ENV_NAME}] git reset --hard origin/main failed." >&2; exit 1; }

            # Map the operation input to the loader CLI subcommand. The image
            # ENTRYPOINT is `python -m src.cli`, so the subcommand is the full
            # arg list (creds come from the container env, never argv).
            case "${OPERATION}" in
              migrate)       SUBCMD="migrate-transmitted-hadith-ids" ;;
              enrich)        SUBCMD="enrich" ;;
              # prune-orphans is Neo4j-only: no loader CLI subcommand, no image.
              # Its whole path runs below via run_cypher (cypher-shell in neo4j).
              prune-orphans) SUBCMD="" ;;
              *) echo "ERROR: unknown operation '${OPERATION}'." >&2; exit 2 ;;
            esac

            echo "==> [${ENV_NAME}] graph op — operation=${OPERATION} (cli: ${SUBCMD}) dry_run=${DRY_RUN}"
            echo "==> [${ENV_NAME}] image=${IMAGE}"

            # .env on the VPS (mode 600, written by the deploy workflow) is the
            # single source of truth for NEO4J credentials. compose interpolates
            # the graph-ops service env (NEO4J_PASSWORD / ...) from it — the
            # creds never reach this script's argv or the container's argv
            # (CWE-214). Same .env contract as reembed-corpus.yml.
            if [ ! -f .env ]; then
              echo "ERROR: /opt/noorinalabs-deploy/.env is missing on ${ENV_NAME} VPS." >&2
              echo "       The deploy workflow has never written an env-file here, or it was removed." >&2
              exit 1
            fi

            # Pin the loader image for the compose `graph-ops` service.
            # GRAPH_OPS_IMAGE overrides the compose default (env wins over .env).
            export GRAPH_OPS_IMAGE="${IMAGE}"

            # Same project name + compose file the deploys use, so `run` attaches
            # to the live project's `backend` network and the live neo4j.
            # --profile graph-ops activates the otherwise-gated service.
            COMPOSE="docker compose -p noorinalabs -f compose/docker-compose.prod.yml --env-file .env"
            COMPOSE_OPS="${COMPOSE} --profile graph-ops"

            # cypher-shell helper for the post-op verification gate. Runs INSIDE
            # the live neo4j container and reads the password from that
            # container's OWN NEO4J_AUTH (neo4j/<pw>) — never on our argv, never
            # over the GH transport. cypher-shell honors NEO4J_USERNAME /
            # NEO4J_PASSWORD env vars, so the credential stays in the container
            # env and is not on cypher-shell's argv either. --format plain gives
            # a header line + data rows. The query text ($1) is not a secret.
            run_cypher() {
              ${COMPOSE} exec -T neo4j sh -c \
                'NEO4J_USERNAME=neo4j NEO4J_PASSWORD="${NEO4J_AUTH#neo4j/}" exec cypher-shell --format plain "$1"' \
                _ "$1"
            }

            # Run a single-column count() query via run_cypher and echo just the
            # integer (--format plain header line stripped, non-digits removed).
            # Used by the migration invariant gate and the prune-orphans gate.
            run_count() {
              _out="$(run_cypher "$1")" || return 1
              printf '%s\n' "${_out}" | tail -n +2 | head -n1 | tr -dc '0-9'
            }

            # --- prune-orphans + migration-invariant Cypher (deploy#538).
            #     Shared by the dry-run and real-run paths. Each is a SINGLE
            #     statement (da#319: never a multi-statement string) with
            #     double-quoted string literals inside the single-quoted shell
            #     string. `CALL {} IN TRANSACTIONS` may run ONLY in an implicit
            #     (auto-commit) transaction. cypher-shell 5.x removed the `:auto`
            #     client command (a 4.x mechanism); non-interactive cypher-shell
            #     auto-commits statements fed on STDIN by default, which is
            #     exactly the implicit-tx context CALL {} IN TRANSACTIONS needs —
            #     so PRUNE_Q carries NO client-command prefix (deploy#540).
            #
            #   RAW_Q       run-order guard / migration invariant: count edges
            #               whose id is still raw-form (not `hdt:`-prefixed). >0
            #               means canonicalization is incomplete (migrate) or the
            #               graph is un-canonicalized (prune refuses).
            #   DANGLING_Q  count edges whose hadith_id joins no Hadith node
            #               (the orphans prune removes; reported as info by migrate).
            #   RESOLVING_Q count edges whose hadith_id DOES join a Hadith node
            #               (includes the lk six-books canonical chains). The
            #               prune non-over-deletion gate asserts this is UNCHANGED.
            #   PRUNE_Q     batched DELETE of dangling edges only.
            RAW_Q='MATCH ()-[t:TRANSMITTED_TO]->() WHERE t.hadith_id IS NOT NULL AND t.hadith_id <> "" AND NOT t.hadith_id STARTS WITH "hdt:" RETURN count(t) AS raw_remaining'
            DANGLING_Q='MATCH ()-[t:TRANSMITTED_TO]->() WHERE t.hadith_id IS NOT NULL AND t.hadith_id <> "" AND NOT EXISTS { MATCH (:Hadith {id: t.hadith_id}) } RETURN count(t) AS dangling'
            RESOLVING_Q='MATCH ()-[t:TRANSMITTED_TO]->() WHERE t.hadith_id IS NOT NULL AND t.hadith_id <> "" AND EXISTS { MATCH (:Hadith {id: t.hadith_id}) } RETURN count(t) AS resolving'
            PRUNE_Q='MATCH ()-[t:TRANSMITTED_TO]->() WHERE t.hadith_id IS NOT NULL AND t.hadith_id <> "" AND NOT EXISTS { MATCH (:Hadith {id: t.hadith_id}) } CALL (t) { DELETE t } IN TRANSACTIONS OF 10000 ROWS'

            if [ "${DRY_RUN}" = "true" ]; then
              if [ "${OPERATION}" = "prune-orphans" ]; then
                # prune-orphans dry run: DESCRIBE the plan and issue a READ-ONLY
                # pre-count (the run-order guard state + dangling count). It
                # issues NO writes and NO delete (deploy#538). No loader image is
                # involved, so no GHCR login / compose pull happens on this path.
                echo "==> [${ENV_NAME}] DRY RUN (prune-orphans) — read-only pre-count only; NO edges deleted."
                echo "    would first assert the run-order guard (refuse the prune if raw-form ids remain):"
                echo "      ${RAW_Q}"
                echo "    would then batch-DELETE dangling edges (cypher-shell in the neo4j container):"
                echo "      ${PRUNE_Q}"
                echo "    would then verify: 0 dangling remain AND resolving-chain count UNCHANGED from pre-count."
                echo "==> [${ENV_NAME}] read-only pre-count (issues no writes):"
                RAW="$(run_count "${RAW_Q}")" \
                  || { echo "ERROR: [${ENV_NAME}] raw-id guard pre-count failed to execute." >&2; exit 1; }
                RAW="${RAW:-0}"
                DANGLING_PRE="$(run_count "${DANGLING_Q}")" \
                  || { echo "ERROR: [${ENV_NAME}] dangling pre-count failed to execute." >&2; exit 1; }
                DANGLING_PRE="${DANGLING_PRE:-0}"
                echo "    raw-form (non-hdt:) ids: ${RAW}  (must be 0 for a real prune to proceed)"
                echo "    dangling edges that WOULD be deleted: ${DANGLING_PRE}"
                if [ "${RAW}" -ne 0 ]; then
                  echo "    NOTE: raw-form ids > 0 — a real prune would be REFUSED here; run 'migrate' on this env first."
                fi
                echo "==> [${ENV_NAME}] dry run complete (exit 0)."
                exit 0
              fi
              echo "==> [${ENV_NAME}] DRY RUN — no Cypher issued, no edges rewritten, no centrality computed."
              echo "    image: ${GRAPH_OPS_IMAGE}"
              if [ "${OPERATION}" = "migrate" ]; then
                # Mirrors the real-run pre-step below: migrate-only, before the
                # rewrite. Dry run only DESCRIBES it — issues no Cypher (deploy#534).
                echo "    would first ensure the TRANSMITTED_TO(hadith_id) rel-property index"
                echo "    (idempotent; cypher-shell in the neo4j container, awaited ONLINE before the rewrite):"
                echo "      CREATE INDEX transmitted_to_hadith_id IF NOT EXISTS FOR ()-[t:TRANSMITTED_TO]-() ON (t.hadith_id);"
                echo "      CALL db.awaitIndexes(600);"
              fi
              echo "    would run (compose service graph-ops, network backend):"
              echo "      docker compose --profile graph-ops run --rm --no-deps graph-ops ${SUBCMD}"
              echo "    would then verify (cypher-shell in the neo4j container):"
              if [ "${OPERATION}" = "migrate" ]; then
                echo "      - migration invariant: 0 raw-form (non-hdt:) TRANSMITTED_TO.hadith_id edges remain"
                echo "      - sample chain reconstructs non-empty"
                echo "      - (informational) dangling-ref count reported, NOT gated — completeness is prune-orphans' job"
              else
                echo "      - MATCH (n:Narrator) WHERE n.betweenness_centrality IS NOT NULL RETURN count(n) > 0"
                echo "      - echo top-k narrators by betweenness"
              fi
              # Read-only: confirm the graph-ops service resolves under the live
              # .env (catches config/secret drift without issuing any Cypher).
              if ${COMPOSE_OPS} config graph-ops >/dev/null 2>&1; then
                echo "    compose config: graph-ops resolves OK under live .env"
              else
                echo "    WARNING: compose config for graph-ops did not resolve under live .env" >&2
              fi
              echo "==> [${ENV_NAME}] dry run complete (exit 0)."
              exit 0
            fi

            # ===================== prune-orphans (real run) =====================
            # Neo4j-ONLY op (deploy#538): no loader image, so this path runs
            # BEFORE the GHCR login + compose pull + rel-index pre-step below and
            # exits when done. Deletes ONLY dangling TRANSMITTED_TO edges
            # (hadith_id joins no Hadith), batched. Guarded so it can NEVER run
            # before migrate: pre-canonicalization every edge id is raw-form and
            # would match the dangling predicate — pruning first would wipe the
            # graph.
            if [ "${OPERATION}" = "prune-orphans" ]; then
              # --- run-order guard: refuse to prune an un-canonicalized graph ---
              echo "==> [${ENV_NAME}] prune guard: assert graph is canonicalized (raw-form id count == 0)"
              RAW="$(run_count "${RAW_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] raw-id guard query failed to execute." >&2; exit 1; }
              RAW="${RAW:-0}"
              echo "    raw-form (non-hdt:) TRANSMITTED_TO.hadith_id edges: ${RAW}"
              if [ "${RAW}" -ne 0 ]; then
                echo "ERROR: [${ENV_NAME}] refusing to prune — ${RAW} raw-form edge id(s) remain; the graph is NOT canonicalized. Run 'migrate' on this env FIRST (deploy#538 run-order guard)." >&2
                exit 1
              fi

              # --- pre-counts: dangling (to delete) + resolving (must be UNCHANGED) ---
              echo "==> [${ENV_NAME}] prune pre-count: dangling + resolving TRANSMITTED_TO edges"
              DANGLING_PRE="$(run_count "${DANGLING_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] dangling pre-count query failed to execute." >&2; exit 1; }
              DANGLING_PRE="${DANGLING_PRE:-0}"
              RESOLVING_PRE="$(run_count "${RESOLVING_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] resolving pre-count query failed to execute." >&2; exit 1; }
              RESOLVING_PRE="${RESOLVING_PRE:-0}"
              echo "    dangling (to delete): ${DANGLING_PRE} | resolving (must stay): ${RESOLVING_PRE}"

              # --- batched delete (single statement; implicit auto-commit tx) ---
              # `CALL {} IN TRANSACTIONS` may run ONLY in an implicit (auto-commit)
              # transaction. cypher-shell 5.x removed the `:auto` client command
              # (a 4.x construct); a non-interactive cypher-shell auto-commits each
              # statement fed on STDIN by default, so the single PRUNE_Q statement
              # runs in the implicit tx CALL {} IN TRANSACTIONS requires with NO
              # client-command prefix. It MUST be fed on STDIN (not argv) and stay
              # a single statement (deploy#540). Same in-container credential
              # handling as run_cypher: password from the neo4j container's own
              # NEO4J_AUTH, never on argv/log; the query text is not a secret.
              echo "==> [${ENV_NAME}] prune: batched DELETE of dangling edges (CALL {} IN TRANSACTIONS OF 10000 ROWS)"
              printf '%s\n' "${PRUNE_Q}" | ${COMPOSE} exec -T neo4j sh -c \
                'NEO4J_USERNAME=neo4j NEO4J_PASSWORD="${NEO4J_AUTH#neo4j/}" exec cypher-shell --format plain' \
                || { echo "ERROR: [${ENV_NAME}] prune DELETE failed to execute." >&2; exit 1; }

              # --- post-op gate: 0 dangling remain AND resolving count UNCHANGED ---
              echo "==> [${ENV_NAME}] prune verify: 0 dangling remain AND resolving count unchanged (non-over-deletion)"
              DANGLING_POST="$(run_count "${DANGLING_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] dangling post-count query failed to execute." >&2; exit 1; }
              DANGLING_POST="${DANGLING_POST:-0}"
              RESOLVING_POST="$(run_count "${RESOLVING_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] resolving post-count query failed to execute." >&2; exit 1; }
              RESOLVING_POST="${RESOLVING_POST:-0}"
              echo "    dangling now: ${DANGLING_POST} (was ${DANGLING_PRE}) | resolving now: ${RESOLVING_POST} (was ${RESOLVING_PRE})"
              if [ "${DANGLING_POST}" -ne 0 ]; then
                echo "ERROR: [${ENV_NAME}] prune verification FAILED — ${DANGLING_POST} dangling edge(s) still remain after prune." >&2
                exit 1
              fi
              if [ "${RESOLVING_POST}" -ne "${RESOLVING_PRE}" ]; then
                echo "ERROR: [${ENV_NAME}] prune verification FAILED — resolving-chain count changed (${RESOLVING_PRE} -> ${RESOLVING_POST}); prune deleted non-dangling edges. Investigate before re-running." >&2
                exit 1
              fi
              echo "    deleted ${DANGLING_PRE} dangling edge(s); 0 remain; resolving chains unchanged (${RESOLVING_PRE})."
              echo "==> [${ENV_NAME}] graph op 'prune-orphans' complete — post-op verification PASSED."
              exit 0
            fi

            # GHCR login so the loader image can be pulled; trap logs out at
            # end-of-run so no credentials persist on the box.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin \
              || { echo "ERROR: [${ENV_NAME}] GHCR login failed." >&2; exit 1; }

            echo "==> [${ENV_NAME}] pulling loader image ${GRAPH_OPS_IMAGE} ..."
            ${COMPOSE_OPS} pull graph-ops \
              || { echo "ERROR: [${ENV_NAME}] compose pull graph-ops (${GRAPH_OPS_IMAGE}) failed." >&2; exit 1; }

            # --- migrate pre-step: ensure the TRANSMITTED_TO(hadith_id) rel-property
            #     index exists and is ONLINE before the in-place rewrite (deploy#534).
            #     migrate-transmitted-hadith-ids matches
            #     ()-[t:TRANSMITTED_TO {hadith_id: raw}]->() per value across ~523k
            #     distinct ids / ~2.68M edges; with no rel-property index each MATCH
            #     is a full relationship scan and the rewrite can't finish in the SSH
            #     window. IF NOT EXISTS makes it idempotent; db.awaitIndexes blocks
            #     until the index is ONLINE/populated so the rewrite reads an indexed
            #     graph. Same credential handling as the verification gate
            #     (run_cypher): password from the neo4j container's own NEO4J_AUTH,
            #     never on argv/log. enrich does not need it, so it is migrate-only.
            #     Fail the job if the index cannot be ensured/awaited — never run the
            #     rewrite against an unindexed graph. Run as two statements (schema
            #     create, then await) rather than one multi-statement string.
            if [ "${OPERATION}" = "migrate" ]; then
              echo "==> [${ENV_NAME}] ensure rel-property index transmitted_to_hadith_id (idempotent, pre-migrate)"
              run_cypher 'CREATE INDEX transmitted_to_hadith_id IF NOT EXISTS FOR ()-[t:TRANSMITTED_TO]-() ON (t.hadith_id)' \
                || { echo "ERROR: [${ENV_NAME}] could not create/ensure the TRANSMITTED_TO(hadith_id) rel-property index; refusing to run migrate against an unindexed graph." >&2; exit 1; }
              echo "==> [${ENV_NAME}] await index ONLINE (db.awaitIndexes, up to 600s) before the rewrite"
              run_cypher 'CALL db.awaitIndexes(600)' \
                || { echo "ERROR: [${ENV_NAME}] TRANSMITTED_TO(hadith_id) index did not come ONLINE within the await window; refusing to run migrate against an unindexed graph." >&2; exit 1; }
              echo "    index transmitted_to_hadith_id present and ONLINE."
            fi

            # --- run the op (--no-deps: DBs are already up on the live stack;
            #     do NOT let `run` recreate neo4j) ---
            echo "==> [${ENV_NAME}] docker compose --profile graph-ops run --rm --no-deps graph-ops ${SUBCMD}"
            RC=0
            ${COMPOSE_OPS} run --rm --no-deps graph-ops "${SUBCMD}" || RC=$?
            if [ "${RC}" -ne 0 ]; then
              echo "ERROR: [${ENV_NAME}] graph op '${OPERATION}' (${SUBCMD}) failed (rc=${RC})." >&2
              exit "${RC}"
            fi

            # --- post-op verification gate ---
            if [ "${OPERATION}" = "migrate" ]; then
              # Migration INVARIANT (deploy#538): migrate's job is
              # canonicalization, NOT completeness. Gate on (a) 0 raw-form
              # (non-`hdt:`) ids remaining and (b) a sample chain resolving
              # non-empty. The absolute dangling-ref count is REPORTED as
              # informational only — it is legitimately non-zero due to
              # pre-existing orphaned duplicate chains (the ~196k fawaz six-books
              # edges) whose removal is the separate prune-orphans op's job.
              # Failing migrate on dangling refs would conflate canonicalization
              # with completeness and — worse — cannot be migrate's gate at all,
              # since prune MUST run AFTER migrate (see the run-order guard).
              echo "==> [${ENV_NAME}] verify (invariant): 0 raw-form (non-hdt:) TRANSMITTED_TO.hadith_id ids remain"
              RAW_REMAINING="$(run_count "${RAW_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] raw-id invariant query failed to execute." >&2; exit 1; }
              RAW_REMAINING="${RAW_REMAINING:-0}"
              echo "    raw-form (non-hdt:) TRANSMITTED_TO.hadith_id edges: ${RAW_REMAINING}"
              if [ "${RAW_REMAINING}" -ne 0 ]; then
                echo "ERROR: [${ENV_NAME}] migrate verification FAILED — ${RAW_REMAINING} TRANSMITTED_TO.hadith_id edge(s) still carry a raw-form (non-'hdt:') id; canonicalization is INCOMPLETE (da#325)." >&2
                exit 1
              fi

              # Informational only — do NOT fail migrate on dangling refs.
              echo "==> [${ENV_NAME}] report (informational, NOT gated): dangling TRANSMITTED_TO.hadith_id refs"
              DANGLING="$(run_count "${DANGLING_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] dangling info-count query failed to execute." >&2; exit 1; }
              DANGLING="${DANGLING:-0}"
              echo "    dangling refs (edges whose hadith_id joins no Hadith): ${DANGLING} — INFO ONLY; run 'prune-orphans' to remove them."

              echo "==> [${ENV_NAME}] verify: a sample chain reconstructs non-empty"
              # Sample a hadith_id from a RESOLVING edge ONLY — one whose
              # hadith_id joins an existing Hadith node — then confirm it yields
              # a non-empty set of chain edges (the exact join
              # GET /graph/hadith/{id}/chain performs). The `EXISTS { MATCH
              # (:Hadith {id: t.hadith_id}) }` predicate before `LIMIT 1` is what
              # makes this consistent with the migrate-invariant design (deploy#542):
              # migrate verifies canonicalization + that a *resolving* chain
              # reconstructs, independent of the pre-existing dangling fawaz
              # orphans (whose removal is prune-orphans' job, reported info-only
              # above). Without it, `LIMIT 1` could land on one of the ~196k
              # dangling orphan edges — a non-deterministic pick by storage scan
              # order — and the downstream `MATCH (:Hadith {id: hid})` would drop
              # the row, false-failing an otherwise-correct migration.
              CHAIN_Q='MATCH ()-[t:TRANSMITTED_TO]->() WHERE t.hadith_id IS NOT NULL AND t.hadith_id <> "" AND EXISTS { MATCH (:Hadith {id: t.hadith_id}) } WITH t.hadith_id AS hid LIMIT 1 MATCH (:Hadith {id: hid}) MATCH p=()-[:TRANSMITTED_TO {hadith_id: hid}]->() RETURN count(p) AS chain_edges'
              COUT="$(run_cypher "${CHAIN_Q}")" \
                || { echo "ERROR: [${ENV_NAME}] sample-chain query failed to execute." >&2; exit 1; }
              printf '%s\n' "${COUT}"
              CHAIN_EDGES="$(printf '%s\n' "${COUT}" | tail -n +2 | head -n1 | tr -dc '0-9')"
              CHAIN_EDGES="${CHAIN_EDGES:-0}"
              if [ "${CHAIN_EDGES}" -le 0 ]; then
                echo "ERROR: [${ENV_NAME}] migrate verification FAILED — sample chain reconstructed EMPTY (0 chain edges for the sampled hadith)." >&2
                exit 1
              fi
              echo "    sample chain reconstructs non-empty (chain_edges=${CHAIN_EDGES})."
              echo "==> [${ENV_NAME}] migrate verified (invariant) — 0 raw-form ids, sample chain non-empty (dangling refs=${DANGLING}, informational)."

            else
              echo "==> [${ENV_NAME}] verify: narrator betweenness_centrality is populated"
              BOUT="$(run_cypher 'MATCH (n:Narrator) WHERE n.betweenness_centrality IS NOT NULL RETURN count(n) AS cnt')" \
                || { echo "ERROR: [${ENV_NAME}] centrality-count query failed to execute." >&2; exit 1; }
              printf '%s\n' "${BOUT}"
              CNT="$(printf '%s\n' "${BOUT}" | tail -n +2 | head -n1 | tr -dc '0-9')"
              CNT="${CNT:-0}"
              if [ "${CNT}" -le 0 ]; then
                echo "ERROR: [${ENV_NAME}] enrich verification FAILED — no Narrator has betweenness_centrality set (da#326)." >&2
                exit 1
              fi
              echo "    narrators with betweenness_centrality: ${CNT}"
              echo "==> [${ENV_NAME}] top-k choke-point narrators by betweenness:"
              run_cypher 'MATCH (n:Narrator) WHERE n.betweenness_centrality IS NOT NULL RETURN n.id AS id, coalesce(n.name_ar, n.name) AS name, n.betweenness_centrality AS bc ORDER BY bc DESC LIMIT 10' \
                || echo "    WARNING: top-k echo query failed (non-fatal)." >&2
              echo "==> [${ENV_NAME}] enrich verified — betweenness_centrality populated on ${CNT} narrators."
            fi

            echo "==> [${ENV_NAME}] graph op '${OPERATION}' complete — post-op verification PASSED."

      - name: Report
        if: always()
        env:
          ENV_NAME: ${{ inputs.env }}
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## Graph op ${OPERATION} (${ENV_NAME}): ${JOB_STATUS}"
            echo ""
            echo "- **Env:** ${ENV_NAME}"
            echo "- **Operation:** ${OPERATION}"
            echo "- **Dry run:** ${DRY_RUN}"
            echo "- **Image:** ${IMAGE}"
            echo ""
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Dry run — no Cypher issued, no edges rewritten, no centrality computed."
            fi
            echo "stg-gated (deploy#532): prod runs ONLY as a promotion of a verified-good stg run."
            echo "Run order per env: migrate FIRST, then prune-orphans (needs a canonicalized graph; guarded), then enrich."
          } >> "$GITHUB_STEP_SUMMARY"
