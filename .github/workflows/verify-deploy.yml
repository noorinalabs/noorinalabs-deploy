# Verify Deployment — split by environment.
#
# Two jobs, two triggers, two failure semantics:
#
#   verify-stg  — runs the full cross-repo integration suite (deploy#81)
#                 on every successful stg deploy. Failure blocks any
#                 prod-promote attempt that consumes the stg artifact
#                 (gate enforcement is deploy#179).
#
#   verify-prod — runs a tight (<60s) smoke battery on every successful
#                 prod deploy. Failure surfaces a `::error::` annotation
#                 for owner investigation; no auto-rollback (no rollback
#                 policy currently exists).
#
# Why split (vs. matrix.env):
#   - Different upstream `workflow_run.workflows` triggers per env
#   - Different runtime budgets (stg ~10–15min, prod <60s)
#   - Different failure semantics (stg blocks promote, prod alerts)
#   - Different `environment:` scopes (stg URLs vs prod URLs)
#
# Trigger note: the previous version watched "Deploy noorinalabs-isnad-graph"
# which is now LEGACY (deploy-isnad-graph.yml line 1). Active deploys are
# "Deploy to staging" and "Deploy to production" — repointed below as part
# of deploy#87 (the split is unimplementable otherwise; trigger today fires
# on a workflow nobody runs).
#
# Trigger expansion (deploy#73, P3W1 Round 2):
#   - "Deploy All Services" — manual-dispatch full-stack prod deploy. Same
#     environment: production as deploy-prod.yml; benefits from the same
#     post-deploy smoke battery.
#   - "Rollback" — manual-dispatch prod tag rollback. A rollback IS a deploy
#     for verification purposes; the prod stack just changed so smoke-test it.
#
# Why NOT add legacy/manual workflows:
#   - "Deploy noorinalabs-isnad-graph (LEGACY — manual only)" and
#     "Deploy noorinalabs-landing-page (LEGACY — manual only)" target the
#     legacy single-VPS box that deploy#86 will decommission. Auto-verify
#     against legacy-VPS endpoints would smoke against URLs that no longer
#     resolve once #86 lands. Operators running the legacy paths invoke
#     scripts/verify_deployment.sh manually if they want post-deploy checks
#     against the legacy host (the script grew landing + user-service checks
#     in this same PR for that purpose).

name: Verify Deployment

on:
  workflow_run:
    workflows:
      - "Deploy to staging"
      - "Deploy to production"
      - "Deploy All Services"
      - "Rollback"
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Which env to verify (stg|prod). Required for manual dispatch."
        required: true
        default: "stg"
        type: choice
        options: [stg, prod]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stg: full cross-repo integration suite (hermetic, in-CI compose).
  # See deploy#178 for the follow-up that adds remote-mode against
  # the deployed stg URLs.
  # ─────────────────────────────────────────────────────────────────
  verify-stg:
    name: Verify stg (remote-mode integration suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    # Belt-and-suspenders: run-tests.sh's remote branch already hard-refuses
    # on ENVIRONMENT in {prod, production} (#178 / PR #202). Setting it
    # explicitly at the workflow level makes verify-stg impossible to
    # mis-point at prod even if someone manually edits the job-level env
    # block. Cheap redundancy for a load-bearing safety check.
    env:
      ENVIRONMENT: stg
      RUN_MODE: remote
      # Public stg URLs — these are the same hostnames operators hit in a
      # browser. Caddy auto-provisions LE TLS for them; per #157 the
      # `users.stg.noorinalabs.com` cutover lives in the wave's Caddyfile.
      ISNAD_BASE_URL: https://isnad.stg.noorinalabs.com
      USER_SERVICE_BASE_URL: https://users.stg.noorinalabs.com
      # QA test-user creds for the smoke's authenticated semantic probe
      # (check 8 / deploy#527). This is the SAME identity the deploy seeds
      # via bootstrap_test_user.py (deploy#508): TEST_USER_EMAIL is a
      # non-secret var (qa-stg@noorinalabs.com), TEST_USER_PASSWORD the
      # secret. Both are ENVIRONMENT-scoped on `staging`, which the job's
      # `environment: staging` above makes resolvable — the previous
      # `secrets.STG_TEST_USER_*` names never existed (no repo/env secret by
      # that name) so they resolved BLANK, which is why check 8 hit the
      # semantic endpoint unauthenticated and 401'd (the deploy#527 bug).
      TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      # Integration suite (conftest/run-tests.sh) keys its refresh-token
      # auth_session flow off STG_TEST_USER_EMAIL; point it at the same var
      # so the identity is honest (was `secrets.STG_TEST_USER_EMAIL`, which
      # never existed → blank). STG_TEST_USER_REFRESH_TOKEN remains unset, so
      # those auth_session tests still skip until it is provisioned (#204).
      STG_TEST_USER_EMAIL: ${{ vars.TEST_USER_EMAIL }}
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Deploy to staging' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'stg')
    steps:
      # ref pin matters: workflow_run defaults checkout to the default
      # branch (main), which would silently run a wave-branch deploy's
      # verify against main's revision. Pin to the upstream deploy's
      # head_sha (sha is more stable than head_branch — branch may have
      # moved between trigger and run). See deploy#181 review (Weronika).
      #
      # Sibling-repo checkouts (user-service + isnad-graph) and Buildx
      # setup were dropped in #205 — remote mode runs against deployed
      # stg URLs, doesn't build images locally. The wave-aware sibling
      # ref resolution is therefore unused here. If hermetic local
      # verification is ever revived, restore that sequence from
      # `git show 6e8f450:.github/workflows/verify-deploy.yml`.
      - name: Checkout noorinalabs-deploy
        uses: actions/checkout@v6
        with:
          path: noorinalabs-deploy
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ── Fast-fail smoke gate (deploy#379, P3 #8 stg arm) ──────────────
      # The stg counterpart to verify-prod's smoke battery. Runs FIRST so
      # a plainly-unreachable stg stack (Caddy down, a vhost not routing,
      # the auth plane dead) fails the job in ~30s instead of paying the
      # remote integration suite's ~10–30min wall-clock only to fail at the
      # end. It is a pre-flight probe, NOT a replacement for the suite —
      # set -e propagates the script's exit 1, so a smoke FAIL short-
      # circuits the job (the suite step below never runs) and, exactly
      # like a suite failure, results in stg-verify-result=failure, which
      # promote.yml hard-blocks prod-promote on (deploy#179/#199). The
      # report-upload + summary steps below are `if: always()` so the
      # smoke table still surfaces even when this step fails.
      #
      # ISNAD_BASE_URL / USER_SERVICE_BASE_URL come from the job-level env
      # (the stg public URLs). LANDING_BASE_URL is stg-specific: stg's
      # landing is the apex stg.noorinalabs.com (vs prod's noorinalabs.com),
      # so it's set here rather than at job level. The script defaults to
      # the same values if the env is unset (see scripts/verify_stg_smoke.sh).
      # TEST_USER_EMAIL / TEST_USER_PASSWORD are inherited from the job env
      # too — they drive check 8's authenticated semantic probe (deploy#527);
      # absent, that check degrades to an auth-gated reachability assertion.
      - name: Run stg smoke battery (fast-fail gate)
        working-directory: noorinalabs-deploy
        env:
          LANDING_BASE_URL: https://stg.noorinalabs.com
          SMOKE_REPORT: smoke-report.md
        run: |
          set -o pipefail
          chmod +x scripts/verify_stg_smoke.sh
          ./scripts/verify_stg_smoke.sh 2>&1 | tee smoke-output.txt

      - name: Upload stg smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-stg-smoke-output
          path: |
            noorinalabs-deploy/smoke-output.txt
            noorinalabs-deploy/smoke-report.md
          retention-days: 14

      - name: Append stg smoke report to job summary
        if: always()
        run: |
          if [ -f noorinalabs-deploy/smoke-report.md ]; then
            cat noorinalabs-deploy/smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Stg smoke — gate did not produce a report"
              echo ""
              echo "_smoke-report.md not produced; see verify-stg-smoke-output artifact._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # run-tests.sh in RUN_MODE=remote (#178 / PR #202) skips compose
      # stack-up entirely, builds the runner image from Dockerfile.runner,
      # and `docker run`s it against the env-supplied stg URLs. The
      # Dockerfile.runner build is pure-pip and doesn't need Buildx, so
      # there's no `setup-buildx-action` step here. Job env exports
      # USER_SERVICE_BASE_URL / ISNAD_BASE_URL above; the script sets
      # USER_SERVICE_URL / ISNAD_GRAPH_URL inside the runner container
      # for conftest.py compatibility.
      # ── Host provisioning + backup-timer assertions (deploy#558 / deploy#551) ──
      # isnad-backup.timer was never installed on stg or prod and nothing noticed for
      # months. The units, the tmpfiles.d entry and the cloud-init runcmd that installs
      # them were all committed and correct; what was missing was anything that CHECKED.
      # A timer a human installed by hand does not survive a reprovision, and we would
      # not learn that until we needed a backup. The install is not the deliverable --
      # this assertion is.
      #
      # The script body is a single invocation of a repo script that IS shellchecked in
      # CI ("shellcheck + bash -n (infra & scripts)"), because ssh-action `script:`
      # bodies are themselves unlinted (deploy#555). ssh-action fails the step on a
      # non-zero remote exit, so a missing/disabled/inactive timer fails verify-stg,
      # which in turn hard-blocks prod-promote (deploy#179/#199).
      - name: Assert host state (backup timer, staging dir, deploy home)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: sudo -n /opt/noorinalabs-deploy/scripts/assert_host_state.sh

      - name: Run integration suite (remote mode)
        working-directory: noorinalabs-deploy/integration-tests
        run: ./run-tests.sh

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-stg-junit
          path: noorinalabs-deploy/integration-tests/reports/

      # Compose-logs-on-failure dump was dropped with the hermetic stack
      # — there is no docker-compose stack to query in remote mode. Test
      # failure surfaces via the junit artifact above and via run-tests.sh
      # stdout in the job's run-log.

      # ── Schema v2 prep: resolve each service's stg-latest digest ─────
      # Schema v2 (deploy#199) gates prod-promote on per-service digest
      # equality between what verify-stg observed and what promote.yml's
      # plan resolves. We snapshot each service's `stg-latest` manifest
      # digest at verify-time so the gate has a fixed reference point to
      # compare against. Without this, the gate falls back to the v1
      # freshness window (a different service moving its stg-latest
      # post-verify but pre-promote ships unverified bits — the T1 window
      # documented in deploy#199).
      #
      # docker/login-action is required because GHCR rate-limits anonymous
      # manifest-inspect requests on private repos. We use the workflow's
      # GITHUB_TOKEN scoped via the existing `packages: read` permission
      # the workflow already has implicitly (verify-deploy.yml does not
      # set workflow-level permissions, so it inherits the default
      # GITHUB_TOKEN scope which includes packages:read for the org).
      - name: Log in to GHCR (for digest resolution)
        if: always() && job.status == 'success'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (for digest resolution)
        if: always() && job.status == 'success'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Resolve per-service stg-latest digests
        id: digests
        if: always() && job.status == 'success'
        run: |
          set -euo pipefail
          # Image mapping MUST stay in sync with promote.yml plan job's
          # `mapping` dict. If a service is added/renamed, update BOTH.
          # The cold-rebuild static-shape guard (#199) asserts both files
          # cover the same 4 keys.
          : > /tmp/service_digests.jsonl
          for entry in \
              "api:noorinalabs/noorinalabs-isnad-graph" \
              "frontend:noorinalabs/noorinalabs-isnad-graph-frontend" \
              "user-service:noorinalabs/noorinalabs-user-service" \
              "landing:noorinalabs/noorinalabs-landing-page"; do
            key="${entry%%:*}"
            image="${entry#*:}"
            full="ghcr.io/${image}"
            digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$full:stg-latest" 2>/dev/null || echo "")
            if [ -z "$digest" ]; then
              echo "::warning::Could not resolve stg-latest digest for $full — emitting empty digest. Gate may fall back to v1 semantics for this service."
            fi
            printf '{"key":"%s","digest":"%s"}\n' "$key" "$digest" >> /tmp/service_digests.jsonl
          done
          echo "Resolved digests:"
          cat /tmp/service_digests.jsonl

      # Artifact consumed by deploy#179 / #199 (promote.yml gate).
      # Schema v2 shape (current):
      # { "schema_version": 2,
      #   "result": "success"|"failure",
      #   "commit_sha": "...",
      #   "service_digests": {
      #     "api":          "sha256:...",
      #     "frontend":     "sha256:...",
      #     "user-service": "sha256:...",
      #     "landing":      "sha256:..."
      #   },
      #   "timestamp": "...",
      #   "run_id": "..." }
      #
      # v1 (legacy, consumed by gate via fallback path) had no
      # `service_digests` field. promote.yml's gate accepts both
      # schemas — v2 enables strict per-service equality, v1 falls
      # back to the freshness-window heuristic.
      #
      # `service_digests` is omitted when result != "success" — the
      # gate hard-blocks on failure result anyway, so emitting partial
      # digests on a failed verify would be misleading (digests resolved
      # post-failure don't represent what was actually verified).
      #
      # Filename includes run_id so promote.yml can validate freshness.
      # `schema_version` lets #199 consumers do graceful evolution.
      - name: Emit verify-stg-result artifact
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            RESULT="success"
          else
            RESULT="failure"
          fi
          # On workflow_run, prefer the upstream deploy's head_sha; otherwise
          # fall back to this workflow's GITHUB_SHA.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            COMMIT_SHA="${{ github.sha }}"
          fi
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="stg-verify-result-${{ github.run_id }}.json"

          # Build service_digests object from the jsonl (only if verify
          # succeeded — digest-resolution step is gated on success too).
          if [ "$RESULT" = "success" ] && [ -f /tmp/service_digests.jsonl ]; then
            DIGESTS_JSON=$(python3 -c "
          import json, sys
          out = {}
          for line in open('/tmp/service_digests.jsonl'):
              line = line.strip()
              if not line:
                  continue
              row = json.loads(line)
              out[row['key']] = row['digest']
          print(json.dumps(out))
          ")
          else
            DIGESTS_JSON="{}"
          fi

          python3 - <<PY > "$OUT"
          import json
          payload = {
              "schema_version": 2,
              "result": "$RESULT",
              "commit_sha": "$COMMIT_SHA",
              "service_digests": json.loads('''$DIGESTS_JSON'''),
              "timestamp": "$TS",
              "run_id": "${{ github.run_id }}",
          }
          print(json.dumps(payload))
          PY
          echo "Wrote $OUT:"
          cat "$OUT"

      - name: Upload verify-stg-result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stg-verify-result
          path: stg-verify-result-${{ github.run_id }}.json
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Verify stg — ${{ job.status }}"
            echo ""
            echo "Remote-mode integration suite (#205) against deployed stg URLs (\`$USER_SERVICE_BASE_URL\` / \`$ISNAD_BASE_URL\`)."
            echo ""
            if [ -f noorinalabs-deploy/integration-tests/reports/junit.xml ]; then
              echo "### Test counts"
              python3 - <<'PY' || true
          import xml.etree.ElementTree as ET
          try:
              t = ET.parse("noorinalabs-deploy/integration-tests/reports/junit.xml")
              r = t.getroot()
              tests = r.attrib.get("tests", "?")
              fails = r.attrib.get("failures", "?")
              errs = r.attrib.get("errors", "?")
              skips = r.attrib.get("skipped", "?")
              time = r.attrib.get("time", "?")
              print("| Metric | Value |")
              print("|--------|-------|")
              print(f"| Tests | {tests} |")
              print(f"| Failures | {fails} |")
              print(f"| Errors | {errs} |")
              print(f"| Skipped | {skips} |")
              print(f"| Duration | {time}s |")
          except Exception as e:
              print(f"_Could not parse junit.xml: {e}_")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify-stg-failure:
    name: Notify stg verify failure
    runs-on: ubuntu-latest
    needs: verify-stg
    if: always() && needs.verify-stg.result == 'failure'
    steps:
      - name: Surface stg failure
        run: |
          echo "::error::Stg verify-deploy failed — prod-promote will be blocked once deploy#179 lands."
          {
            echo "## Stg verify FAILED"
            echo ""
            echo "The full integration suite did not pass against the stg deployment context."
            echo "Investigate before promoting to prod. The promote.yml gate (deploy#179) will hard-block prod-promote on this state."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────
  # Prod: tight smoke battery (<60s).
  # Health endpoints, narrator query (expect 401), auth wiring (route
  # reachability only — no creds in prod, per Bereket sign-off).
  # ─────────────────────────────────────────────────────────────────
  verify-prod:
    name: Verify prod (smoke battery)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    # Multi-trigger acceptance (deploy#73): three prod-touching upstream
    # workflows now share verify-prod. All produce the same post-state
    # invariant (prod stack just got rolled forward or back), so the same
    # smoke battery is the right post-condition for all three. The
    # workflow_run.name check enumerates them rather than allow-everything
    # so a future stg-targeting workflow accidentally hitting this trigger
    # list does not run prod smoke against itself.
    if: >-
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.name == 'Deploy to production' ||
        github.event.workflow_run.name == 'Deploy All Services' ||
        github.event.workflow_run.name == 'Rollback') &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    steps:
      # ref pin matters: workflow_run defaults checkout to the default
      # branch (main), which would silently run a wave-branch deploy's
      # verify against main's revision. Same fix as verify-stg above.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Wait briefly for services to settle
        run: sleep 10

      # Post-cutover topology (#226 / emergency 2026-05-02 + #245 phase 2):
      # frontend + isnad-graph API on isnad.{base}; pure user-service API
      # surface on users.{base}. The legacy isnad-graph.{base} hostname was
      # retired during the emergency CF DNS reconciliation. Both vhosts are
      # currently dual-bound for /auth/* and JWKS during the absolute-URL
      # frontend cutover; user-service smoke-targets resolve cleanly via
      # either, but USER_SERVICE_BASE_URL is the canonical pure surface.
      - name: Run prod smoke battery
        env:
          ISNAD_BASE_URL: https://isnad.noorinalabs.com
          USER_SERVICE_BASE_URL: https://users.noorinalabs.com
          LANDING_BASE_URL: https://noorinalabs.com
          SMOKE_REPORT: smoke-report.md
        run: |
          set -o pipefail
          chmod +x scripts/verify_prod_smoke.sh
          ./scripts/verify_prod_smoke.sh 2>&1 | tee smoke-output.txt

      # Same assertion on prod. Prod is where a missing backup actually costs us:
      # user-postgres holds accounts, sessions and the audit_log, none of which the
      # pipeline artifact can rebuild. See deploy#558 / deploy#551.
      - name: Assert host state (backup timer, staging dir, deploy home)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: sudo -n /opt/noorinalabs-deploy/scripts/assert_host_state.sh

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-prod-smoke-output
          path: |
            smoke-output.txt
            smoke-report.md
          retention-days: 14

      - name: Append smoke report to job summary
        if: always()
        run: |
          if [ -f smoke-report.md ]; then
            cat smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Verify prod — ${{ job.status }}"
              echo ""
              echo "_smoke-report.md not produced; see smoke-output.txt artifact._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  notify-prod-failure:
    name: Notify prod smoke failure
    runs-on: ubuntu-latest
    needs: verify-prod
    if: always() && needs.verify-prod.result == 'failure'
    steps:
      - name: Surface prod smoke failure
        run: |
          echo "::error::Prod verify-deploy smoke battery FAILED — owner investigate immediately."
          {
            echo "## Prod smoke FAILED"
            echo ""
            echo "One or more checks in the prod smoke battery did not pass. There is no auto-rollback policy."
            echo "Investigate via the verify-prod-smoke-output artifact and the upstream prod deploy logs."
          } >> "$GITHUB_STEP_SUMMARY"
